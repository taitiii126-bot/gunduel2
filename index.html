  drawMouth(g,L.mouth,hx+d*r*F.mouthX,hy+r*F.mouthY,r,d);
  g.restore();
}
// 目：ふつうの感じにする（キラキラの光やまつげは控えめ。光は小さく1つだけ）。目の色は少し暗くして自然に
function drawEye(g,st,ex,ey,w,h,d,eyeC,r){
  var ink=OUTLINE,lw=r*.055,iris=shadeHex(eyeC,-.4),hl='rgba(255,255,255,.9)';
  switch(st){
    case 1:   // するどい：細めのつり目
      var P=function(){g.beginPath();g.moveTo(ex-d*w*1.15,ey+h*.18);g.quadraticCurveTo(ex-d*w*.1,ey-h*.95,ex+d*w*1.2,ey-h*.34);g.quadraticCurveTo(ex+d*w*.15,ey+h*.78,ex-d*w*1.15,ey+h*.18);g.closePath();};
      P();g.fillStyle='#FFFFFF';g.fill();
      g.save();P();g.clip();g.beginPath();g.arc(ex+d*w*.12,ey-h*.06,h*.56,0,Math.PI*2);g.fillStyle=iris;g.fill();g.restore();
      g.beginPath();g.moveTo(ex-d*w*1.18,ey+h*.16);g.quadraticCurveTo(ex-d*w*.1,ey-h*.98,ex+d*w*1.24,ey-h*.36);g.lineWidth=lw*1.15;g.strokeStyle=ink;g.stroke();
      g.beginPath();g.arc(ex+d*w*.3,ey-h*.28,h*.13,0,Math.PI*2);g.fillStyle=hl;g.fill();
      break;
    case 2:   // ねむそう：まぶたが半分おりている
      g.save();g.beginPath();g.rect(ex-w*2,ey+h*.05,w*4,h*3);g.clip();
      g.beginPath();g.ellipse(ex,ey+h*.05,w*.8,h*.85,0,0,Math.PI*2);g.fillStyle=iris;g.fill();
      g.restore();
      g.beginPath();g.moveTo(ex-w*1.1,ey+h*.07);g.quadraticCurveTo(ex,ey-h*.05,ex+w*1.1,ey+h*.02);g.lineWidth=lw*1.35;g.strokeStyle=ink;g.stroke();
      break;
    case 3:   // 大きい：白目＋黒目（光は小さく1つ）
      g.beginPath();g.ellipse(ex,ey,w*.98,h*1.15,0,0,Math.PI*2);g.fillStyle='#FFFFFF';g.fill();
      g.save();g.clip();g.beginPath();g.ellipse(ex+d*w*.12,ey+h*.1,w*.6,h*.8,0,0,Math.PI*2);g.fillStyle=iris;g.fill();g.restore();
      g.beginPath();g.ellipse(ex,ey,w*.98,h*1.15,0,0,Math.PI*2);g.lineWidth=lw*.8;g.strokeStyle=ink;g.stroke();
      g.beginPath();g.arc(ex+d*w*.3,ey-h*.2,h*.16,0,Math.PI*2);g.fillStyle=hl;g.fill();
      break;
    case 4:   // にっこり（細い目）
      g.beginPath();g.moveTo(ex-w*1.1,ey+h*.3);g.quadraticCurveTo(ex,ey-h*.8,ex+w*1.1,ey+h*.3);
      g.lineWidth=lw*1.4;g.strokeStyle=shadeHex(eyeC,-.55);g.stroke();
      break;
    default:  // まる：ふつうの黒目
      g.beginPath();g.ellipse(ex,ey,w*.7,h*.92,0,0,Math.PI*2);g.fillStyle=iris;g.fill();
      g.beginPath();g.arc(ex+d*w*.24,ey-h*.3,h*.19,0,Math.PI*2);g.fillStyle=hl;g.fill();
  }
}
// 鼻：顔の向きの側に少し出る。色は noseInk（肌の色に合わせて見やすく）
function drawNose(g,st,nx,ny,r,d,col){
  var lw=r*.068;
  g.lineCap='round';g.lineJoin='round';g.strokeStyle=col;g.fillStyle=col;
  switch(st){
    case 1:   // くの字（長め）
      g.beginPath();g.moveTo(nx-d*r*.03,ny-r*.2);g.lineTo(nx+d*r*.1,ny+r*.02);g.lineTo(nx-d*r*.03,ny+r*.06);g.lineWidth=lw;g.stroke();break;
    case 2:   // まる
      g.beginPath();g.ellipse(nx+d*r*.02,ny,r*.088,r*.07,0,0,Math.PI*2);g.fill();
      g.beginPath();g.arc(nx+d*r*.045,ny-r*.024,r*.026,0,Math.PI*2);g.fillStyle='rgba(255,255,255,.7)';g.fill();break;
    case 3:   // 高い（鼻すじ＋小鼻）
      g.beginPath();g.moveTo(nx-d*r*.05,ny-r*.3);g.quadraticCurveTo(nx+d*r*.1,ny-r*.08,nx+d*r*.11,ny+r*.02);
      g.quadraticCurveTo(nx+d*r*.04,ny+r*.08,nx-d*r*.04,ny+r*.05);g.lineWidth=lw;g.stroke();break;

    default:  // ちょこん
      g.beginPath();g.moveTo(nx,ny-r*.11);g.lineTo(nx+d*r*.07,ny+r*.03);g.lineTo(nx-d*r*.02,ny+r*.05);g.lineWidth=lw;g.stroke();
  }
}
function drawMouth(g,st,mx,my,r,d){
  var mw=r*.2;
  g.lineCap='round';g.lineJoin='round';g.strokeStyle='#5A1F1F';g.lineWidth=r*.07;
  switch(st){
    case 1:g.beginPath();g.arc(mx,my-mw*.6,mw,Math.PI*.2,Math.PI*.8);g.stroke();break;   // にっこり
    case 2:   // 大笑い

      g.fillStyle='#FFFFFF';g.fillRect(mx-mw*1.1,my-mw*.5,mw*2.2,mw*.48);
      g.beginPath();g.ellipse(mx+d*mw*.1,my+mw*1.02,mw*.6,mw*.4,0,0,Math.PI*2);g.fillStyle='#D9545F';g.fill();
      g.restore();

    case 3:g.beginPath();g.arc(mx,my+mw*.85,mw,Math.PI*1.22,Math.PI*1.78);g.stroke();break;   // への字
    case 4:g.beginPath();g.ellipse(mx,my,mw*.42,mw*.52,0,0,Math.PI*2);g.fillStyle='#4A1016';g.fill();g.lineWidth=r*.04;g.stroke();break;   // おちょぼ
    default:g.beginPath();g.moveTo(mx-mw*.7,my);g.quadraticCurveTo(mx,my+mw*.14,mx+mw*.7,my);g.stroke();   // ふつう

// ---- 髪 ----
// 形は「頭の半径＝1、右を向いているとき」の座標で書く（左向きは左右反転）
function hairPen(g,hx,hy,r,d){
  function P(x,y){return[hx+d*x*r,hy+y*r];}
  return{
    M:function(x,y){var p=P(x,y);g.moveTo(p[0],p[1]);},
    L:function(x,y){var p=P(x,y);g.lineTo(p[0],p[1]);},
    Q:function(cx,cy,x,y){var c=P(cx,cy),p=P(x,y);g.quadraticCurveTo(c[0],c[1],p[0],p[1]);},
    C:function(ax,ay,bx,by,x,y){var a=P(ax,ay),b=P(bx,by),p=P(x,y);g.bezierCurveTo(a[0],a[1],b[0],b[1],p[0],p[1]);},
    pts:function(a){for(var i=0;i<a.length;i+=2){var p=P(a[i],a[i+1]);g.lineTo(p[0],p[1]);}},
    at:P
  };
}
// 長い髪の後ろ側（頭の後ろから肩へ）
function drawBackHair(g,col,hx,hy,r,d){
  var H=hairPen(g,hx,hy,r,d);
  g.beginPath();
  H.M(.2,-1.02);
  H.C(-.8,-1.3,-1.46,-.4,-1.34,.6);
  H.Q(-1.3,1.3,-1.12,1.78);
  H.pts([-.78,1.56,-.5,1.86,-.18,1.5,.1,.6]);
  g.closePath();
  g.fillStyle=shadeHex(col,-.15);g.fill();g.lineWidth=1.5;g.lineJoin='round';g.strokeStyle=OUTLINE;g.stroke();
}
function drawHair(g,style,col,hx,hy,r,d){
  var H=hairPen(g,hx,hy,r,d),lite=shadeHex(col,.3),dark=shadeHex(col,-.32),Z=FACE_ZONE;
  g.save();
  // 顔の部分（まゆげ〜口）をくりぬいてから描く：どの髪型でも目・まゆげ・鼻・口にかからない
  g.beginPath();g.rect(hx-r*3,hy-r*3,r*6,r*6);
  rrSub(g,d>0?hx+Z.x0*r:hx-Z.x1*r,hy+Z.y0*r,(Z.x1-Z.x0)*r,(Z.y1-Z.y0)*r,Z.rad*r);

  function gloss(pts,w){g.beginPath();H.M(pts[0],pts[1]);H.Q(pts[2],pts[3],pts[4],pts[5]);g.lineWidth=r*(w||.09);g.strokeStyle=hexA(lite,.85);g.stroke();g.lineWidth=1.5;g.strokeStyle=OUTLINE;}
  switch(style){
    case 1:   // ツンツン
      g.beginPath();H.M(-.98,.3);
      H.pts([-1.24,-.1,-1.02,-.34,-1.46,-.66,-.92,-.82,-1.12,-1.34,-.48,-1.1,-.34,-1.66,.06,-1.16,.5,-1.6,.58,-1.06,1.12,-1.18,.96,-.72,1.26,-.5,
        .98,-.42,.84,-.62,.66,-.41,.5,-.66,.32,-.41,.16,-.68,-.02,-.41,-.16,-.64,-.32,-.43,-.4,-.12,-.47,.16,-.58,-.14]);
      H.Q(-.76,-.24,-.88,-.04);g.closePath();paint();
      g.beginPath();H.M(-.22,-1.0);H.L(-.3,-1.38);H.M(.32,-.98);H.L(.44,-1.34);g.lineWidth=r*.07;g.strokeStyle=hexA(lite,.85);g.stroke();

// ティアのマーク・背景・枠：銃の紋章（王冠や宝石は使わない。上のティアほど銃の飾りが増える）
//   未ランク 鉄の輪と照準
//   LT5 鉄の標的（弾の穴）                 HT5 銅の弾丸
//   LT4 銀のシリンダー（弾3発）             HT4 保安官の星（真ん中にシリンダー）
//   LT3 交差したリボルバー＋真鍮のバッジ     HT3 交差したライフル＋黒い盾＋弾3発
//   LT2 スコープ＋交差したライフル＋弾帯     HT2 発砲の光＋交差したリボルバー＋弾帯＋深紅の盾
//   LT1 光条＋交差した金のリボルバー＋黒と金のシリンダー（金の弾6発）
//   HT1 伝説の黄金銃（銃口のフラッシュ・硝煙・落ちる薬莢が動く）

function tierInfo(idx){var e=TIER_LADDER[idx]||TIER_LADDER[0];return{e:e,lvl:idx<=0?0:Math.ceil(idx/2),high:idx>0&&idx%2===0};}
function tierName(idx){return idx<=0?t('tier.unranked'):TIER_LADDER[idx].key;}
function prand(n){var x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
function starPath(g,cx,cy,R,r,n){g.beginPath();for(var i=0;i<n*2;i++){var a=-Math.PI/2+i*Math.PI/n,rad=i%2?r:R;g.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}g.closePath();}
// いまの座標の拡大率（影のぼかしは拡大・縮小されないので、自分で合わせる）
function ctxScale(g){var m=g.getTransform?g.getTransform():null;return m?Math.sqrt(m.a*m.a+m.b*m.b)||1:1;}
// 金属の色：[つや, 明るい, 中間, 暗い, いちばん暗い]

// 上から光が当たった金属（明るい面・暗い帯・照り返し）
function metalGrad(g,m,y0,y1){
  var c=METAL[m]||METAL.iron,gr=g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,c[0]);gr.addColorStop(.3,c[1]);gr.addColorStop(.56,c[3]);gr.addColorStop(.8,c[2]);gr.addColorStop(1,c[4]);
  return gr;
}
// へこんだ面（光が逆）
function metalGradR(g,m,y0,y1){
  var c=METAL[m]||METAL.iron,gr=g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,c[4]);gr.addColorStop(.45,c[3]);gr.addColorStop(1,c[1]);
  return gr;
}
// 円柱の立体感：横向き（弾・薬莢）と縦向き（銃身）
function cylGrad(g,m,x0,x1){var c=METAL[m]||METAL.iron,gr=g.createLinearGradient(x0,0,x1,0);gr.addColorStop(0,c[3]);gr.addColorStop(.3,c[0]);gr.addColorStop(.55,c[1]);gr.addColorStop(1,c[4]);return gr;}
function cylGradV(g,m,y0,y1){var c=METAL[m]||METAL.iron,gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,c[0]);gr.addColorStop(.45,c[1]);gr.addColorStop(1,c[4]);return gr;}

// ---- 紋章の部品（紋章は中心 (0,0)、本体の半径が約 30 の座標で描く）----
function emShadow(g,on){
  if(on){var k=ctxScale(g);g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=5*k;g.shadowOffsetY=2*k;}
  else{g.shadowColor='rgba(0,0,0,0)';g.shadowBlur=0;g.shadowOffsetY=0;}
}
function emDisc(g,r,m){   // 金属の円盤：ふち＋へこんだ内側
  g.beginPath();g.arc(0,0,r,0,Math.PI*2);
  emShadow(g,true);g.fillStyle=metalGrad(g,m,-r,r);g.fill();emShadow(g,false);
  g.lineWidth=2.6;g.strokeStyle=METAL[m][4];g.stroke();
  var c=METAL[m],ig=g.createLinearGradient(0,-r*.78,0,r*.78);ig.addColorStop(0,c[4]);ig.addColorStop(1,c[2]);
  g.beginPath();g.arc(0,0,r*.78,0,Math.PI*2);g.fillStyle=ig;g.fill();
  g.lineWidth=1.3;g.strokeStyle='rgba(255,255,255,.3)';g.stroke();
}
function emSheriff(g,m){   // 保安官の星：6つの角の先に玉
  var R=35,r=20,c=METAL[m];
  starPath(g,0,0,R,r,6);
  emShadow(g,true);g.fillStyle=metalGrad(g,m,-R,R);g.fill();emShadow(g,false);
  g.lineWidth=2.2;g.strokeStyle=c[4];g.stroke();
  g.beginPath();for(var j=0;j<6;j++){var b=-Math.PI/2+j*Math.PI/3;g.moveTo(0,0);g.lineTo(Math.cos(b)*R*.92,Math.sin(b)*R*.92);}
  g.lineWidth=1;g.strokeStyle='rgba(255,255,255,.35)';g.stroke();
  for(var i=0;i<6;i++){
    var a=-Math.PI/2+i*Math.PI/3,x=Math.cos(a)*(R+2.5),y=Math.sin(a)*(R+2.5),rg=g.createRadialGradient(x-1.5,y-1.5,.5,x,y,5);
    rg.addColorStop(0,c[0]);rg.addColorStop(.6,c[2]);rg.addColorStop(1,c[4]);
    g.beginPath();g.arc(x,y,4.6,0,Math.PI*2);g.fillStyle=rg;g.fill();g.lineWidth=1.3;g.strokeStyle=c[4];g.stroke();
  }
}
function emReticle(g,x,y,r,col,lw){   // 照準
  g.beginPath();g.arc(x,y,r,0,Math.PI*2);
  g.moveTo(x,y-r*1.75);g.lineTo(x,y-r*1.25);g.moveTo(x,y+r*1.25);g.lineTo(x,y+r*1.75);
  g.moveTo(x-r*1.75,y);g.lineTo(x-r*1.25,y);g.moveTo(x+r*1.25,y);g.lineTo(x+r*1.75,y);
  g.lineWidth=lw;g.lineCap='round';g.strokeStyle=col;g.stroke();
}
function emReticleCut(g,x,y,r,m){   // 彫りこんだ照準（下に明るい線、上に暗い線）
  g.save();g.translate(0,1.1);emReticle(g,x,y,r,hexA(METAL[m][0],.85),3);g.restore();
  emReticle(g,x,y,r,METAL[m][4],3);
  g.beginPath();g.arc(x,y,2.5,0,Math.PI*2);g.fillStyle=METAL[m][4];g.fill();
}
function emShieldPath(g,s){
  g.beginPath();
  g.moveTo(-s,-s*1.02);g.quadraticCurveTo(0,-s*1.22,s,-s*1.02);
  g.lineTo(s,-s*.05);g.quadraticCurveTo(s*.96,s*.8,0,s*1.32);g.quadraticCurveTo(-s*.96,s*.8,-s,-s*.05);g.closePath();
}
// 盾の本体：ふち（trim の金属）＋内側の面（m）＋左上のつや
function emPlate(g,pathFn,s,m,trim){
  var t=METAL[trim];
  pathFn(g,s);emShadow(g,true);g.fillStyle=metalGrad(g,trim,-s*1.3,s*1.35);g.fill();emShadow(g,false);
  g.lineWidth=2.2;g.strokeStyle=t[4];g.stroke();
  g.save();g.scale(.8,.8);pathFn(g,s);g.restore();
  g.fillStyle=m===trim?metalGradR(g,m,-s,s*1.1):metalGrad(g,m,-s*1.05,s*1.1);g.fill();
  g.lineWidth=1.2;g.strokeStyle='rgba(0,0,0,.5)';g.stroke();
  g.save();g.scale(.8,.8);pathFn(g,s);g.restore();g.save();g.clip();
  g.beginPath();g.moveTo(-s*1.2,-s*1.3);g.lineTo(s*.2,-s*1.3);g.lineTo(-s*1.2,s*.2);g.closePath();g.fillStyle='rgba(255,255,255,.16)';g.fill();
  g.restore();
}
function emRifles(g){   // 交差したライフル（盾やスコープの後ろ）
  for(var sd=-1;sd<=1;sd+=2){
    g.save();g.rotate(sd*.7);
    var bg=g.createLinearGradient(-2.5,0,2.5,0);bg.addColorStop(0,'#3A3F47');bg.addColorStop(.45,'#E6EBF0');bg.addColorStop(1,'#4F5967');
    g.fillStyle=bg;g.fillRect(-2.4,-58,4.8,52);g.fillRect(-3.2,-60,6.4,3.4);
    g.lineWidth=1.1;g.strokeStyle='#1F242C';g.strokeRect(-2.4,-58,4.8,52);
    g.fillStyle='#4B5563';g.fillRect(-3.8,-8,7.6,15);g.strokeRect(-3.8,-8,7.6,15);
    g.beginPath();g.moveTo(-3.8,6);g.lineTo(3.8,6);g.lineTo(6.2,48);g.lineTo(-5.2,50);g.closePath();
    var sg=g.createLinearGradient(-5,0,6,0);sg.addColorStop(0,'#5A3A22');sg.addColorStop(.5,'#8A5A34');sg.addColorStop(1,'#4A2E1A');
    g.fillStyle=sg;g.fill();g.stroke();
    g.restore();
  }
}
// 弾（薬莢と弾頭）。(x,y)＝薬莢と弾頭のつなぎ目、s＝大きさ（全長は約 2.4s）、rot＝向き（0 で弾頭が上）
function emBullet(g,x,y,s,rot,tipM,caseM){
  var w=s*.62,bw=w*.46,cm=caseM||'brass',lw=Math.max(.4,s*.06);
  g.save();g.translate(x,y);g.rotate(rot||0);
  g.beginPath();g.rect(-w/2,0,w,s*1.18);g.fillStyle=cylGrad(g,cm,-w/2,w/2);g.fill();g.lineWidth=lw;g.strokeStyle=METAL[cm][4];g.stroke();
  g.beginPath();g.rect(-w*.54,s*1.1,w*1.08,s*.18);g.fill();g.stroke();
  g.beginPath();g.moveTo(-bw,0);g.lineTo(-bw,-s*.3);g.quadraticCurveTo(-bw,-s*.95,0,-s*1.15);g.quadraticCurveTo(bw,-s*.95,bw,-s*.3);g.lineTo(bw,0);g.closePath();
  g.fillStyle=cylGrad(g,tipM||'copper',-bw,bw);g.fill();g.stroke();
  g.restore();
}
// 弾の穴（まわりにひび）
function emBulletHole(g,x,y,r){
  g.save();g.translate(x,y);
  g.strokeStyle='rgba(0,0,0,.55)';g.lineWidth=Math.max(.4,r*.28);g.lineCap='round';g.beginPath();
  for(var i=0;i<6;i++){var a=i*1.05+.3,l=r*(1.8+((i*37)%5)*.25);g.moveTo(Math.cos(a)*r*.9,Math.sin(a)*r*.9);g.lineTo(Math.cos(a)*l,Math.sin(a)*l);}
  g.stroke();
  var hg=g.createRadialGradient(-r*.2,-r*.2,0,0,0,r*1.15);hg.addColorStop(0,'#050507');hg.addColorStop(.7,'#15161B');hg.addColorStop(1,'rgba(255,255,255,.35)');
  g.fillStyle=hg;g.beginPath();g.arc(0,0,r*1.15,0,Math.PI*2);g.fill();
  g.restore();
}
function emTarget(g,r,m){   // 標的（彫りこんだ同心円）
  var c=METAL[m];
  g.beginPath();g.arc(0,0,r,0,Math.PI*2);emShadow(g,true);g.fillStyle=metalGrad(g,m,-r,r);g.fill();emShadow(g,false);
  g.lineWidth=2.4;g.strokeStyle=c[4];g.stroke();
  [.78,.56,.34].forEach(function(k){
    g.beginPath();g.arc(0,1,r*k,0,Math.PI*2);g.lineWidth=2.4;g.strokeStyle=hexA(c[0],.55);g.stroke();
    g.beginPath();g.arc(0,0,r*k,0,Math.PI*2);g.lineWidth=2.4;g.strokeStyle=c[4];g.stroke();
  });
  g.beginPath();g.arc(0,0,r*.13,0,Math.PI*2);g.fillStyle=c[4];g.fill();
}
// リボルバーのシリンダー（正面から）。loaded[i]：弾が入っている穴（'gold' など素材名も可）、rimM：ふちの金属
function emCylinder(g,r,m,loaded,rimM){
  var c=METAL[m];
  g.beginPath();g.arc(0,0,r,0,Math.PI*2);emShadow(g,true);g.fillStyle=metalGrad(g,m,-r,r);g.fill();emShadow(g,false);
  g.lineWidth=Math.max(1,r*.08);g.strokeStyle=rimM?METAL[rimM][1]:c[4];g.stroke();
  for(var i=0;i<6;i++){   // 溝
    var fa=-Math.PI/2+Math.PI/6+i*Math.PI/3,fx=Math.cos(fa)*r*.9,fy=Math.sin(fa)*r*.9;
    g.beginPath();g.ellipse(fx,fy,r*.17,r*.09,fa,0,Math.PI*2);g.fillStyle=metalGradR(g,m,fy-r*.17,fy+r*.17);g.fill();
  }
  for(var j=0;j<6;j++){   // 弾の穴
    var a=-Math.PI/2+j*Math.PI/3,x=Math.cos(a)*r*.53,y=Math.sin(a)*r*.53,hr=r*.22;
    if(loaded&&loaded[j]){
      var bm=typeof loaded[j]==='string'?loaded[j]:'brass';
      g.beginPath();g.arc(x,y,hr,0,Math.PI*2);g.fillStyle=metalGrad(g,bm,y-hr,y+hr);g.fill();g.lineWidth=Math.max(.5,r*.03);g.strokeStyle=METAL[bm][4];g.stroke();
      g.beginPath();g.arc(x,y,hr*.38,0,Math.PI*2);g.fillStyle=metalGradR(g,bm,y-hr*.4,y+hr*.4);g.fill();   // 雷管
    }else{
      var hg=g.createRadialGradient(x-hr*.2,y-hr*.2,0,x,y,hr);hg.addColorStop(0,'#030305');hg.addColorStop(.8,'#121318');hg.addColorStop(1,c[3]);
      g.beginPath();g.arc(x,y,hr,0,Math.PI*2);g.fillStyle=hg;g.fill();
    }
  }
  g.beginPath();g.arc(0,0,r*.13,0,Math.PI*2);g.fillStyle=metalGradR(g,m,-r*.13,r*.13);g.fill();g.lineWidth=Math.max(.5,r*.03);g.strokeStyle=c[4];g.stroke();
}
// リボルバー（横から、右向き）。原点＝シリンダーの中心、k＝大きさ（1 で全長約 65）
function emRevolver(g,k,m,grip){
  var c=METAL[m],ol=c[4];
  g.save();g.scale(k,k);g.lineJoin='round';g.lineWidth=1.1;g.strokeStyle=ol;
  g.beginPath();g.rect(7,-5.2,34,4.4);g.fillStyle=cylGradV(g,m,-5.2,-.8);g.fill();g.stroke();   // 銃身
  g.beginPath();g.rect(9,-.8,22,2.2);g.fillStyle=cylGradV(g,m,-.8,1.4);g.fill();g.stroke();       // その下の棒
  g.beginPath();g.moveTo(37,-5.2);g.lineTo(38.5,-7.6);g.lineTo(40,-5.2);g.closePath();g.fillStyle=c[2];g.fill();g.stroke();   // 照星
  g.beginPath();g.moveTo(-15,-6);g.lineTo(8,-6);g.lineTo(8,4);g.lineTo(-2,5);g.lineTo(-6,7);g.lineTo(-15,6);g.closePath();   // 本体
  g.fillStyle=metalGrad(g,m,-6,7);g.fill();g.stroke();
  rrPath(g,-8,-6.8,15,11.6,2.5);g.fillStyle=metalGrad(g,m,-6.8,4.8);g.fill();g.stroke();   // シリンダー
  g.beginPath();g.moveTo(-7,-2.8);g.lineTo(6,-2.8);g.moveTo(-7,1);g.lineTo(6,1);g.lineWidth=.7;g.strokeStyle=hexA(ol,.7);g.stroke();
  g.lineWidth=1.1;g.strokeStyle=ol;
  g.beginPath();g.moveTo(-14,-5.5);g.lineTo(-18.5,-10.5);g.lineTo(-16,-11.2);g.lineTo(-11,-6);g.closePath();g.fillStyle=c[2];g.fill();g.stroke();   // 撃鉄
  g.beginPath();g.moveTo(-8,5.5);g.quadraticCurveTo(-8.5,12,-2,12);g.quadraticCurveTo(2,11.5,1.5,5.2);g.lineWidth=1.6;g.stroke();   // 用心金
  g.beginPath();g.moveTo(-4,5.5);g.quadraticCurveTo(-4.5,8.5,-2.5,10);g.lineWidth=1.3;g.stroke();   // 引き金
  g.beginPath();g.moveTo(-15,5);g.quadraticCurveTo(-20,14,-23.5,24);g.quadraticCurveTo(-19,27.5,-13.5,26);g.quadraticCurveTo(-11,16,-7,7);g.closePath();   // グリップ
  g.fillStyle=grip||'#3A2415';g.fill();g.lineWidth=1.1;g.stroke();
  g.fillStyle='rgba(255,255,255,.14)';g.beginPath();g.moveTo(-15.5,8);g.quadraticCurveTo(-18.5,15,-20.5,22);g.lineTo(-19,22.6);g.quadraticCurveTo(-16.5,15,-13.8,8.5);g.closePath();g.fill();
  g.restore();
}
function emCrossedRevolvers(g,k,m,grip){   // 交差した2丁のリボルバー（真ん中で交わり、銃口が左上と右上、グリップが下）
  for(var sd=-1;sd<=1;sd+=2){g.save();g.scale(sd,1);g.translate(-13.5*k,-1.6*k);g.rotate(-.55);emRevolver(g,k,m,grip);g.restore();}
}
// 弾帯：下の弧に沿った革のベルトに、弾が外向きに並ぶ
function emBandolier(g,R,a0,a1,n,tipM,caseM){
  g.beginPath();g.arc(0,0,R,a0,a1);g.lineCap='butt';g.lineWidth=9;g.strokeStyle='#241509';g.stroke();
  g.lineWidth=6.6;g.strokeStyle='#4A3020';g.stroke();
  g.beginPath();g.arc(0,0,R,a0+.02,a1-.02);g.setLineDash([2,2]);g.lineWidth=.7;g.strokeStyle='rgba(255,220,170,.35)';g.stroke();g.setLineDash([]);
  for(var i=0;i<n;i++){var a=a0+(a1-a0)*(i+.5)/n;emBullet(g,Math.cos(a)*(R+2),Math.sin(a)*(R+2),5.2,a+Math.PI/2,tipM,caseM);}
  g.lineCap='round';
}
// 発砲の光（白い芯→黄→だいだい）。omni なら全方向のとげ、そうでなければ前向きの炎
function emFlash(g,x,y,sz,dir,omni,alpha){
  g.save();g.translate(x,y);g.rotate(dir||0);if(alpha!=null)g.globalAlpha*=alpha;
  var gr=g.createRadialGradient(0,0,0,0,0,sz);gr.addColorStop(0,'rgba(255,255,235,1)');gr.addColorStop(.28,'rgba(255,228,120,.95)');gr.addColorStop(.65,'rgba(255,150,50,.65)');gr.addColorStop(1,'rgba(255,90,20,0)');
  g.fillStyle=gr;g.beginPath();
  if(omni){for(var i=0;i<16;i++){var a=i*Math.PI/8,r=i%2?sz*.4:sz;g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}}
  else{g.moveTo(0,-sz*.18);g.lineTo(sz*.35,-sz*.42);g.lineTo(sz*.45,-sz*.12);g.lineTo(sz,0);g.lineTo(sz*.45,sz*.12);g.lineTo(sz*.35,sz*.42);g.lineTo(0,sz*.18);g.lineTo(-sz*.12,0);}
  g.closePath();g.fill();g.restore();
}
// スコープ：鋼の太い輪＋赤いレンズ＋十字線と目盛り
function emScope(g,r,m){
  g.beginPath();g.arc(0,0,r,0,Math.PI*2);emShadow(g,true);g.fillStyle=metalGrad(g,m,-r,r);g.fill();emShadow(g,false);g.lineWidth=2;g.strokeStyle=METAL[m][4];g.stroke();
  var lr=r*.74,lg=g.createRadialGradient(-lr*.3,-lr*.35,lr*.1,0,0,lr);lg.addColorStop(0,mixHex(LENS,'#FFFFFF',.3));lg.addColorStop(.6,LENS);lg.addColorStop(1,shadeHex(LENS,-.7));
  g.beginPath();g.arc(0,0,lr,0,Math.PI*2);g.fillStyle=lg;g.fill();g.lineWidth=1.4;g.strokeStyle='rgba(0,0,0,.6)';g.stroke();
  g.strokeStyle='rgba(8,8,10,.9)';g.lineCap='butt';g.lineWidth=1.2;g.beginPath();g.moveTo(-lr,0);g.lineTo(lr,0);g.moveTo(0,-lr);g.lineTo(0,lr);g.stroke();
  g.lineWidth=2.6;g.beginPath();g.moveTo(-lr,0);g.lineTo(-lr*.45,0);g.moveTo(lr*.45,0);g.lineTo(lr,0);g.moveTo(0,lr*.45);g.lineTo(0,lr);g.stroke();g.lineCap='round';
  g.fillStyle='rgba(8,8,10,.9)';for(var i=1;i<=3;i++)[[i,0],[-i,0],[0,-i]].forEach(function(p){g.beginPath();g.arc(p[0]*lr*.11,p[1]*lr*.11,.9,0,Math.PI*2);g.fill();});
  g.beginPath();g.ellipse(-lr*.35,-lr*.4,lr*.28,lr*.12,-.6,0,Math.PI*2);g.fillStyle='rgba(255,255,255,.3)';g.fill();
}
function emRays(g,n,r0,r1,r2,rot,col,alpha){   // 光の筋（長いのと短いのが交互）
  g.save();g.rotate(rot);
  var rg=g.createRadialGradient(0,0,r0,0,0,r1);rg.addColorStop(0,hexA(col,alpha));rg.addColorStop(1,hexA(col,0));
  g.fillStyle=rg;g.beginPath();
  for(var i=0;i<n;i++){
    var a=i*Math.PI*2/n,len=i%2?r2:r1,wd=i%2?.07:.11;
    g.moveTo(Math.cos(a-wd)*r0,Math.sin(a-wd)*r0);g.lineTo(Math.cos(a)*len,Math.sin(a)*len);g.lineTo(Math.cos(a+wd)*r0,Math.sin(a+wd)*r0);g.closePath();
  }
  g.fill();g.restore();
}
function emAura(g,r,col,a){
  var rg=g.createRadialGradient(0,-4,4,0,-4,r);rg.addColorStop(0,hexA(col,a));rg.addColorStop(.5,hexA(col,a*.3));rg.addColorStop(1,hexA(col,0));
  g.fillStyle=rg;g.beginPath();g.arc(0,-4,r,0,Math.PI*2);g.fill();
}
// つやの光が斜めに走る（period 秒ごと）
function emShine(g,pathFn,tm,period){
  var p=(tm%period)/period;if(p>.3)return;
  var x=-80+p/.3*160;
  g.save();pathFn();g.clip();
  var sg=g.createLinearGradient(x-16,-40,x+16,40);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.6)');sg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=sg;g.fillRect(-90,-90,180,180);g.restore();
}
// 薬莢（弾頭のない真鍮の筒）。背景や演出で散らす
function emCasing(g,x,y,s,rot,a){
  if(a<=0)return;
  g.save();g.globalAlpha*=a;g.translate(x,y);g.rotate(rot);
  g.fillStyle=cylGrad(g,'brass',-s*.5,s*.5);g.fillRect(-s*.5,-s*1.3,s,s*2.6);
  g.fillStyle=METAL.brass[3];g.fillRect(-s*.6,s*1.05,s*1.2,s*.35);g.fillStyle='rgba(20,12,2,.8)';g.fillRect(-s*.32,-s*1.3,s*.64,s*.22);
  g.restore();
}
// 六角のねじ（枠の角など）
function emHexBolt(g,x,y,r,m){
  var c=METAL[m];g.beginPath();for(var i=0;i<6;i++){var a=Math.PI/6+i*Math.PI/3;g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);}g.closePath();
  g.fillStyle=metalGrad(g,m,y-r,y+r);g.fill();g.lineWidth=Math.max(.6,r*.14);g.strokeStyle=c[4];g.stroke();
  g.beginPath();g.arc(x,y,r*.42,0,Math.PI*2);g.fillStyle=metalGradR(g,m,y-r*.42,y+r*.42);g.fill();
}
// 紋章の本体（ラベルなし）。tm＝時間（動くのは最高ティアだけ）
function drawEmblem(g,idx,tm){
  var S=tierStyle(idx);
  g.lineJoin='round';g.lineCap='round';
  switch(idx){
    case 1:   // LT5：鉄の標的と弾の穴
      emTarget(g,33,'iron');emBulletHole(g,7,-6,3.2);
      break;
    case 2:   // HT5：鉄の輪の前に立つ銅の弾丸
      g.beginPath();g.arc(0,2,27,0,Math.PI*2);g.lineWidth=5;g.strokeStyle=metalGrad(g,'iron',-25,29);g.stroke();
      g.lineWidth=1;g.strokeStyle=METAL.iron[4];g.beginPath();g.arc(0,2,29.5,0,Math.PI*2);g.stroke();g.beginPath();g.arc(0,2,24.5,0,Math.PI*2);g.stroke();
      emBullet(g,0,-2,21,0,'copper','brass');
      break;
    case 3:   // LT4：銀のシリンダー（弾が3発）
      emCylinder(g,33,'silver',[1,0,1,0,1,0]);
      break;
    case 4:   // HT4：保安官の星（真ん中にシリンダー）
      emSheriff(g,'silver');emCylinder(g,15,'silver',[1,1,1,1,1,1],'brass');
      break;
    case 5:   // LT3：交差したリボルバー＋真鍮のバッジ（照準）
      emCrossedRevolvers(g,1.1,'silver','#2A1A10');
      emDisc(g,19,'brass');emReticleCut(g,0,0,6.5,'brass');
      break;
    case 6:   // HT3：交差したライフル＋黒い盾（真鍮のふち）＋弾3発
      emRifles(g);emPlate(g,emShieldPath,26,'onyx','brass');
      [-9.5,0,9.5].forEach(function(x){emBullet(g,x,0,7,0,'copper','brass');});
      break;
    case 7:   // LT2：交差したライフル＋弾帯＋スコープ
      emRifles(g);emBandolier(g,35,.5,Math.PI-.5,7,'copper','brass');emScope(g,24,'silver');
      break;
    case 8:   // HT2：発砲の光＋交差したリボルバー（青い鋼）＋真鍮の弾帯＋深紅の盾（真ん中にシリンダー）
      emFlash(g,0,-6,66,0,true,.5);
      emCrossedRevolvers(g,1.35,'blued','#1A1210');
      emBandolier(g,37,.42,Math.PI-.42,8,'brass','brass');
      emPlate(g,emShieldPath,23,'crimson','brass');emCylinder(g,10.5,'brass',[1,1,1,1,1,1]);
      break;
    case 9:   // LT1：光の筋＋交差した金のリボルバー＋黒と金のシリンダー（金の弾6発）
      emRays(g,16,14,90,66,.2,S.glow,.45);
      emCrossedRevolvers(g,1.35,'gold','#15100A');
      emCylinder(g,27,'onyx',['gold','gold','gold','gold','gold','gold'],'gold');
      break;
    case 10:  // HT1：伝説の黄金銃（銃口のフラッシュ・硝煙・落ちる薬莢が動く）
      var pulse=.5+.5*Math.sin(tm*2.4),fp=(tm%2.2)/2.2;
      emAura(g,96,'#FFD98A',.32+.18*pulse+(fp<.1?.3*(1-fp/.1):0));
      emRays(g,20,12,98,72,tm*.16,'#FFE7A8',.6);
      g.beginPath();g.arc(0,0,33,0,Math.PI*2);emShadow(g,true);g.fillStyle=metalGrad(g,'onyx',-33,33);g.fill();emShadow(g,false);   // 黒い照準の輪
      g.lineWidth=3.2;g.strokeStyle=metalGrad(g,'gold',-33,33);g.stroke();
      g.save();g.rotate(tm*.3);g.strokeStyle=METAL.gold[1];g.lineWidth=1.5;g.beginPath();
      for(var t2=0;t2<24;t2++){var a3=t2*Math.PI/12,r0=t2%6?27:22.5;g.moveTo(Math.cos(a3)*r0,Math.sin(a3)*r0);g.lineTo(Math.cos(a3)*30,Math.sin(a3)*30);}
      g.stroke();g.restore();
      emReticle(g,0,0,8,hexA(METAL.gold[1],.75),1.5);
      emBandolier(g,39,.55,Math.PI-.55,7,'gold','gold');
      var K=1.55;   // 黄金銃の大きさ
      g.save();g.translate(-10,6);g.rotate(-.12);
      emRevolver(g,K,'gold','#15100A');
      emShine(g,function(){g.beginPath();g.rect(7*K,-5.2*K,34*K,4.4*K);g.rect(-15*K,-7*K,23*K,14*K);},tm,2.2);
      if(fp<.12)emFlash(g,41*K+2,-3*K,30*(1-fp/.12*.4),0,false,1-fp/.12);   // 銃口のフラッシュ
      g.restore();
      if(fp<.7){var sp=fp/.7;g.save();g.globalAlpha*=(1-sp)*.45;g.fillStyle='#E4E4EA';   // 硝煙
        g.beginPath();g.arc(58+sp*8,-14-sp*30,3.5+sp*8,0,Math.PI*2);g.arc(64+sp*12,-20-sp*38,2.5+sp*6,0,Math.PI*2);g.fill();g.restore();}
      for(var cs=0;cs<6;cs++){var cp=(tm*.42+cs/6)%1;emCasing(g,-52+prand(cs*3.7)*104,-62+cp*124,2.2,tm*3.2+cs,Math.sin(cp*Math.PI)*.9);}   // 落ちる薬莢
      break;
    default:  // 未ランク：鉄の輪と照準
      g.beginPath();g.arc(0,0,30,0,Math.PI*2);g.fillStyle=metalGrad(g,'gun',-30,30);g.fill();g.lineWidth=2.6;g.strokeStyle='#0B0D12';g.stroke();
      g.beginPath();g.arc(0,0,23,0,Math.PI*2);g.fillStyle=metalGradR(g,'gun',-23,23);g.fill();
      g.setLineDash([4,4]);g.lineWidth=1.5;g.strokeStyle='rgba(255,255,255,.2)';g.stroke();g.setLineDash([]);
      emReticle(g,0,0,9,'#8B93A1',3);
  }
}
// ティア名の札：ねじ止めした金属の銘板
function emLabelPath(g,rw,y0,y1){rrPath(g,-rw,y0,rw*2,y1-y0,4);}
function emLabel(g,idx,tm){
  var R=tierStyle(idx).rib,label=tierName(idx),rw=idx===0?52:42,y0=39,y1=57,ym=(y0+y1)/2;
  emLabelPath(g,rw,y0,y1);
  var rg=g.createLinearGradient(0,y0,0,y1);rg.addColorStop(0,R[0]);rg.addColorStop(1,R[1]);
  emShadow(g,true);g.fillStyle=rg;g.fill();emShadow(g,false);
  g.lineWidth=1.8;g.strokeStyle=R[2];g.stroke();
  [-rw+5.5,rw-5.5].forEach(function(x){
    var sg=g.createRadialGradient(x-.6,ym-.6,.2,x,ym,2.4);sg.addColorStop(0,'#FFFFFF');sg.addColorStop(1,R[2]);
    g.beginPath();g.arc(x,ym,2,0,Math.PI*2);g.fillStyle=sg;g.fill();
    g.beginPath();g.moveTo(x-1.2,ym-1.2);g.lineTo(x+1.2,ym+1.2);g.lineWidth=.6;g.strokeStyle='rgba(0,0,0,.6)';g.stroke();
  });
  var fs=label.length>5?(label.length>7?9.5:11.5):14.5;
  g.font='700 '+fs+'px '+FONT_UI;g.textAlign='center';g.textBaseline='middle';
  if('letterSpacing' in g)g.letterSpacing=label.length>5?'1px':'2px';
  g.fillStyle=R[3];g.fillText(label,0,ym+.5);
  if('letterSpacing' in g)g.letterSpacing='0px';
  if(isTopTier(idx))emShine(g,function(){emLabelPath(g,rw,y0,y1);},tm+1.2,3.4);
}
// マーク：(cx,cy)=中心、R=本体の大きさの目安（50 で紋章の座標そのまま。光などはもっと外まで出る）
function drawTierMark(g,idx,cx,cy,R,tm,noLabel){
  g.save();g.translate(cx,cy);g.scale(R/50,R/50);
  drawEmblem(g,idx,tm||0);
  if(!noLabel)emLabel(g,idx,tm||0);
  g.restore();
}
// 紋章ごとの大きさ。アイコンでは、これを w×h の中にぴったり収める（label ならティア名の札も入れる）
var EM_BOX=[[-33,-33,33,33],[-36,-36,36,36],[-32,-30,32,33],[-36,-36,36,35],[-39,-45,39,44],[-40,-33,40,36],[-42,-49,42,43],
  [-42,-49,42,43],[-49,-44,49,45],[-49,-44,49,45],[-46,-42,58,51]];
function drawTierIcon(g,idx,cx,cy,w,h,tm,label){
  var b=EM_BOX[idx]||EM_BOX[0],x0=b[0],y0=b[1],x1=b[2],y1=label?Math.max(b[3],58):b[3];

// 名札（試合中の頭の上）：ティアの素材の小さな札
function drawTierPill(g,idx,x,y,w,h,label,tm){
  var P=tierStyle(idx).pill,gr=g.createLinearGradient(0,y,0,y+h);
  gr.addColorStop(0,P[0]);gr.addColorStop(1,P[1]);
  rrPath(g,x,y,w,h,Math.min(3,h*.25));g.fillStyle=gr;g.fill();
  g.lineWidth=1;g.strokeStyle=P[2];g.stroke();
  if(isTopTier(idx)){   // 最高ティア：光が走る
    var p=((tm||0)%2.6)/2.6;
    if(p<.4){g.save();g.clip();var sx=x-10+p/.4*(w+20),sg=g.createLinearGradient(sx-8,0,sx+8,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.85)');sg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=sg;g.fillRect(x,y,w,h);g.restore();}
  }

// 背景：ティアの素材の色。上のティアほど射撃場の飾りが増える

// カードの枠：素材の金属のふち。LT3から角に六角のねじ、LT2から鋼の角金具、LT1から角に弾、最高ティアは曳光弾が枠を走る
function drawTierFrame(g,idx,x,y,w,h,rad,tm){
  var S=tierStyle(idx),lvl=tierInfo(idx).lvl,T=METAL[S.trim];

  rrPath(g,fx,fy,fw,fh,rad);g.lineWidth=w*(lvl>=3?.02:lvl>=2?.016:.013);g.strokeStyle=fg;g.stroke();
  if(lvl>=2){var i1=w*(lvl>=3?.03:.024);rrPath(g,x+i1,y+i1,w-i1*2,h-i1*2,rad*.8);g.lineWidth=Math.max(1,w*.0032);g.strokeStyle=hexA(T[1],.6);g.stroke();}

        var L=w*.1,t=w*.024;
        g.beginPath();g.moveTo(-t*.5,-t*.5);g.lineTo(L,-t*.5);g.lineTo(L,t*.5);g.lineTo(t*.5,t*.5);g.lineTo(t*.5,L);g.lineTo(-t*.5,L);g.closePath();
        g.fillStyle=metalGrad(g,'gun',-t,L);g.fill();g.lineWidth=Math.max(.6,w*.002);g.strokeStyle=METAL.gun[4];g.stroke();

  var s=size;g.font=weight+' '+s+'px '+family;

  return s;
}
function wrapLines(g,text,maxW,maxLines){
  var lines=[],cur='';
  for(var i=0;i<text.length;i++){
    var ch=text.charAt(i),test=cur+ch;
    if(g.measureText(test).width>maxW&&cur){lines.push(cur);cur=ch;if(lines.length===maxLines)break;}
    else cur=test;
  }
  if(lines.length<maxLines&&cur)lines.push(cur);
  if(lines.length===maxLines&&lines.join('').length<text.length){var last=lines[maxLines-1];lines[maxLines-1]=last.slice(0,Math.max(0,last.length-1))+'…';}
  return lines;
}

  ctx.fillStyle='rgba(6,8,14,.78)';rrect(mx-5,my-4,mw+10,mh+8,6);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;ctx.stroke();
  for(var i=0;i<platforms.length;i++){var p=platforms[i];
    if(p.ground){ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(mx+p.x/WORLD_W*mw,my+mh-1.5,p.w/WORLD_W*mw,1.5);continue;}
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(mx+p.x/WORLD_W*mw,my+1+(p.y/GND)*(mh-4),Math.max(2,p.w/WORLD_W*mw),1.5);}
  for(var j=0;j<solids.length;j++){var b=solids[j];ctx.fillStyle='rgba(255,255,255,.34)';ctx.fillRect(mx+b.x/WORLD_W*mw,my+1+(b.y/GND)*(mh-4),Math.max(2,b.w/WORLD_W*mw),Math.max(1.5,b.h/GND*(mh-4)));}

  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(vx,my,vw,mh);

  [[ox,'#FF4D5E'],[px,'#B794FF']].forEach(function(m){var x=mx+(m[0]+CHAR_W/2)/WORLD_W*mw;ctx.fillStyle=m[1];ctx.shadowColor=m[1];ctx.shadowBlur=6;ctx.fillRect(x-1.5,my+2,3,mh-5);ctx.shadowBlur=0;});

function drawShot(b,col){
  var bsx=wx(b.x);if(bsx<-40||bsx>VW+40)return;
  if(b.k==='g'){
    ctx.save();ctx.translate(bsx,b.y);ctx.rotate(Math.atan2(b.vy||0,b.vx||1));
    ctx.fillStyle='#3F3F46';rrect(-4.5,-3,9,6,2.5);ctx.fill();ctx.fillStyle=col;ctx.fillRect(-1,-3,2,6);
    ctx.restore();
    ctx.fillStyle=rgba(col,.35);ctx.beginPath();ctx.arc(bsx-(b.vx||0)*1.2,b.y-(b.vy||0)*1.2,2.2,0,Math.PI*2);ctx.fill();
    return;
  }
  var dir=b.vx>=0?1:-1,W=WEAPONS[b.w]||WEAPONS[2],big=W.dmg>=25,small=b.k==='p'||W.dmg<=8,tl=big?30:small?10:16;
  var ang=Math.atan2(b.vy||0,Math.abs(b.vx)||1)*dir;
  var ex=bsx-Math.cos(ang)*dir*tl,ey=b.y-Math.sin(ang)*tl*dir;
  var g=ctx.createLinearGradient(ex,ey,bsx,b.y);g.addColorStop(0,rgba(col,0));g.addColorStop(1,col);
  ctx.strokeStyle=g;ctx.lineWidth=big?3:small?1.6:2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(bsx,b.y);ctx.stroke();ctx.lineCap='butt';
  ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=big?12:8;ctx.beginPath();ctx.arc(bsx,b.y,big?3.6:small?2:2.8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bsx,b.y,big?1.6:1.1,0,Math.PI*2);ctx.fill();
}
function drawEffects(shotList){
  FX.muzzle.forEach(function(m){
    var x=wx(m.x),a=m.life/5;
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#FFF4C2';ctx.shadowColor=m.col;ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(x,m.y-(m.big?5:3));ctx.lineTo(x+m.dir*(m.big?16:10),m.y);ctx.lineTo(x,m.y+(m.big?5:3));ctx.closePath();ctx.fill();
    ctx.restore();
  });
  FX.melee.forEach(function(m){
    ctx.save();ctx.strokeStyle=m.color;ctx.lineCap='round';
    if(m.wid===13){   // 槍：まっすぐ突く線
      ctx.globalAlpha=m.life/10;ctx.lineWidth=3;var x0=wx(m.x);
      ctx.beginPath();ctx.moveTo(x0,m.y);ctx.lineTo(x0+m.dir*(m.reach-8),m.y);ctx.stroke();
      ctx.lineWidth=1.2;ctx.strokeStyle='#FFFFFF';ctx.beginPath();ctx.moveTo(x0+m.dir*(m.reach-30),m.y);ctx.lineTo(x0+m.dir*(m.reach-6),m.y);ctx.stroke();
    }else{
      var r=m.wid===12?10:m.wid===14?25:16,lw=m.wid===14?6:m.wid===12?2.2:3,mx=m.wid===14?m.life/14:m.wid===12?m.life/7:m.life/10;
      ctx.globalAlpha=mx;ctx.lineWidth=lw;ctx.beginPath();ctx.arc(wx(m.x),m.y,r,m.dir>0?-.9:Math.PI-2.2,m.dir>0?.9:Math.PI+2.2);ctx.stroke();
    }
    ctx.restore();
  });
  FX.heal.forEach(function(h){ctx.save();ctx.globalAlpha=(h.life/30)*.8;ctx.strokeStyle='#34D399';ctx.lineWidth=3;ctx.beginPath();ctx.arc(wx(h.x),h.y,(1-h.life/30)*40+8,0,Math.PI*2);ctx.stroke();ctx.restore();});
  shotList.forEach(function(b){drawShot(b,b.col||(WEAPONS[b.w]?WEAPONS[b.w].color:'#FACC15'));});
  FX.beam.forEach(function(b){
    var a=b.life/16,x1=wx(b.x1),x2=wx(b.x2);
    ctx.save();ctx.globalAlpha=a;ctx.lineCap='round';
    ctx.strokeStyle=b.col;ctx.shadowColor=b.col;ctx.shadowBlur=18;ctx.lineWidth=2+a*7;ctx.beginPath();ctx.moveTo(x1,b.y);ctx.lineTo(x2,b.y);ctx.stroke();
    ctx.shadowBlur=0;ctx.strokeStyle='#FFFFFF';ctx.lineWidth=1+a*2.5;ctx.beginPath();ctx.moveTo(x1,b.y);ctx.lineTo(x2,b.y);ctx.stroke();
    ctx.restore();
  });
  FX.boom.forEach(function(b){
    var p=1-b.life/26,x=wx(b.x),r=b.r*(.35+.75*Math.pow(p,.5));
    ctx.save();
    var g=ctx.createRadialGradient(x,b.y,0,x,b.y,r);g.addColorStop(0,'rgba(255,248,220,'+(1-p)+')');g.addColorStop(.35,'rgba(255,170,70,'+(.85*(1-p))+')');g.addColorStop(1,'rgba(255,80,60,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,b.y,r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=(1-p)*.8;ctx.strokeStyle='#FFD8A8';ctx.lineWidth=2.5*(1-p)+.5;ctx.beginPath();ctx.arc(x,b.y,r*1.1,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  });
  FX.spark.forEach(function(s){ctx.globalAlpha=Math.min(1,s.life/10);ctx.fillStyle=s.col;ctx.fillRect(wx(s.x)-1,s.y-1,2,2);});
  ctx.globalAlpha=1;
  FX.shards.forEach(function(s){
    ctx.save();ctx.globalAlpha=Math.min(1,s.life/30);ctx.translate(wx(s.x),s.y);ctx.rotate(s.rot);ctx.fillStyle=s.col;
    ctx.beginPath();
    if(s.tri){ctx.moveTo(-s.s/2,-s.s/2);ctx.lineTo(s.s/2,-s.s/2);ctx.lineTo(-s.s/2,s.s/2);}
    else{ctx.moveTo(s.s/2,-s.s/2);ctx.lineTo(s.s/2,s.s/2);ctx.lineTo(-s.s/2,s.s/2);}
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-s.s/2,-s.s/2,s.s*.5,.8);
    ctx.restore();
  });
}
function themeGrads(th){
  var key='t_'+th.id;
  if(!GRADS[key]){
    var o={};
    o.sky=ctx.createLinearGradient(0,0,0,VH);o.sky.addColorStop(0,th.sky[0]);o.sky.addColorStop(.62,th.sky[1]);o.sky.addColorStop(1,th.sky[2]);
    o.ground=ctx.createLinearGradient(0,GND,0,VH);o.ground.addColorStop(0,th.ground[0]);o.ground.addColorStop(1,th.ground[1]);
    o.horizon=ctx.createLinearGradient(0,GND-140,0,GND);o.horizon.addColorStop(0,'rgba('+th.glow+',0)');o.horizon.addColorStop(1,'rgba('+th.glow+',.16)');
    if(th.abyss){o.abyss=ctx.createLinearGradient(0,GND-20,0,VH);o.abyss.addColorStop(0,th.abyss[0]);o.abyss.addColorStop(1,th.abyss[1]);}
    GRADS[key]=o;
  }
  if(!GRADS.vignette){GRADS.vignette=ctx.createRadialGradient(VW/2,VH*.5,VH*.3,VW/2,VH*.5,VW*.65);GRADS.vignette.addColorStop(0,'rgba(0,0,0,0)');GRADS.vignette.addColorStop(1,'rgba(0,0,0,.55)');}
  return GRADS[key];
}
// 遠景（テーマごとの景色）。camX に合わせて少しずつずらして奥行きを出す

    var sg=ctx.createRadialGradient(sx,GND-70,4,sx,GND-70,120);sg.addColorStop(0,'rgba(255,236,190,.95)');sg.addColorStop(.18,'rgba(255,190,110,.75)');sg.addColorStop(1,'rgba(255,120,60,0)');
    ctx.fillStyle=sg;ctx.fillRect(0,0,VW,GND);
    ctx.fillStyle='#FFE2A6';ctx.beginPath();ctx.arc(sx,GND-70,30,0,Math.PI*2);ctx.fill();
    for(i=0;i<7;i++){x=((i*230+40)%WORLD_W-camX*.12+WORLD_W*2)%(VW+200)-100;ctx.fillStyle='rgba(70,26,30,.55)';
      ctx.fillRect(x,GND-60-(i%3)*14,10,60+(i%3)*14);ctx.fillRect(x+26,GND-48,10,48);ctx.fillRect(x-4,GND-64-(i%3)*14,44,6);}
    ctx.fillStyle=th.far;ctx.beginPath();ctx.moveTo(0,GND);
    for(x=0;x<=VW;x+=20)ctx.lineTo(x,GND-26-Math.sin((x+camX*.2)*.012)*14);
    ctx.lineTo(VW,GND);ctx.closePath();ctx.fill();
  }else if(th.id==='ice'){
    for(i=0;i<3;i++){
      ctx.strokeStyle='rgba('+(i===1?'120,255,200':'140,220,255')+','+(.10+.04*Math.sin(frame*.01+i))+')';ctx.lineWidth=16-i*4;ctx.beginPath();
      for(x=0;x<=VW;x+=24){y=60+i*22+Math.sin(x*.012+frame*.008+i*1.7)*16;if(x)ctx.lineTo(x,y);else ctx.moveTo(x,y);}
      ctx.stroke();
    }
    for(i=0;i<8;i++){x=((i*210+80)%WORLD_W-camX*.15+WORLD_W*2)%(VW+240)-120;ctx.fillStyle=th.far;
      ctx.beginPath();ctx.moveTo(x,GND);ctx.lineTo(x+70,GND-120+(i%3)*18);ctx.lineTo(x+140,GND);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.moveTo(x+70,GND-120+(i%3)*18);ctx.lineTo(x+52,GND-84+(i%3)*18);ctx.lineTo(x+88,GND-84+(i%3)*18);ctx.fill();}
  }else if(th.id==='jungle'){
    for(i=0;i<9;i++){x=((i*170+30)%WORLD_W-camX*.14+WORLD_W*2)%(VW+220)-110;ctx.fillStyle=th.far;
      ctx.fillRect(x+34,GND-110,10,110);ctx.beginPath();ctx.arc(x+39,GND-120,34+(i%3)*6,0,Math.PI*2);ctx.arc(x+14,GND-100,24,0,Math.PI*2);ctx.arc(x+64,GND-98,26,0,Math.PI*2);ctx.fill();}
    ctx.strokeStyle='rgba(40,110,60,.55)';ctx.lineWidth=2;
    for(i=0;i<10;i++){x=((i*97+20)%WORLD_W-camX*.4+WORLD_W*2)%VW;ctx.beginPath();ctx.moveTo(x,0);ctx.quadraticCurveTo(x+8,30+(i%4)*10,x-4,60+(i%4)*18);ctx.stroke();}
  }else if(th.id==='western')sceneWestern(th);
  else if(th.id==='storm')sceneStorm(th);
  else if(th.id==='city')sceneCity(th);
  else{
    for(i=0;i<60;i++){var sx2=((i*157+11)%WORLD_W-camX*.3+WORLD_W)%VW,sy2=(i*89+7)%(GND-30);ctx.fillStyle='rgba(255,255,255,'+(0.06+(i%4)*.05)+')';ctx.beginPath();ctx.arc(sx2,sy2,(i%2)*.7+.3,0,Math.PI*2);ctx.fill();}
    for(var j=0;j<8;j++){var bx=((j*200+50)%WORLD_W-camX*.15+WORLD_W*2)%VW-40;ctx.fillStyle=th.far;ctx.beginPath();ctx.moveTo(bx,GND);ctx.lineTo(bx+60,GND-90+j*5);ctx.lineTo(bx+120,GND);ctx.fill();}
  }
}
// 月夜の西部の町：星・大きな月・流れる雲・メサの山・町のシルエット（酒場・給水塔・風車）・サボテン
function sceneWestern(th){
  var i,x,y,k;
  for(i=0;i<50;i++){x=((i*157+11)%WORLD_W-camX*.25+WORLD_W)%VW;y=(i*89+7)%(GND-110);ctx.fillStyle='rgba(255,255,255,'+(.08+(i%4)*.06)+')';ctx.fillRect(x,y,i%3?1:1.6,i%3?1:1.6);}
  var mx=VW*.74-camX*.03,my=74,mg=ctx.createRadialGradient(mx,my,20,mx,my,130);
  mg.addColorStop(0,'rgba(255,240,205,.42)');mg.addColorStop(1,'rgba(255,240,205,0)');
  ctx.fillStyle=mg;ctx.fillRect(mx-130,my-130,260,260);
  ctx.fillStyle='#FFF1CF';ctx.beginPath();ctx.arc(mx,my,32,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(214,196,150,.45)';[[-10,-8,7],[10,4,5],[-3,12,4],[12,-12,3]].forEach(function(c){ctx.beginPath();ctx.arc(mx+c[0],my+c[1],c[2],0,Math.PI*2);ctx.fill();});
  for(i=0;i<5;i++){   // 流れる雲（月の前も横切る）
    x=((i*230+frame*.15-camX*.05)%(VW+320)+VW+320)%(VW+320)-160;y=34+(i%3)*30;
    ctx.fillStyle='rgba(18,28,54,'+(.55+.1*(i%2))+')';ctx.beginPath();
    ctx.ellipse(x,y,70,13,0,0,Math.PI*2);ctx.ellipse(x+40,y-8,44,12,0,0,Math.PI*2);ctx.ellipse(x-36,y+4,40,9,0,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='rgba(24,36,66,.95)';ctx.beginPath();ctx.moveTo(0,GND);   // メサ（上が平らな岩山）
  for(x=0;x<=VW;x+=6){var u=(x+camX*.08)/120,kk=Math.floor(u),fr=u-kk,h1=40+prand(kk)*50,h2=40+prand(kk+1)*50;ctx.lineTo(x,GND-(fr<.8?h1:h1+(h2-h1)*(fr-.8)/.2));}
  ctx.lineTo(VW,GND);ctx.closePath();ctx.fill();
  for(i=0;i<9;i++){   // 町
    x=((i*170+30)%WORLD_W-camX*.2+WORLD_W*2)%(VW+260)-130;
    var bw=46+(i%3)*14,bh=34+(i*7%4)*8,by=GND-bh;
    ctx.fillStyle='#0C1326';
    if(i%4===3){   // 給水塔
      ctx.fillRect(x+8,GND-60,3,60);ctx.fillRect(x+32,GND-60,3,60);ctx.fillRect(x+8,GND-40,27,2);
      ctx.beginPath();ctx.moveTo(x+2,GND-60);ctx.lineTo(x+41,GND-60);ctx.lineTo(x+38,GND-86);ctx.lineTo(x+5,GND-86);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(x+2,GND-86);ctx.lineTo(x+21.5,GND-98);ctx.lineTo(x+41,GND-86);ctx.closePath();ctx.fill();
    }else if(i%4===1){   // 風車（羽根がゆっくり回る）
      ctx.beginPath();ctx.moveTo(x+14,GND);ctx.lineTo(x+20,GND-72);ctx.lineTo(x+24,GND-72);ctx.lineTo(x+30,GND);ctx.closePath();ctx.fill();
      var cx=x+22,cy=GND-74,a0=frame*.02+i;
      ctx.strokeStyle='#0C1326';ctx.lineWidth=2.4;ctx.beginPath();
      for(k=0;k<8;k++){var a=a0+k*Math.PI/4;ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*17,cy+Math.sin(a)*17);}
      ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx-20,cy+2);ctx.lineTo(cx-20,cy-6);ctx.closePath();ctx.fill();
    }else{   // 酒場（看板の屋根・ベランダ・明かりの窓）
      ctx.fillRect(x,by,bw,bh);
      ctx.beginPath();ctx.moveTo(x-2,by);ctx.lineTo(x-2,by-12);ctx.lineTo(x+bw*.3,by-12);ctx.lineTo(x+bw*.3,by-19);ctx.lineTo(x+bw*.7,by-19);ctx.lineTo(x+bw*.7,by-12);ctx.lineTo(x+bw+2,by-12);ctx.lineTo(x+bw+2,by);ctx.closePath();ctx.fill();
      ctx.fillRect(x-4,by+bh*.45,bw+8,2);
      ctx.fillStyle='rgba(255,196,110,.85)';
      for(k=6;k<bw-6;k+=12){if(prand(i*13+k)>.35)ctx.fillRect(x+k,by+6,5,7);if(prand(i*7+k+.5)>.5)ctx.fillRect(x+k,by+bh*.6,5,7);}
    }
  }
  for(i=0;i<5;i++){   // サボテン（少し手前なので速くずれる）
    x=((i*300+140)%WORLD_W-camX*.35+WORLD_W*2)%(VW+100)-50;var ch=22+(i%3)*8;
    ctx.fillStyle='#0E1A1E';ctx.fillRect(x,GND-ch,6,ch);ctx.fillRect(x-7,GND-ch*.7,4,ch*.35);ctx.fillRect(x-7,GND-ch*.7+ch*.35-3,8,3);ctx.fillRect(x+9,GND-ch*.85,4,ch*.3);ctx.fillRect(x+5,GND-ch*.85+ch*.3-3,8,3);
  }
}
// 嵐の大平原：遠くの稲妻・流れる厚い雲（3層）・なだらかな丘・一本の枯れ木
function stormFlash(){var lp=frame%460;return lp<4?.5:(lp>=8&&lp<12)?.35:0;}   // 2回光る
function sceneStorm(th){
  var i,x,y,L,fl=stormFlash(),bolt=Math.floor(frame/460);
  if(fl){ctx.fillStyle='rgba(190,210,255,'+(fl*.5).toFixed(3)+')';ctx.fillRect(0,0,VW,GND);}
  if(fl){   // 稲妻
    var bx=VW*.12+prand(bolt*3.3)*VW*.76,by=36;
    ctx.save();ctx.strokeStyle='rgba(235,242,255,.95)';ctx.lineWidth=2;ctx.shadowColor='#BFD4FF';ctx.shadowBlur=14;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(bx,by);for(var s=1;s<=7;s++)ctx.lineTo(bx+(prand(bolt*7+s)-.5)*34,by+s*24);
    ctx.moveTo(bx+(prand(bolt*7+3)-.5)*34,by+72);ctx.lineTo(bx+(prand(bolt*7+3)-.5)*34+22,by+110);ctx.stroke();ctx.restore();
  }
  for(L=0;L<3;L++){   // 雲（奥ほどゆっくり）
    ctx.fillStyle=['rgba(34,42,60,.85)','rgba(24,30,44,.9)','rgba(14,18,28,.96)'][L];ctx.beginPath();ctx.moveTo(0,0);
    for(x=0;x<=VW+20;x+=16){y=(30+L*26)+Math.sin((x+frame*(.1+L*.08)+camX*(.03+L*.03))*.018)*10+Math.sin((x*1.7+frame*.13)*.031)*6;ctx.lineTo(x,y);}
    ctx.lineTo(VW,0);ctx.closePath();ctx.fill();
  }
  for(L=0;L<2;L++){   // 丘
    ctx.fillStyle=L?'rgba(12,20,16,.96)':'rgba(22,32,36,.9)';ctx.beginPath();ctx.moveTo(0,GND);
    for(x=0;x<=VW;x+=12)ctx.lineTo(x,GND-(L?24:50)-Math.sin((x+camX*(L?.2:.1))*(L?.011:.007)+L)*(L?10:18));
    ctx.lineTo(VW,GND);ctx.closePath();ctx.fill();
  }
  var tx=((900-camX*.2)%(VW+300)+VW+300)%(VW+300)-150,ty=GND-22;   // 枯れ木
  ctx.strokeStyle='#070C09';ctx.lineCap='round';
  ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(tx,ty+10);ctx.lineTo(tx+2,ty-40);ctx.stroke();
  ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(tx+1,ty-22);ctx.lineTo(tx-18,ty-44);ctx.moveTo(tx+2,ty-30);ctx.lineTo(tx+20,ty-52);ctx.moveTo(tx+2,ty-38);ctx.lineTo(tx-6,ty-60);ctx.stroke();
  ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(tx-12,ty-37);ctx.lineTo(tx-22,ty-38);ctx.moveTo(tx+14,ty-46);ctx.lineTo(tx+24,ty-44);ctx.moveTo(tx-4,ty-55);ctx.lineTo(tx+4,ty-66);ctx.stroke();
  ctx.lineCap='butt';
}
// 摩天楼の夜：街の明かりで染まる地平線・サーチライト・奥と手前のビル（窓の明かり・赤い航空障害灯）
function sceneCity(th){
  var i,x,L;
  for(i=0;i<24;i++){x=((i*211+11)%WORLD_W-camX*.3+WORLD_W)%VW;ctx.fillStyle='rgba(255,255,255,'+(.05+(i%3)*.04)+')';ctx.fillRect(x,(i*67+9)%(GND-160),1,1);}
  for(i=0;i<2;i++){   // サーチライト
    var sx=(i?1050:380)-camX*.12,a=-Math.PI/2+Math.sin(frame*.006+i*2.1)*.5,ex=sx+Math.cos(a)*440,ey=GND+Math.sin(a)*440;

// 摩天楼：真ん中に積み重なった足場を、鉄塔の骨組みでつなぐ（見た目だけ。当たり判定はない）
function drawTowerFrame(){
  var lv=platforms.filter(isTowerLevel).sort(function(a,b){return b.y-a.y;});
  if(lv.length<2)return;
  var top=lv[lv.length-1],base=lv[0],tY=top.y+6,x0=base.x+4,x1=base.x+base.w-4,t0=top.x+6,t1=top.x+top.w-6;
  function L(y){return wx(x0+(t0-x0)*(GND-y)/(GND-tY));}
  function R(y){return wx(x1+(t1-x1)*(GND-y)/(GND-tY));}
  if(R(GND)<-20||L(GND)>VW+20)return;
  var ys=[GND].concat(lv.map(function(p){return p.y+6;}));
  ctx.strokeStyle='rgba(120,130,160,.65)';ctx.lineWidth=1.6;ctx.beginPath();
  for(var i=0;i<ys.length-1;i++){var y0=ys[i],y1=ys[i+1];ctx.moveTo(L(y0),y0);ctx.lineTo(R(y1),y1);ctx.moveTo(R(y0),y0);ctx.lineTo(L(y1),y1);}
  ctx.stroke();
  ctx.strokeStyle='#4A5064';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(L(GND),GND);ctx.lineTo(L(tY),tY);ctx.moveTo(R(GND),GND);ctx.lineTo(R(tY),tY);ctx.stroke();
  var ax=wx(top.x+top.w/2);
  ctx.strokeStyle='#5A6275';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ax,top.y);ctx.lineTo(ax,top.y-60);ctx.stroke();
  if(frame%70<35){ctx.save();ctx.fillStyle='#FF3B3B';ctx.shadowColor='#FF3B3B';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(ax,top.y-61,2.4,0,Math.PI*2);ctx.fill();ctx.restore();}
}
// 西部の町：ときどき転がっていく枯れ草（タンブルウィード）

      ctx.beginPath();ctx.moveTo(bx2+3,b.y+3);ctx.lineTo(bx2+b.w-3,b.y+b.h-3);ctx.moveTo(bx2+b.w-3,b.y+3);ctx.lineTo(bx2+3,b.y+b.h-3);ctx.stroke();

// ステージ全体の見取り図（ステージ選択の下に出す）

function drawHudSide(left,label,sub,wins,col){

  ctx.fillStyle=col;ctx.fillRect(left?0:VW-3,0,3,h);

var RANGE=null;

  RANGE={w:SIM.newRangeWorld(RANGE_STAGE,loadout.slice(),tg),stats:{},order:[],sidW:{},sidHit:{},nums:[],flash:{},idle:999,tick:0};
  RANGE.me=RANGE.w.chars.a;playerSlot=0;RANGE.me.wantSlot=0;camX=0;

function rangeStyle(side){return{look:profile.look,team:TEAM.me};}
function rangeStat(wid){
  var s=RANGE.stats[wid];
  if(!s){s=RANGE.stats[wid]={dmg:0,shots:0,hits:0,max:0,frames:0};RANGE.order.push(wid);}
  return s;
}
function rangeDps(s){return s.frames>0?s.dmg/(s.frames/60):0;}
function rangeAcc(s){return s.shots>0?Math.min(100,Math.round(s.hits/s.shots*100)):0;}
function updateRange(){
  var R=RANGE;if(!R)return;
  var me=R.me;
  me.hp=MAX_HP;me.hpFrac=MAX_HP;   // 射撃場では倒れない（自分のグレネードでも減らないが念のため）
  SIM.setInput(me,playerInput());
  var ev=[];SIM.stepRange(R.w,ev);
  handleEvents(ev,'a',rangeStyle);
  var wid=me.load[me.slot];
  for(var i=0;i<ev.length;i++){
    var e=ev[i];
    if((e.t==='fire'||e.t==='melee')&&e.who==='a'){   // 撃った数（散弾は粒の数）
      var W=WEAPONS[e.wid],st=rangeStat(e.wid);
      st.shots+=W.kind==='pellet'?W.pellets:1;R.sidW[e.sid]=e.wid;R.idle=0;
    }else if(e.t==='hit'&&e.by==='a'){
      var hw=R.sidW[e.sid]||wid,HW=WEAPONS[hw],hs=rangeStat(hw);
      hs.dmg+=e.dmg;hs.max=Math.max(hs.max,e.dmg);R.idle=0;
      if(HW.kind==='pellet')hs.hits+=e.dmg>=HW.dmg*HW.pellets?HW.pellets:1;   // 密着で撃つと、粒がまとめて当たる
      else if(!R.sidHit[e.sid]){R.sidHit[e.sid]=1;hs.hits++;}
      R.nums.push({x:e.x,y:e.y-6,v:e.dmg,life:50,vx:(Math.random()-.5)*.6});
      R.flash[e.who]=10;
    }
  }
  // DPS の時計：撃ってから1秒のあいだ・リロード中・自分の弾が飛んでいる間だけ進める（止まって眺めている時間は数えない）
  var busy=R.idle<60||me.rl>0||me.chg>0||me.burst>0||R.w.shots.length>0;
  R.idle++;
  if(busy&&R.stats[wid])R.stats[wid].frames++;
  for(var k in R.flash)if(R.flash[k]>0)R.flash[k]--;
  R.nums=R.nums.filter(function(n){n.y-=.7;n.x+=n.vx;return --n.life>0;});
  if(++R.tick%12===0)renderRangeStats();
}

function rangeSetWeapon(id){
  dropFocus();
  if(!RANGE||!WEAPONS[id])return;
  var me=RANGE.me,slot=playerSlot,other=me.load.indexOf(id);
  if(me.load[slot]===id)return;
  if(other>=0){var old=me.load[slot];me.load[other]=old;me.ammo[other]=WEAPONS[old].mag;if(me.rl>0&&me.rlSlot===other)me.rl=0;}
  me.load[slot]=id;me.ammo[slot]=WEAPONS[id].mag;
  if(me.rl>0&&me.rlSlot===slot){me.rl=0;}
  if(me.slot===slot){me.burst=0;me.chg=0;me.swT=0;me.recT=0;if(me.cool<SIM.SWAP_FRAMES){me.cool=SIM.SWAP_FRAMES;me.coolMax=SIM.SWAP_FRAMES;}}
  SFX.switchW();renderRangePanel();
}

  if(!RANGE)return;

    if(me.load.indexOf(id)<0){rangeSetWeapon(id);return;}   // ほかの枠に入っている武器はとばす
  }

function drawTierUp(){
  var T=(performance.now()-tierUp.t0)/1000;
  if(T>6.4){tierUp=null;return;}
  var down=!!tierUp.down;
  var toI=tierUp.to,to=TIER_LADDER[toI],next=TIER_LADDER[toI+1],col=down?'#8A919B':tierStyle(toI).glow,cx=VW/2,cy=VH/2+4,fade=T>5.8?Math.max(0,(6.4-T)/.6):1;
  // 並び：前の紋章(幅60)・すき間・矢印・すき間・新しい紋章(幅130) を中央にそろえる
  var OLD_W=60,NEW_W=130,GAP=40,total=OLD_W+GAP+NEW_W,left=cx-total/2;
  var oldX=left+OLD_W/2,arrowX=left+OLD_W+GAP/2,newX=left+OLD_W+GAP+NEW_W/2,badgeY=cy+2;
  ctx.save();

  var sh=T<.75?(.75-T)/.75:0;

  // 新しい紋章の後ろで回る光条
  if(!down){
    ctx.save();ctx.translate(newX,badgeY);ctx.globalAlpha=fade*.16*Math.min(1,T/.5);ctx.fillStyle=col;

  }
  // 紙吹雪（白・金・ティアの光の色）
  for(var k=0;k<(down?0:52);k++){
    var pt=T-.45-(k%8)*.015;
    if(pt<=0||pt>2.6)continue;
    var ang=(k*137.5)*Math.PI/180,spd=110+((k*53)%130);
    var px=newX+Math.cos(ang)*spd*pt,py=badgeY+Math.sin(ang)*spd*pt+pt*pt*95;
    ctx.globalAlpha=fade*Math.max(0,1-pt/2.6);ctx.fillStyle=k%3===0?'#FFFFFF':k%3===1?'#FFD968':col;
    var s=(k%4)*.9+2;
    ctx.save();ctx.translate(px,py);ctx.rotate(ang+pt*5);ctx.fillRect(-s/2,-s/2,s,s*(k%5===0?2.4:1));ctx.restore();
  }
  // 前のティアの紋章（小さく、うすく）
  if(T>.12){ctx.globalAlpha=fade*.6*Math.min(1,(T-.12)/.25);drawTierIcon(ctx,tierUp.from,oldX,badgeY,OLD_W,56,T,true);}
  // 矢印（文字ではなく図形で描くので、フォントによって位置がずれない）
  if(T>.3){
    var ap=Math.min(1,(T-.3)/.2),nudge=Math.sin(T*6)*2;
    ctx.strokeStyle='#FFFFFF';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';
    for(var c2=0;c2<2;c2++){   // 左の「前のティア」から右の「今のティア」へ。降格のときは下向きに傾ける
      var ax=arrowX-6+c2*9+nudge,ay=badgeY+(down?4:0);
      ctx.globalAlpha=fade*ap*(c2===0?.55:1);
      ctx.beginPath();ctx.moveTo(ax-4,ay-7);ctx.lineTo(ax+3,ay);ctx.lineTo(ax-4,ay+7);ctx.stroke();
    }
    ctx.lineCap='butt';ctx.lineJoin='miter';
  }
  // 新しいティアの紋章（大きく弾んで出てくる）
  if(T>.42){
    var bp=Math.min(1,(T-.42)/.45),bsc=1+1.4*Math.pow(1-bp,3);
    ctx.globalAlpha=fade*Math.min(1,bp*3);
    ctx.save();ctx.translate(newX,badgeY);ctx.scale(bsc,bsc);drawTierIcon(ctx,toI,0,0,NEW_W,96,T,true);ctx.restore();
  }
  ctx.globalAlpha=fade;
  // 着地の白フラッシュ
  if(T>.42&&T<.66&&!down){
    ctx.globalAlpha=fade*(1-(T-.42)/.24)*.85;ctx.fillStyle='#fff';ctx.fillRect(-40,-40,VW+80,VH+80);ctx.globalAlpha=fade;
  }

    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='italic 700 40px '+FONT_UI;setLS(4);
    ctx.shadowColor=col;ctx.shadowBlur=24;ctx.fillStyle=down?'#D6D9E0':'#FFF7DF';ctx.fillText(down?'TIER DOWN':'TIER UP!',0,0);
    ctx.shadowBlur=0;setLS(0);ctx.restore();
  }
  if(T>.9){
    ctx.globalAlpha=fade*Math.min(1,(T-.9)/.4);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='700 14px '+FONT_UI;ctx.fillStyle='#EDEBE6';ctx.fillText(t(down?'c.tierDownTo':'c.tierUpTo',{tier:tierName(toI),range:tierRangeText(toI)}),cx,cy+64);

  ctx.globalAlpha=1;ctx.textBaseline='alphabetic';
}

  ctx.save();ctx.clip();ctx.globalAlpha=.09;ctx.fillStyle='#FFFFFF';
  for(var j=0;j<14;j++){var rx0=VW-(((j*97+T*260)%(VW*.7))-60)-120;ctx.fillRect(rx0,(j*31+7)%VH,90+(j%3)*50,2);}
  ctx.restore();ctx.restore();
  // 真ん中の境目の光
  if(T>.3){ctx.save();ctx.globalAlpha=Math.min(1,(T-.3)/.2)*.9;ctx.strokeStyle='#FFE7A3';ctx.lineWidth=2.5;ctx.shadowColor='#FFC53D';ctx.shadowBlur=18;
    ctx.beginPath();ctx.moveTo(VW*.57,0);ctx.lineTo(VW*.43,VH);ctx.stroke();ctx.restore();}
  // カード
  var lx=58-(1-e)*320,rx=VW-58-cw+(1-e)*320;
  ctx.save();ctx.translate(lx+cw/2,cy+ch/2);ctx.rotate(-.05);ctx.translate(-cw/2,-ch/2);drawProfileCard(ctx,myCardData(),0,0,cw,ch,T);ctx.restore();
  ctx.save();ctx.translate(rx+cw/2,cy+ch/2);ctx.rotate(.05);ctx.translate(-cw/2,-ch/2);drawProfileCard(ctx,oppCardData(),0,0,cw,ch,T);ctx.restore();
  if(T>.5){ctx.save();ctx.globalAlpha=Math.min(1,(T-.5)/.25);drawRecPill(lx+cw/2,cy+ch+10,myRecord(),'#B794FF');drawRecPill(rx+cw/2,cy+ch+10,oppInfo.rec,'#FF6B7A');
    drawDiscordTag(lx+cw/2,cy-30,AUTH.user?AUTH.user.name:'');drawDiscordTag(rx+cw/2,cy-30,oppInfo.discord);ctx.restore();}
  // VS（ぶつかった瞬間に大きく出る）
  if(T>.35){
    var p=Math.min(1,(T-.35)/.22),sc=1+1.6*Math.pow(1-p,3);
    for(var r=0;r<2;r++){var rt=T-.35-r*.12;if(rt>0&&rt<.7){var rp=rt/.7;ctx.save();ctx.globalAlpha=(1-rp)*.7;ctx.strokeStyle='#FFE7A3';ctx.lineWidth=(1-rp)*6+.5;ctx.beginPath();ctx.arc(VW/2,VH/2-8,20+rp*170,0,Math.PI*2);ctx.stroke();ctx.restore();}}
    ctx.save();ctx.translate(VW/2,VH/2-8);ctx.scale(sc,sc);ctx.rotate(-.08);
    ctx.globalAlpha=p;
    ctx.fillStyle='rgba(6,7,12,.75)';ctx.beginPath();ctx.moveTo(-58,-40);ctx.lineTo(64,-46);ctx.lineTo(58,40);ctx.lineTo(-64,46);ctx.closePath();ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle='rgba(255,231,163,.8)';ctx.stroke();
    ctx.font='italic 700 70px '+FONT_UI;ctx.textAlign='center';ctx.textBaseline='middle';
    var vg=ctx.createLinearGradient(0,-34,0,34);vg.addColorStop(0,'#FFF3C4');vg.addColorStop(.5,'#FFC53D');vg.addColorStop(1,'#D98A00');
    ctx.shadowColor='#FFB020';ctx.shadowBlur=26;ctx.fillStyle=vg;ctx.fillText('VS',2,4);
    ctx.shadowBlur=0;ctx.lineWidth=2;ctx.strokeStyle='#5A3400';ctx.strokeText('VS',2,4);
    ctx.restore();
  }
  if(T>.35&&T<.5){ctx.save();ctx.globalAlpha=(1-(T-.35)/.15)*.7;ctx.fillStyle='#FFFFFF';ctx.fillRect(-10,-10,VW+20,VH+20);ctx.restore();}
  if(out>0){ctx.fillStyle='rgba(6,7,12,'+out.toFixed(3)+')';ctx.fillRect(-10,-10,VW+20,VH+20);}
  ctx.restore();
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}
function drawScene(){
  ctx.clearRect(0,0,VW,VH);
  if(vsPhase){drawVs();return;}
  if(gameMode==='range'){drawRangeScene();return;}
  // とどめの演出：倒れた相手に寄る
  var kc=null,kt=0,kz=1;
  if(killCam){
    kt=(performance.now()-killCam.t0)/1000;
    if(kt>1.3)killCam=null;
    else{kc=killCam;var kp=kt<.22?kt/.22:(kt<.95?1:Math.max(0,1-(kt-.95)/.35));kz=1+.6*kp;}
  }
  if(kc){var kx=wx(kc.x),ky=kc.y;ctx.save();ctx.translate(kx,ky);ctx.scale(kz,kz);ctx.translate(-kx,-ky);}
  drawBackground();
  var pw=gameMode==='ai'?lpWins:opWins,aw=gameMode==='ai'?laWins:oaWins,me=null,op=null;
  if(gameMode==='ai'&&lp&&lai){
    me=lp;op=lai;drawChar(lp,true,{look:profile.look});drawChar(lai,false,{look:cpuLook,boss:isBossFight()});
    drawEffects(lw?lw.shots:[]);
  }
  if(gameMode==='online'&&TEAM2&&olW&&olMe){
    me=olMe;op=nearestFoe(olMe)||olMe;
    var ord=SIM.TEAM_SLOTS.filter(function(s){return olW.chars[s]&&s!==mySlot;}).sort(function(x,y){return(slotRole(x)==='ally')-(slotRole(y)==='ally');}).concat([mySlot]);
    ord.forEach(function(s){drawFootMark(olW.chars[s],slotRole(s));});
    ord.forEach(function(s){var st=teamStyle(s);drawChar(olW.chars[s],s===mySlot,{look:st.look,team:st.team,label:teamLabel(s)});});
    drawEffects(onlineShots());
  }
  else if(gameMode==='online'&&olMe&&olOpp){
    me=olMe;op=olOpp;drawChar(olMe,true,{look:profile.look});drawChar(olOpp,false,{look:oppInfo.look});
    drawEffects(onlineShots());
  }
  if(kc){drawKillFx(kc,kt);ctx.restore();}
  drawWeather(stageTheme);
  ctx.fillStyle=GRADS.vignette;ctx.fillRect(0,0,VW,VH);
  if(kc&&kt<.16){ctx.save();ctx.globalAlpha=(1-kt/.16)*.55;ctx.fillStyle='#fff';ctx.fillRect(0,0,VW,VH);ctx.restore();}
  if(gameMode==='online'&&TEAM2){   // 2v2：左は自分のチーム、右は相手のチーム
    drawHudSide(true,t('c.teamMine'),teamNames('me')+(teamSlots('ally').length?' / '+teamNames('ally'):''),pw,'#9D74FF');
    drawHudSide(false,t('c.teamFoe'),teamNames('foe'),aw,'#FF4D5E');
  }else{
    drawHudSide(true,profile.name,t('c.you'),pw,'#9D74FF');
    drawHudSide(false,gameMode==='ai'?(isBossFight()?'BOSS':'CPU'):(oppInfo.name||t('c.opp')),gameMode==='ai'?diffName(difficulty):(oppInfo.tier||'ONLINE'),aw,isBossFight()?'#E8C66A':'#FF4D5E');
  }
  if(me&&op){
    if(gameMode==='online'&&TEAM2)drawMinimapTeam();else drawMinimap(me.x,op.x);
    var ro=gameMode==='ai'?lRoundOver:olRoundOver,rn=Math.max(1,Math.min(5,pw+aw+(ro?0:1)));
    ctx.font='700 9px '+FONT_UI;setLS(3);ctx.textAlign='center';ctx.fillStyle='rgba(255,197,61,.9)';ctx.fillText('ROUND '+rn,VW/2,46);setLS(0);
  }
  if(me&&!lobbyPhase&&!matchOver)drawWeaponStrip(me);
  if(gameMode==='online'&&!lobbyPhase)drawPing();
  // ロビー中はFIGHT!を温存し、カウントダウン明けに表示する
  if(flashTimer>0&&!lobbyPhase)drawFlash();
  if(lobbyPhase&&!bossIntro)drawLobby();
  if(tierUp)drawTierUp();
  if(bossIntro)drawBossIntro();
  if(unlockFx)drawUnlockFx();
  if(slayFx)drawSlayFx();
}

// ============================================================
// メインループ
// ============================================================
var FRAME_MS=1000/60,lastTime=0,accumulator=0;
function loop(ts){
  if(!loopRunning)return;
  if(lastTime===0)lastTime=ts;var delta=ts-lastTime;lastTime=ts;if(delta>200)delta=200;
  accumulator+=delta;
  while(accumulator>=FRAME_MS){
    frame++;
    if(gameMode==='ai'&&!lobbyPhase)gameUpdateLocal();
    if(gameMode==='range')updateRange();
    if(gameMode==='online'&&!lobbyPhase&&!olRoundOver)updateOnline();
    updateFx();
    updateCamera();accumulator-=FRAME_MS;
  }
  if(frame%60===0)fitCanvas();   // 表示サイズが変わっても解像度を合わせ続ける
  drawScene();requestAnimationFrame(loop);
}
function startLoop(){frame=0;loopRunning=true;lastTime=0;accumulator=0;fitCanvas();requestAnimationFrame(loop);}

// スマホの左右ボタン用
function setKey(k,on){if(k!=='left'&&k!=='right')return;keys[k]=!!on;if(gameMode==='online')sendInput();}
updateWeaponBar();

// ゲームの基本数値は書き換え不可にする（武器・ステージの数値は sim.js 側で固定済み）
function deepFreeze(o){Object.getOwnPropertyNames(o).forEach(function(k){var v=o[k];if(v&&typeof v==='object')deepFreeze(v);});return Object.freeze(o);}
[TIER_LADDER,LOOK_OPTS,LOOK_DEFAULT,TEAM].forEach(deepFreeze);

// ============================================================
// ページの背景：奥行きのある多層の背景
//   奥から：ゆっくり動く色の光 → 細かいグリッド → 手前へ流れる床のグリッド → 光の粒（奥・中・手前の3層）→ ふちの暗がり
//   マウスとスクロールで、層ごとに違う量だけずれる（パララックス）。文字が読めるよう、明るさはおさえる
//   ホームのデモ中・試合中・タブが見えていないときは止める（最後の絵を残す）
// ============================================================
var BGFX={cv:null,g:null,w:0,h:0,dpr:1,mx:0,my:0,tx:0,ty:0,last:0,drawn:false,still:false,parts:[]};
function initBgFx(){
  var cv=document.getElementById('bg-fx');if(!cv||!cv.getContext)return;
  BGFX.cv=cv;BGFX.g=cv.getContext('2d');
  try{BGFX.still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  for(var i=0;i<72;i++)BGFX.parts.push({x:Math.random(),y:Math.random(),z:i<36?0:i<60?1:2,s:Math.random(),p:Math.random()*6.283});
  window.addEventListener('pointermove',function(e){BGFX.tx=(e.clientX/Math.max(1,innerWidth)-.5)*2;BGFX.ty=(e.clientY/Math.max(1,innerHeight)-.5)*2;},{passive:true});
  window.addEventListener('resize',sizeBgFx);
  sizeBgFx();requestAnimationFrame(bgFxLoop);
}
function sizeBgFx(){
  var d=Math.min(1.5,window.devicePixelRatio||1);
  BGFX.dpr=d;BGFX.w=innerWidth;BGFX.h=innerHeight;
  BGFX.cv.width=Math.round(BGFX.w*d);BGFX.cv.height=Math.round(BGFX.h*d);
  BGFX.drawn=false;
}
function bgFxLoop(ts){
  requestAnimationFrame(bgFxLoop);
  var cl=document.body.classList,idle=document.hidden||cl.contains('demo')||cl.contains('in-game')||BGFX.still;
  if(BGFX.drawn&&(idle||ts-BGFX.last<33))return;   // 動かすのは 30fps まで
  BGFX.last=ts;drawBgFx(BGFX.still?0:ts/1000);BGFX.drawn=true;
}
function drawBgFx(tm){
  var g=BGFX.g,w=BGFX.w,h=BGFX.h,d=BGFX.dpr;
  BGFX.mx+=(BGFX.tx-BGFX.mx)*.06;BGFX.my+=(BGFX.ty-BGFX.my)*.06;
  var mx=BGFX.mx,my=BGFX.my,sy=window.scrollY||0,R=Math.max(w,h);
  g.setTransform(d,0,0,d,0,0);
  g.fillStyle='#07080C';g.fillRect(0,0,w,h);
  // 1) ゆっくり動く色の光（紫・赤・金・青）
  [[.5,-.06,'157,116,255',.17,.95],[1.06,1.08,'255,77,94',.1,.75],[-.08,1.04,'255,197,61',.075,.7],[.86,.3,'56,120,255',.055,.55]].forEach(function(b,i){
    var bx=(b[0]+Math.sin(tm*.05+i*1.7)*.09)*w-mx*8,by=(b[1]+Math.cos(tm*.04+i*2.3)*.07)*h-my*6-sy*.03,gr=g.createRadialGradient(bx,by,0,bx,by,R*b[4]);
    gr.addColorStop(0,'rgba('+b[2]+','+b[3]+')');gr.addColorStop(1,'rgba('+b[2]+',0)');
    g.fillStyle=gr;g.fillRect(0,0,w,h);
  });
  // 2) 奥のグリッド（細かく、うすく、ゆっくり流れる）
  var cs=46,ox=((-mx*10+tm*4)%cs+cs)%cs,oy=((-my*8-sy*.12)%cs+cs)%cs;
  g.beginPath();
  for(var x=ox-cs;x<w+cs;x+=cs){g.moveTo(x,0);g.lineTo(x,h);}
  for(var y=oy-cs;y<h+cs;y+=cs){g.moveTo(0,y);g.lineTo(w,y);}
  g.strokeStyle='rgba(255,255,255,.026)';g.lineWidth=1;g.stroke();
  // 3) 手前の床のグリッド（地平線から手前へ流れる。遠くほど暗い）
  var hz=h*.64-my*12-Math.min(sy*.1,h*.3),cx=w/2-mx*30;
  if(hz<h){
    g.save();g.beginPath();g.rect(0,hz,w,h-hz);g.clip();
    var fg=g.createLinearGradient(0,hz,0,h);fg.addColorStop(0,'rgba(157,116,255,0)');fg.addColorStop(1,'rgba(157,116,255,.17)');
    g.strokeStyle=fg;g.lineWidth=1;g.beginPath();
    for(var i=-16;i<=16;i++){g.moveTo(cx+i*w*.018,hz);g.lineTo(cx+i*w*.2,h);}
    var off=(tm*.07)%1;
    for(var j=0;j<14;j++){var dd=Math.pow((j+off)/14,2.2),yy=hz+(h-hz)*dd;g.moveTo(0,yy);g.lineTo(w,yy);}
    g.stroke();
    var hg=g.createLinearGradient(0,hz,0,hz+46);hg.addColorStop(0,'rgba(255,197,61,.065)');hg.addColorStop(1,'rgba(255,197,61,0)');
    g.fillStyle=hg;g.fillRect(0,hz,w,46);
    g.restore();
  }
  // 4) 光の粒：奥（小さく遅い）・中・手前（大きく、ぼけて、よく動く）
  var Z=[{sp:.005,r:.9,a:.4,px:6},{sp:.011,r:1.7,a:.3,px:16},{sp:.02,r:3.6,a:.17,px:36}];
  BGFX.parts.forEach(function(p){
    var L=Z[p.z],yy2=((p.y-tm*L.sp*(.6+p.s*.8)-sy*L.px*.00012)%1+1)%1,px=(p.x+Math.sin(tm*.25+p.p)*.012)*w-mx*L.px,py=yy2*h-my*L.px*.7;
    var tw=.55+.45*Math.sin(tm*1.3+p.p*3),col=p.s<.18?'255,214,120':p.s<.4?'190,160,255':'205,225,255',r=L.r*(.7+p.s*.6);
    if(p.z===2){
      var rg=g.createRadialGradient(px,py,0,px,py,r*2.4);rg.addColorStop(0,'rgba('+col+','+(L.a*tw).toFixed(3)+')');rg.addColorStop(1,'rgba('+col+',0)');
      g.fillStyle=rg;g.beginPath();g.arc(px,py,r*2.4,0,Math.PI*2);g.fill();
    }else{g.fillStyle='rgba('+col+','+(L.a*tw).toFixed(3)+')';g.beginPath();g.arc(px,py,r,0,Math.PI*2);g.fill();}
  });
  // 5) ふちを暗く（真ん中の文字を読みやすく）
  var vg=g.createRadialGradient(w/2,h*.45,Math.min(w,h)*.3,w/2,h*.45,R*.8);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
  g.fillStyle=vg;g.fillRect(0,0,w,h);
}

[toggleMute,updateTosBtn,agreeTos,backToMenu,createRoom,joinRoom,startQueue,cancelQueue,showRankScreen,matchReady,pickMatchSlot,pickMatchWeapon,discordLogin,doLogout,

 startListen,toggleFullscreen,startRange,rangeReset,rangeSlot,rangeSetWeapon,onlineBack,olLoadout,olStartQueue,pickFormat,pickMode,
