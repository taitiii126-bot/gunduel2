.opt.swatch i{display:block;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.15);}
#tier-badge-wrap{text-align:center;margin-bottom:14px;}
.tier-row canvas.tier-mk{width:36px;height:36px;margin-right:10px;}
@media (max-width:720px){
  .pf-top{grid-template-columns:1fr;}
  .pf-card{max-width:320px;width:100%;margin:0 auto;}
  .look-wrap{grid-template-columns:1fr;}
  .look-prev{max-width:300px;width:100%;margin:0 auto;}
  .vol-row{grid-template-columns:90px 1fr 40px;}
}
</style>
</head>
<body>
<canvas id="bg-fx" aria-hidden="true"></canvas>
<canvas id="bg-demo" aria-hidden="true"></canvas>
<div id="bg-shade" aria-hidden="true"></div>
<div id="corner">
  <button id="settings-btn" class="corner-btn" onclick="showSettingsScreen()" data-i18n-title="common.settings">
    <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
  </button>
  <button id="mute-btn" class="corner-btn" onclick="toggleMute()" data-i18n-title="common.sound">
    <svg class="i ic-on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="i ic-off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
  </button>
</div>
<div id="wrap">

  <div id="tos-screen" class="screen">
    <div class="scr-head">
      <span class="kicker" data-i18n="tos.kicker"></span>
      <h1 class="scr-title" data-i18n="tos.title"></h1>
    </div>
    <div id="tos-box">
      <h4 class="danger" data-i18n="tos.h1"></h4>
      <ul><li data-i18n="tos.h1.li1"></li><li data-i18n="tos.h1.li2"></li><li data-i18n="tos.h1.li3"></li></ul>
      <h4 class="danger" data-i18n="tos.h2"></h4>
      <ul><li data-i18n="tos.h2.li1"></li><li data-i18n="tos.h2.li2"></li><li data-i18n="tos.h2.li3"></li></ul>
      <h4 data-i18n="tos.h3"></h4>
      <ul><li data-i18n="tos.h3.li1"></li><li data-i18n="tos.h3.li2"></li><li data-i18n="tos.h3.li3"></li></ul>
    </div>
    <div class="tos-lang lang-seg" data-lang-seg></div>
    <label class="tos-agree-row"><input type="checkbox" id="tos-checkbox" onchange="updateTosBtn()"> <span data-i18n="tos.agree"></span></label>
    <button id="tos-agree-btn" onclick="agreeTos()" disabled data-i18n="tos.start"></button>
  </div>

  <div id="mode-screen" class="screen" style="display:none;">
    <!-- 上：プロフィールのバー（顔・名前・称号・ティア）。押すとプロフィール画面へ -->
    <button class="home-bar" onclick="showProfileScreen()" data-i18n-title="home.barHint">
      <canvas class="hb-av" id="hb-av" width="104" height="104"></canvas>
      <span class="hb-who"><b class="hb-name" id="hb-name"></b><small class="hb-title" id="hb-title"></small></span>
      <span class="hb-tier"><canvas id="hb-tier" width="96" height="96"></canvas><span id="hb-tier-name"></span><small id="hb-rate"></small></span>
      <svg class="i hb-arrow" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <div class="home-main">
      <div class="logo">
        <div class="logo-mark"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/></svg></div>
        <h1><span class="l1">GUN</span><span class="l2">DUEL</span></h1>
        <div class="logo-tag">1 ON 1 · <b>FIRST TO 3</b></div>
        <p data-i18n="home.tagline"></p>
      </div>
      <!-- 真ん中：対戦を始める大きなボタン -->
      <div class="play-grid">
        <button class="play-btn primary" onclick="showStageScreen()">
          <span class="pb-ic"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg></span>
          <b data-i18n="menu.ai"></b><small data-i18n="menu.ai.sub"></small>
        </button>
        <button class="play-btn online" onclick="showRoomScreen()">
          <span class="pb-ic"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span>
          <b data-i18n="menu.online"></b><small data-i18n="menu.online.sub"></small>
        </button>
      </div>
      <!-- 準備のボタン（小さめ） -->
      <div class="sub-grid">
        <button class="sub-btn" onclick="showLoadoutScreen('mode')"><svg class="i" viewBox="0 0 24 24"><path d="M3 10h13l2-2h3v4h-3l-1 1H9l-1 5H5l1-5H3z"/><path d="M11 13v2"/></svg><span data-i18n="menu.loadout"></span></button>
        <button class="sub-btn" onclick="showFriendsScreen()"><span class="sb-ic"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.2A5.5 5.5 0 0 1 21.5 20"/></svg><span class="mb-badge" id="fr-badge" style="display:none;"></span></span><span data-i18n="menu.friends"></span></button>
        <button class="sub-btn" onclick="showRankScreen()"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4v-7H4zM10 20h4V4h-4zM16 20h4v-11h-4z"/></svg><span data-i18n="menu.rank"></span></button>
        <button class="sub-btn" onclick="startRange()"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg><span data-i18n="menu.range"></span></button>
      </div>
      <div id="login-bar" style="display:none;">
        <button id="login-btn" class="login-btn" onclick="discordLogin()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.3 5.3A16.7 16.7 0 0 0 15.1 4l-.2.4c1.4.3 2.6.9 3.7 1.6a13.9 13.9 0 0 0-12-.1c1-.6 2.3-1.2 3.6-1.5L10 4c-1.5.1-3 .6-4.4 1.3C3.1 9.1 2.4 12.8 2.7 16.4A16.8 16.8 0 0 0 7.9 19l1-1.4c-.9-.3-1.7-.7-2.4-1.2l.5-.4a12 12 0 0 0 10.1 0l.5.4c-.8.5-1.6.9-2.4 1.2l1 1.4c1.9-.6 3.7-1.5 5.2-2.6.4-4.2-.7-7.8-2.1-11.1ZM9 14.2c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.9.9 1.8 2c0 1.1-.8 2-1.8 2Zm6.1 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2c0 1.1-.8 2-1.8 2Z"/></svg>
          <span data-i18n="login.discord"></span>
        </button>
        <div id="login-info" style="display:none;">
          <span id="login-name"></span><span id="login-record"></span><span id="login-pres"></span>
          <button id="logout-btn" onclick="doLogout()" data-i18n="login.logout"></button>
        </div>
        <p class="login-note" id="login-note" data-i18n="login.note"></p>
      </div>
    </div>
  </div>

  <div id="stage-screen" class="screen" style="display:none;">
    <div class="scr-head">
      <span class="kicker" data-i18n="stage.kicker"></span>
      <h1 class="scr-title" data-i18n="stage.title"></h1>
      <p class="scr-sub" data-i18n="stage.sub"></p>
    </div>
    <div class="st-wrap">
      <button class="st-arrow" onclick="stageStep(-1)" aria-label="prev"><svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <div class="st-main" id="st-main">
        <div class="st-left">
          <div class="st-preview"><canvas id="stage-preview"></canvas><span class="st-new" id="st-new" data-i18n="stage.new"></span></div>
          <canvas id="stage-map" class="st-map" width="720" height="96"></canvas>
        </div>
        <div class="st-info">
          <span class="st-no" id="st-no"></span>
          <h2 class="st-name" id="st-name"></h2>
          <p class="st-theme" id="st-theme"></p>
          <p class="st-desc" id="st-desc"></p>
          <div class="st-tags" id="st-tags"></div>
          <button class="room-btn" onclick="confirmStage()" data-i18n="stage.go"></button>
          <p class="st-keys" data-i18n="stage.keys"></p>
        </div>
      </div>
      <button class="st-arrow" onclick="stageStep(1)" aria-label="next"><svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <div class="st-dots" id="st-dots"></div>
    <button class="back-btn" onclick="showModeScreen()"><svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg><span data-i18n="stage.backMode"></span></button>
  </div>

  <div id="cpu-screen" class="screen menu" style="display:none;">
    <div class="scr-head">
      <span class="kicker" data-i18n="cpu.kicker"></span>
      <h1 class="scr-title" data-i18n="cpu.title"></h1>
      <p class="scr-sub" data-i18n="cpu.sub"></p>
      <p class="pill" id="cpu-stage-note"></p><p class="pill" id="cpu-loadout-note"></p><button class="pill-btn" onclick="showLoadoutScreen('cpu')"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><span data-i18n="cpu.change"></span></button>
    </div>
    <div id="cpu-list"></div>
    <button class="back-btn" onclick="showStageScreen()"><svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg><span data-i18n="cpu.backStage"></span></button>
  </div>

  <div id="room-screen" class="screen menu" style="display:none;">
    <!-- 戻るボタンと、いまどこまで選んだか（上に固定。戻るボタンはいつも同じ場所） -->
    <div class="ol-bar">
      <button class="ol-back" onclick="onlineBack()"><svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg><span data-i18n="common.back"></span></button>
      <ol class="ol-steps" id="ol-steps"></ol>
    </div>
    <div class="scr-head">
      <span class="kicker" data-i18n="room.kicker"></span>
      <h1 class="scr-title" data-i18n="room.title"></h1>
      <p class="pill" id="room-loadout-note"></p><button class="pill-btn" onclick="olLoadout()"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><span data-i18n="cpu.change"></span></button>
    </div>
    <section class="ol-sec"><h3 class="ol-h"><i>1</i><span data-i18n="ol.stepFormat"></span></h3><div class="ol-fmts" id="ol-fmts"></div></section>
    <section class="ol-sec" id="ol-mode-sec"><h3 class="ol-h"><i>2</i><span data-i18n="ol.stepMode"></span></h3><div class="ol-modes" id="ol-modes"></div></section>
    <section class="ol-sec" id="ol-go-sec">
      <h3 class="ol-h"><i>3</i><span id="ol-go-title"></span></h3>
      <div class="room-card" id="ol-party" style="display:none"></div>
      <div class="room-card mm-card" id="ol-queue">
        <div id="mm-start"><button class="room-btn" id="mm-start-btn" onclick="olStartQueue()"></button><p class="ol-note" id="mm-start-note"></p></div>
        <div id="mm-wait" style="display:none;">
          <div class="mm-radar"><span></span><span></span><span></span></div>
          <div id="mm-wait-main"></div>
          <div id="mm-wait-time"></div>
          <div id="mm-wait-sub"></div>
          <button class="room-btn mm-cancel" onclick="cancelQueue()" data-i18n="mm.cancel"></button>
        </div>
      </div>
      <div id="ol-friend">
        <div class="room-card">
          <h3><span class="tag">HOST</span><span data-i18n="room.host"></span></h3>
          <p class="ol-note" data-i18n="ol.hostNote"></p>
          <button class="room-btn" id="create-btn" onclick="createRoom()" data-i18n="room.create"></button>
          <div id="room-number-display"></div>
          <div id="ol-lobby"></div>
        </div>
        <div class="room-card">
          <h3><span class="tag">GUEST</span><span data-i18n="room.guest"></span></h3>
          <input class="room-input" id="join-input" data-i18n-ph="room.placeholder" maxlength="6" inputmode="numeric" autocomplete="off" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
          <button class="room-btn" onclick="joinRoom()" data-i18n="room.join"></button>
        </div>
        <div class="room-card">
          <h3><span class="tag">FRIEND</span><span data-i18n="ol.inviteTitle"></span></h3>
          <p class="ol-note" data-i18n="ol.inviteNote"></p>
          <button class="room-btn alt" onclick="showFriendsScreen()" data-i18n="ol.toFriends"></button>
        </div>
      </div>
      <div id="room-status"></div>
    </section>
  </div>

  <div id="rank-screen" class="screen menu" style="display:none;">
    <div class="scr-head">
      <span class="kicker" data-i18n="rank.kicker"></span>
      <h2 class="scr-title" data-i18n="rank.title"></h2>
      <p class="pill" id="rank-note"></p>
    </div>
    <div class="rk-tabs" id="rk-tabs"><button class="sel" onclick="rankKind('1v1')">1v1</button><button onclick="rankKind('2v2')">2v2</button></div>
    <div id="rank-head" class="rk-row rk-head"><span class="rk-no">#</span><span class="rk-who" data-i18n="rank.player"></span><span class="rk-tier" data-i18n="rank.tier"></span><span class="rk-rate" data-i18n="rank.rate"></span><span class="rk-wr" data-i18n="rank.winrate"></span></div>
    <div id="rank-list"></div>
    <div id="rank-me"></div>
    <button class="back-btn" onclick="showModeScreen()"><svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg><span data-i18n="common.backMenu"></span></button>
  </div>

  <div id="friends-screen" class="screen menu" style="display:none;">
    <div class="scr-head">
      <span class="kicker" data-i18n="fr.kicker"></span>
      <h2 class="scr-title" data-i18n="fr.title"></h2>
    </div>
    <div id="fr-login" class="settings-section fr-login">
      <p data-i18n="fr.needLogin"></p>
      <button class="login-btn" onclick="discordLogin()"><span data-i18n="login.discord"></span></button>
    </div>
    <div id="fr-main" style="display:none;">
      <div class="settings-section">
        <h3><span data-i18n="fr.addTitle"></span><span>ADD FRIEND</span></h3>
        <div class="fr-me"><span data-i18n="fr.myId"></span><b id="fr-myid"></b><button class="acc-copy" onclick="copyFid(this)" data-i18n="pf.copy"></button></div>
        <div class="fr-add">
          <input id="fr-add-input" class="fr-input" maxlength="9" data-i18n-ph="fr.addPh" autocomplete="off" spellcheck="false" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9-]/g,'')" onkeydown="if(event.key==='Enter')sendFriendRequest()">
          <button class="fr-send" onclick="sendFriendRequest()" data-i18n="fr.add"></button>
        </div>

<script>
(function(){
'use strict';
// コンソールやブックマークレットから、ゲームの数値や敵の位置を読み書きできないように全体を閉じ込める。
// 外から呼べるのは、画面のボタンが使う関数だけ（一番下で登録）。
var NativeWebSocket=window.WebSocket;   // あとから差し替えられても、読み込み時点の本物を使う
// 対戦の中身（物理・武器・CPU）は sim.js。サーバーも同じファイルを使う。読み込んだら外から触れないように消す
var SIM=window.GunDuelSim;
try{delete window.GunDuelSim;}catch(e){}
if(!SIM){
  document.body.insertAdjacentHTML('afterbegin','<p style="position:fixed;top:0;left:0;right:0;z-index:9999;margin:0;padding:12px;background:#FF4D5E;color:#fff;text-align:center;font-weight:700">sim.js を読み込めませんでした。index.html と同じ場所に sim.js を置いてください。</p>');
  return;
}
if(!window.GunDuelLang){
  document.body.insertAdjacentHTML('afterbegin','<p style="position:fixed;top:0;left:0;right:0;z-index:9999;margin:0;padding:12px;background:#FF4D5E;color:#fff;text-align:center;font-weight:700">lang.js を読み込めませんでした。index.html と同じ場所に lang.js を置いてください。</p>');
}
// ============================================================
// 設定（言語・音量）と文字の翻訳
// ============================================================
// 画面の文字はすべて lang.js の辞書から取る。読み込んだら外から触れないように消す
var LANGS=window.GunDuelLang||{ja:{}};
try{delete window.GunDuelLang;}catch(e){}
var SETTINGS={lang:'ja',bgm:60,se:80};
(function loadSettings(){
  var saved=null;
  try{saved=JSON.parse(localStorage.getItem('gunduel_settings')||'null');}catch(e){}
  if(saved&&typeof saved==='object'){
    if(LANGS[saved.lang])SETTINGS.lang=saved.lang;
    if(saved.bgm>=0&&saved.bgm<=100)SETTINGS.bgm=+saved.bgm;
    if(saved.se>=0&&saved.se<=100)SETTINGS.se=+saved.se;
  }else{
    // 初めて開いたときは、ブラウザの言語に合わせる
    var nl=String(navigator.language||'').toLowerCase();
    SETTINGS.lang=nl.indexOf('ja')===0||!LANGS.en?'ja':'en';
  }
})();
function saveSettings(){try{localStorage.setItem('gunduel_settings',JSON.stringify(SETTINGS));}catch(e){}}
// t('キー', {name:'値'}) → 今の言語の文字。無ければ日本語、それも無ければキーそのもの
function t(key,vars){
  var d=LANGS[SETTINGS.lang]||LANGS.ja,s=d[key];
  if(s==null&&LANGS.ja)s=LANGS.ja[key];
  if(s==null)s=key;
  if(vars)s=s.replace(/\{(\w+)\}/g,function(m,k){return vars[k]!=null?vars[k]:m;});
  return s;
}
function diffName(d){return t('diff.'+d);}
function stageName(id){return t('stage.'+id+'.name');}
function stageDesc(id){return t('stage.'+id+'.desc');}
function wName(id){return t('w.'+id+'.name');}
function wShort(id){return t('w.'+id+'.short');}
function wDesc(id){return t('w.'+id+'.desc');}
function applyI18n(){
  document.documentElement.lang=SETTINGS.lang;
  document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){el.setAttribute('placeholder',t(el.getAttribute('data-i18n-ph')));});
  document.querySelectorAll('[data-i18n-title]').forEach(function(el){var v=t(el.getAttribute('data-i18n-title'));el.setAttribute('title',v);el.setAttribute('aria-label',v);});
  renderLangSegs();
  // 文字を組み立てて表示している画面も作り直す
  renderKbUI();updateWeaponBar();renderLoginUI();renderLoadoutNotes();
  renderStageList();renderCpuList();renderLoadoutUI();renderProfileUI();renderSettingsUI();renderFriends();renderFriendModal();renderHomeBar();
  var rs=document.getElementById('room-status');if(rs&&rs.dataset.key)setRoomStatus(rs.dataset.key,rs.dataset.dot==='1');
}
function renderLangSegs(){
  document.querySelectorAll('[data-lang-seg]').forEach(function(el){
    var html='';
    Object.keys(LANGS).forEach(function(k){
      html+='<button class="'+(k===SETTINGS.lang?'sel':'')+'" onclick="setLang(\''+k+'\')">'+esc(LANGS[k]['lang.name']||k)+'</button>';
    });
    el.innerHTML=html;
  });
}
function setLang(k){
  if(!LANGS[k]||k===SETTINGS.lang)return;
  SETTINGS.lang=k;saveSettings();applyI18n();
}
// ---- 設定画面：音量 ----
function renderSettingsUI(){
  ['bgm','se'].forEach(function(kind){
    var r=document.getElementById('vol-'+kind),v=document.getElementById('vol-'+kind+'-v');
    if(r){r.value=SETTINGS[kind];r.style.setProperty('--p',SETTINGS[kind]+'%');}
    if(v)v.textContent=SETTINGS[kind];
  });
}
function setVolume(kind,val){
  if(kind!=='bgm'&&kind!=='se')return;
  SETTINGS[kind]=Math.max(0,Math.min(100,Math.round(+val)||0));
  saveSettings();applyVolumes();renderSettingsUI();
}
function testSe(){ensureAudio();SFX.shootPistol();}
var settingsBack='mode-screen';
function closeSettings(){
  var back={'profile-screen':showProfileScreen,'loadout-screen':function(){showLoadoutScreen(loadoutBack);},'stage-screen':showStageScreen,'cpu-screen':showCpuScreen,'room-screen':showRoomScreen};
  (back[settingsBack]||showModeScreen)();
}
// 部屋の状態表示（言語を切り替えても出し直せるようにキーで覚えておく）
function setRoomStatus(key,dot,vars){
  var el=document.getElementById('room-status');if(!el)return;
  el.dataset.key=key;el.dataset.dot=dot?'1':'';
  el.innerHTML=(dot?'<span class="ping-dot"></span>':'')+esc(t(key,vars));
}
function setRoomStatusText(text){
  var el=document.getElementById('room-status');if(!el)return;
  el.dataset.key='';el.textContent=text;
}
// ============================================================
// 定数
// ============================================================
var VW=SIM.VW,VH=SIM.VH,WORLD_W=SIM.WORLD_W,GND=SIM.GND;
var MAX_HP=SIM.MAX_HP,CHAR_W=SIM.CHAR_W,CHAR_H=SIM.CHAR_H;
var GRAVITY=SIM.GRAVITY,JUMP_F=SIM.JUMP_F,SPEED=SIM.SPEED;
var WEAPONS=SIM.WEAPONS;

// ============================================================
// サウンド（Web Audio APIでその場で作る。外部ファイル不要）
// 効果音とBGMは別々の音量つまみを通す：音源 → 効果音/BGM → 全体（ミュート）→ スピーカー
// ============================================================
var actx=null,sfxMuted=false,sfxSilent=false,masterBus=null,seBus=null,bgmBus=null;
try{if(localStorage.getItem('gunduel_muted')==='1')sfxMuted=true;}catch(e){}
function ensureAudio(){
  if(!actx){
    try{
      actx=new(window.AudioContext||window.webkitAudioContext)();
      masterBus=actx.createGain();masterBus.connect(actx.destination);
      seBus=actx.createGain();seBus.connect(masterBus);
      bgmBus=actx.createGain();bgmBus.connect(masterBus);
      applyVolumes();
    }catch(e){actx=null;}
  }else if(actx.state==='suspended'){actx.resume();}
  bgmSync();
}
// ブラウザは「ユーザーが何か操作するまで音を出さない」ので、最初の操作で準備する
['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,ensureAudio,{passive:true});});
function applyVolumes(){
  if(!actx)return;
  var now=actx.currentTime;
  masterBus.gain.setTargetAtTime(sfxMuted?0:1,now,.02);
  seBus.gain.setTargetAtTime(SETTINGS.se/100,now,.02);
  bgmBus.gain.setTargetAtTime(Math.pow(SETTINGS.bgm/100,1.6)*.9,now,.05);
}
function toggleMute(){
  sfxMuted=!sfxMuted;try{localStorage.setItem('gunduel_muted',sfxMuted?'1':'0');}catch(e){}
  ensureAudio();applyVolumes();updateMuteBtn();
}
function updateMuteBtn(){var b=document.getElementById('mute-btn');if(b)b.classList.toggle('muted',sfxMuted);}
function sfxOff(){return sfxMuted||sfxSilent||!actx||SETTINGS.se<=0;}
function playTone(freq,dur,type,vol,delay){
  if(sfxOff())return;
  var t0=actx.currentTime+(delay||0),osc=actx.createOscillator(),g=actx.createGain();
  osc.type=type||'sine';osc.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.22,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  osc.connect(g);g.connect(seBus);osc.start(t0);osc.stop(t0+dur+.03);
}
function playSweep(f1,f2,dur,type,vol,delay){
  if(sfxOff())return;
  var t0=actx.currentTime+(delay||0),osc=actx.createOscillator(),g=actx.createGain();
  osc.type=type||'square';osc.frequency.setValueAtTime(f1,t0);osc.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.22,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  osc.connect(g);g.connect(seBus);osc.start(t0);osc.stop(t0+dur+.03);
}
var noiseBuf=null;
function getNoise(){
  if(!noiseBuf&&actx){
    var n=Math.floor(actx.sampleRate*1.2);noiseBuf=actx.createBuffer(1,n,actx.sampleRate);
    var d=noiseBuf.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
  }
  return noiseBuf;
}
function playNoiseFilt(dur,vol,delay,ftype,f1,f2,q){
  if(sfxOff())return;
  var t0=actx.currentTime+(delay||0);
  var src=actx.createBufferSource();src.buffer=getNoise();

function bgmOsc(type,freq,t0,dur,vol,o){
  o=o||{};
  var osc=actx.createOscillator(),gn=actx.createGain(),out=osc;
  osc.type=type;osc.frequency.setValueAtTime(freq,t0);
  if(o.detune)osc.detune.setValueAtTime(o.detune,t0);
  var a=o.a||.005;
  gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(vol,t0+a);
  gn.gain.setTargetAtTime(0,t0+Math.max(a,dur*(o.hold||.35)),dur*(o.rel||.35));

    var f=actx.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||.7;
    f.frequency.setValueAtTime(o.lp,t0);if(o.lpEnd)f.frequency.exponentialRampToValueAtTime(o.lpEnd,t0+dur);
    osc.connect(f);out=f;
  }
  out.connect(gn);gn.connect(bgmBus);osc.start(t0);osc.stop(t0+dur*2+.1);
}
function bgmNoise(t0,dur,vol,type,freq,q){
  var src=actx.createBufferSource();src.buffer=getNoise();

  var gn=actx.createGain();gn.gain.setValueAtTime(vol,t0);gn.gain.exponentialRampToValueAtTime(.0008,t0+dur);

}

  var el=document.getElementById('toast');if(!el)return;
  el.textContent=msg;el.classList.add('on');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('on');},1800);
}
function storeKey(base){return STORE_ACC?base+'@'+STORE_ACC:base;}
function hasAccStore(acc){try{return !!localStorage.getItem('gunduel_profile@'+acc);}catch(e){return false;}}
function resetGuestStore(){try{localStorage.removeItem('gunduel_profile');localStorage.removeItem('gunduel_loadout');}catch(e){}}

var loadout=SIM.cleanLoadout(null,false);
try{var _lo=localStorage.getItem(storeKey('gunduel_loadout'));if(_lo)loadout=SIM.cleanLoadout(JSON.parse(_lo),false);}catch(e){}
function writeLoadoutLocal(){try{localStorage.setItem(storeKey('gunduel_loadout'),JSON.stringify(loadout));}catch(e){}}
function saveLoadout(){writeLoadoutLocal();profileChanged();}
var loadoutSel=0,loadoutBack='mode';
function loadoutText(){return loadout.map(wShort).join(' / ');}
function showLoadoutScreen(from){loadoutBack=from||'mode';loadoutSel=0;showScreen('loadout-screen');renderLoadoutUI();}
function closeLoadout(){
  writeLoadoutLocal();if(STORE_ACC)pushProfileSoon(0);
  toast(t(STORE_ACC?'lo.savedAcc':'lo.saved'));
  if(loadoutBack==='cpu')showCpuScreen();else if(loadoutBack==='room'){var r=OL_RESUME;OL_RESUME=null;showRoomScreen(r&&r.mode==='friend'?{fmt:r.fmt,mode:null}:r);}else showModeScreen();
}
function pickLoadoutSlot(i){loadoutSel=i;SFX.switchW();renderLoadoutUI();}
function pickLoadoutWeapon(id){
  id=+id;if(!WEAPONS[id])return;
  var cur=loadout.indexOf(id);
  if(cur===loadoutSel)return;
  if(cur>=0)loadout[cur]=loadout[loadoutSel];      // 別の枠にあれば入れ替える
  loadout[loadoutSel]=id;
  if(cur<0&&loadoutSel<2)loadoutSel++;
  saveLoadout();SFX.switchW();renderLoadoutUI();updateWeaponBar();
}
// 数値を画面用に：射程・威力（1回押したときの最大）・連射（1秒あたり）・弾数・リロード秒
function weaponStats(id){
  var W=WEAPONS[id],per=W.dmg*(W.pellets||1)*(W.burst||1);
  var interval=W.kind==='beam'?(W.charge+W.reload):(W.mag===1?W.reload:W.rate);
  return{
    range:W.range,
    power:per,
    rps:60/Math.max(1,interval),
    mag:W.mag,
    reload:W.reload/60
  };
}
function renderLoadoutUI(){
  var slotsEl=document.getElementById('lo-slots'),gridEl=document.getElementById('lo-grid');
  if(!slotsEl||!gridEl)return;
  var sh='';
  loadout.forEach(function(id,i){
    sh+='<button class="lo-slot'+(i===loadoutSel?' sel':'')+'" style="--wc:'+WEAPONS[id].color+'" onclick="pickLoadoutSlot('+i+')">'+
      '<span class="ls-no">'+esc(t('lo.slot',{n:i+1})+(i===0?' · '+t('lo.start'):''))+'</span><canvas width="192" height="80" data-gun="'+id+'"></canvas><b>'+esc(wName(id))+'</b></button>';
  });
  slotsEl.innerHTML=sh;
  var gh='';
  WEAPON_ORDER.forEach(function(id,n){
    var W=WEAPONS[id],st=weaponStats(id),eq=loadout.indexOf(id);
    var bar=function(label,v,txt){return'<span>'+label+'</span><span class="lc-bar"><i style="width:'+Math.round(Math.max(.04,Math.min(1,v))*100)+'%"></i></span><span class="lc-val">'+txt+'</span>';};
    gh+='<button class="lo-card'+(eq>=0?' eq':'')+'" style="--i:'+n+';--wc:'+W.color+'" onclick="pickLoadoutWeapon('+id+')">'+
      '<canvas width="168" height="72" data-gun="'+id+'"></canvas>'+
      '<span class="lc-body"><span class="lc-name">'+esc(wName(id))+'<small>'+esc(enShort(id))+'</small>'+(eq>=0?'<span class="lc-eq">'+(eq+1)+'</span>':'')+'</span>'+
      '<span class="lc-desc">'+esc(wDesc(id))+'</span>'+
      '<span class="lc-stats">'+
        bar(t('st.range'),st.range/700,W.kind==='grenade'?t('st.approx',{n:W.range}):String(st.range))+
        bar(t('st.power'),st.power/50,W.pellets?(W.dmg+'×'+W.pellets):W.burst?(W.dmg+'×'+W.burst):String(W.dmg))+
        bar(t('st.rate'),st.rps/9,t('st.perSec',{n:st.rps.toFixed(1)}))+
        (W.kind==='melee'   // 近接武器は弾数・リロードのかわりに、出の速さと振ったあとの隙
          ?bar(t('st.wind'),1-(W.wind||0)/20,W.wind?t('st.sec',{n:(W.wind/60).toFixed(2)}):t('st.instant'))+
           bar(t('st.rec'),1-(W.rec||0)/24,W.rec?t('st.sec',{n:(W.rec/60).toFixed(2)}):t('st.none'))
          :bar(t('st.mag'),W.mag/30,String(W.mag))+
           bar(t('st.reload'),1-W.reload/240,t('st.sec',{n:st.reload.toFixed(1)})))+
      '</span></span></button>';
  });
  gridEl.innerHTML=gh;
  document.querySelectorAll('canvas[data-gun]').forEach(function(cv){
    var g=cv.getContext('2d'),id=+cv.getAttribute('data-gun');
    g.clearRect(0,0,cv.width,cv.height);
    drawGunIcon(g,id,0,0,cv.width,cv.height);
  });
  renderLoadoutNotes();
}

// CPU戦で鬼神に勝つと、CPU戦の一覧に出てくる（それまでは存在も見せない）。成績は profile.emperor に別に持つ

var EMP='emperor',EMP_BG='emperor';
var EMPEROR_LOOK={skin:2,eyes:1,eyeColor:3,brows:1,hair:2,hairColor:4,nose:0,mouth:3};
function emperorOpen(){return beaten('god');}
function emperorSlain(){return !!(profile.emperor&&profile.emperor.beat)||!!(profile.ach&&profile.ach.got&&profile.ach.got.emperor_slayer);}

// ============================================================
// 称号（二つ名）
// ============================================================
// 一覧とレア度は sim.js（サーバーと共通）、取り方はここ。名前と取り方の説明は lang.js の title.〇〇 / tcond.〇〇
// ・オンライン戦績・フレンド数・開拓者の称号は、いまの状態で決まる（サーバーも確かめる）
// ・それ以外は、一度取れば profile.ach.got に残る
var TITLE_RULES={
  rookie:function(){return true;},
  regular:function(){return beaten('normal');},
  bodyguard:function(){return beaten('hard');},
  demon_hunter:function(){return beaten('pro');},
  godslayer:function(){return beaten('god');},
  legend:function(){var p=profile.tierProgress&&profile.tierProgress.god;return !!(p&&p.straight);},
  veteran10:function(){return totalWL().w>=10;},
  veteran50:function(){return totalWL().w>=50;},
  veteran100:function(){return totalWL().w>=100;},
  fall30:function(){return totalWL().l>=30;},
  fall100:function(){return totalWL().l>=100;},
  unstoppable:function(){return(profile.ach.best||0)>=5;},
  wanderer:function(){return STAGE_ORDER.every(function(sid){return(profile.ach.stages[sid]||0)>0;});},
  emperor_slayer:function(){return !!(profile.emperor&&profile.emperor.beat);}
  // one_pistol・untouched・close_call・precision・pit_drop・short_sleeper・first_steps・rule_breaker は、
  // 試合の中の出来事で直接あげる（grantTitle）
};
var TITLES=SIM.TITLES.map(function(d){return{id:d.id,rare:!!d.rare,gift:!!d.gift,prism:!!d.prism,gate:!!d.gate,unlock:function(){return titleUnlocked(d.id);}};});
function titleDef(id){for(var i=0;i<SIM.TITLES.length;i++)if(SIM.TITLES[i].id===id)return SIM.TITLES[i];return null;}
function isRareTitle(id){var d=titleDef(id);return !!(d&&d.rare);}
function isMythicTitle(id){var d=titleDef(id);return !!(d&&d.mythic);}
function isGiftTitle(id){var d=titleDef(id);return !!(d&&d.gift);}
function isPrismTitle(id){var d=titleDef(id);return !!(d&&d.prism);}
// 運営の印（丸に✓）。称号と違って着け替えられないので、本物の証明になる
var DEV_SVG='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.4"/><path d="M6.9 12.6l3.4 3.4 6.9-7.5"/></svg>';
function devBadge(on){return on?'<span class="dev-badge" title="'+esc(t('badge.dev'))+'" aria-label="'+esc(t('badge.dev'))+'">'+DEV_SVG+'</span>':'';}
// 称号の文字の見せ方（mt＝黒と金／sv＝明朝の白銀＋プリズム／gt＝贈られた称号＝緑のネオン／nt＝レア＝青いネオン）
function titleCls(id){return isMythicTitle(id)?'mt':isPrismTitle(id)?'sv':isGiftTitle(id)?'gt':isRareTitle(id)?'nt':'';}
// 条件を満たしているか（武器ごとの称号は、その武器でのとどめの回数で決まる）
function titleRule(d){if(d.kill)return killsWith(d.kill.w)>=d.kill.n;var f=TITLE_RULES[d.id];return !!(f&&f());}
// 取り方の説明（武器ごとの称号は、ひな形に武器の名前と回数を入れる）
function titleCond(id){var d=titleDef(id);return d&&d.kill?t('tcond.kill',{weapon:t('w.'+d.kill.w+'.name'),n:d.kill.n}):t('tcond.'+id);}
function beaten(d){var p=profile.tierProgress&&profile.tierProgress[d];return !!(p&&p.beat);}
function totalWL(){var c=cpuTotals();return{w:c.w+(AUTH.user?AUTH.user.wins||0:0),l:c.l+(AUTH.user?AUTH.user.losses||0:0)};}   // CPU戦＋オンライン対戦
function killsWith(wid){return +(profile.ach.kills[wid]||0);}
function myTitleCtx(){return AUTH.user?{w:AUTH.user.wins||0,l:AUTH.user.losses||0,friends:FR.friends.length,pioneer:!!AUTH.user.pioneer,pioneer10:!!AUTH.user.pioneer10,hacker:!!AUTH.user.hacker,dev:!!AUTH.user.dev}:null;}
function titleUnlocked(id){
  var d=titleDef(id);if(!d)return false;
  if(d.gate)return SIM.titleOk(id,myTitleCtx());
  return !!profile.ach.got[id]||titleRule(d);
}
// 条件を満たした称号を「獲得済み」にして、新しく取れたものをお知らせする
function checkTitles(){
  ensureProfileShape();
  var got=profile.ach.got,changed=false;
  SIM.TITLES.forEach(function(d){
    if(got[d.id])return;
    var ok=d.gate?SIM.titleOk(d.id,myTitleCtx()):titleRule(d);
    if(ok){got[d.id]=1;changed=true;if(d.award)GIFT_Q.push(d.id);else if(d.id!=='rookie')TITLE_Q.push(d.id);}
  });
  if(changed){saveProfile();flushTitleNotes();if(currentScreen==='profile-screen')renderTitleChips();}
}
// 試合の中の出来事で称号をあげる（equip なら、そのまま付け替える）
function grantTitle(id,equip,quiet){
  ensureProfileShape();
  var fresh=!profile.ach.got[id];
  if(fresh){profile.ach.got[id]=1;if(!quiet)TITLE_Q.push(id);}
  if(equip)profile.title=id;
  if(fresh||equip){saveProfile();flushTitleNotes();if(currentScreen==='profile-screen')renderTitleChips();}
}
// 獲得のお知らせ（試合の途中は、終わってからまとめて）
var TITLE_Q=[],GIFT_Q=[],giftTimer=0;
function flushTitleNotes(){
  if(currentScreen==='game-screen'&&!matchOver)return;   // 試合中は、終わってから
  if(TITLE_Q.length){
    var ids=TITLE_Q.splice(0);
    note(ids.length===1?t('title.got',{name:titleText(ids[0])}):t('title.gotMany',{n:ids.length,names:ids.map(titleText).join(t('title.sep'))}));
    playTone(1046,.12,'triangle',.12);playTone(1568,.22,'triangle',.1,.1);
  }
  if(GIFT_Q.length)showGiftFx(GIFT_Q.shift());
}
// ---- 運営から贈られた称号のお祝い（緑のネオン・光の輪・火花）----

function closeGiftFx(){
  var el=document.getElementById('gift-fx');if(!el||!el.classList.contains('on'))return;
  clearTimeout(giftTimer);el.classList.remove('on');el.classList.add('out');
  setTimeout(function(){if(el.classList.contains('out')){el.className='';el.innerHTML='';}},420);
}

// ---- 称号のための記録（ラウンド・試合ごと）----
var ACH_R={dmg:0,minHp:100,fell:false},ACH_M={kills:[]};
function achRoundStart(){ACH_R={dmg:0,minHp:100,fell:false};}
function achMatchStart(){ACH_M={kills:[]};achRoundStart();}
function achMyChar(){return gameMode==='ai'?lp:olMe;}
// 自分の試合の出来事だけ数える（ホームの背景の CPU 同士の試合などは数えない）
function achTracks(me){return(gameMode==='ai'&&me==='a')||(gameMode==='online'&&!!me&&me===mySlot);}
function achEvent(e,me){
  if(e.t==='hit'&&e.who===me){ACH_R.dmg++;var c=achMyChar();if(c)ACH_R.minHp=Math.min(ACH_R.minHp,c.hp);}
  else if(e.t==='dead'&&e.who!==me&&(!TEAM2||(e.by===me&&SIM.teamOf(e.who)!==SIM.teamOf(me)))){   // 1対1は相手が倒れたら自分のとどめ。2v2 は自分が倒した敵だけ
    if(e.fell){ACH_R.fell=true;ACH_M.kills.push(0);return;}
    var c2=achMyChar(),W=c2&&c2.load?SIM.weaponOf(c2):null,wid=W?W.id:0;
    if(wid){ensureProfileShape();profile.ach.kills[wid]=(profile.ach.kills[wid]||0)+1;}
    ACH_M.kills.push(wid);
  }
}
function achRoundWon(){
  if(ACH_R.dmg===0)grantTitle('untouched');
  if(ACH_R.minHp<=10)grantTitle('close_call');
  if(ACH_R.fell&&gameMode==='ai'&&selectedStage==='glacier')grantTitle('pit_drop');
}
function achMatchDone(win){
  ensureProfileShape();var A=profile.ach;
  if(win){
    A.streak=(A.streak||0)+1;A.best=Math.max(A.best||0,A.streak);
    if(new Date().getHours()<4)grantTitle('short_sleeper');
    if(matchShots>=10&&matchHits/matchShots>=.8)grantTitle('precision');
    if(gameMode==='ai'){
      A.stages[selectedStage]=(A.stages[selectedStage]||0)+1;
      if(difficulty==='easy'&&beaten('hard'))grantTitle('first_steps');
      if(difficulty==='god'&&ACH_M.kills.length>=3&&ACH_M.kills.every(function(w){return w===2;}))grantTitle('one_pistol');
    }
  }else A.streak=0;
  saveProfile();checkTitles();
}

// ---- チートを使おうとした人へ：称号「唯破是律」 ----
// 本物のチート対策（サーバー側）とは別の、何もしない「わな」。コンソールで cheat.godMode() などを呼ぶ・
// ゲームの中身（SIM）をさわろうとする・画面で godmode などと打つと、この称号が付く（付け替えは自由）
function cheatTrap(){
  grantTitle('rule_breaker',true);
  try{console.log('%c'+t('title.trap'),'color:#FF4D5E;font-size:14px;font-weight:700');}catch(e){}
  return 'nice try';
}
(function(){
  var bait={};
  ['godMode','infiniteAmmo','oneHitKill','setHp','unlockAll','aimbot','wallhack','speedHack','noRecoil','win'].forEach(function(k){bait[k]=cheatTrap;});
  Object.freeze(bait);
  ['cheat','cheats','hack'].forEach(function(n){try{Object.defineProperty(window,n,{value:bait,writable:false,configurable:false});}catch(e){}});
  ['SIM','GunDuelSim'].forEach(function(n){if(n in window)return;try{Object.defineProperty(window,n,{get:function(){cheatTrap();return bait;},configurable:false});}catch(e){}});
})();
var trapBuf='';
document.addEventListener('keydown',function(e){
  var tg=e.target;
  if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.isContentEditable))return;
  if(!e.key||e.key.length!==1)return;
  trapBuf=(trapBuf+e.key.toLowerCase()).slice(-10);
  if(/(godmode|aimbot|wallhack|cheat)$/.test(trapBuf)){trapBuf='';cheatTrap();}
});
function newStats(){var s={};DIFF_ORDER.forEach(function(k){s[k]={w:0,l:0};});return s;}
function newTierProgress(){var s={};DIFF_ORDER.forEach(function(k){s[k]={beat:false,straight:false};});return s;}
var profile={};
try{var _pp=localStorage.getItem(storeKey('gunduel_profile'));if(_pp)profile=JSON.parse(_pp)||{};}catch(e){profile={};}
function ensureProfileShape(){
  if(!profile||typeof profile!=='object')profile={};
  if(typeof profile.name!=='string'||!profile.name.trim())profile.name=t('pf.defaultName');
  if(typeof profile.bio!=='string')profile.bio='';
  if(!TITLES.some(function(x){return x.id===profile.title;}))profile.title='rookie';
  if(!profile.ach||typeof profile.ach!=='object')profile.ach={};
  ['got','kills','stages'].forEach(function(k){if(!profile.ach[k]||typeof profile.ach[k]!=='object')profile.ach[k]={};});
  profile.ach.streak=+profile.ach.streak||0;profile.ach.best=+profile.ach.best||0;
  if(!profile.stats)profile.stats=newStats();
  if(!profile.tierProgress)profile.tierProgress=newTierProgress();
  DIFF_ORDER.forEach(function(k){
    if(!profile.stats[k])profile.stats[k]={w:0,l:0};
    if(!profile.tierProgress[k])profile.tierProgress[k]={beat:false,straight:false};
  });
  profile.look=SIM.cleanLook(profile.look||LOOK_DEFAULT);
  profile.rgames=Math.max(0,Math.floor(+profile.rgames||0));       // ランクマッチの試合数
  profile.rstreak=Math.max(0,Math.floor(+profile.rstreak||0));     // 格下に連敗した数
  profile.rwstreak=Math.max(0,Math.floor(+profile.rwstreak||0));   // 連勝数
  if(!profile.ranked||typeof profile.ranked!=='object')profile.ranked={w:0,l:0};
  profile.ranked.w=Math.max(0,Math.floor(+profile.ranked.w||0));profile.ranked.l=Math.max(0,Math.floor(+profile.ranked.l||0));
  syncRate();
  if(!profile.emperor||typeof profile.emperor!=='object')profile.emperor={};
  var E=profile.emperor;
  E.w=Math.max(0,Math.floor(+E.w||0));E.l=Math.max(0,Math.floor(+E.l||0));E.beat=E.beat===true;E.seen=E.seen===true;
  if(profile.bg===EMP_BG){if(!emperorSlain())profile.bg=null;}
  else if(profile.bg!=null&&!(profile.bg>=0&&profile.bg<=profile.bestTier))profile.bg=null;
}

function recordMatchResult(diff,win,straight){
  ensureProfileShape();

    if(win){profile.emperor.w++;profile.emperor.beat=true;grantTitle('emperor_slayer',false,true);}

  }else{
    profile.stats[diff].l++;

function applyRateResult(r){
  if(!r||typeof r.rate!=='number')return;
  ensureProfileShape();
  if(r.kind==='2v2'){
    var b2=typeof r.before==='number'?r.before:myRate2(),t2b=typeof r.tierBefore==='number'?r.tierBefore:myTier2Index();
    profile.rate2=Math.max(SIM.RATE_FLOOR,Math.round(r.rate));profile.rgames2=Math.max((+profile.rgames2||0)+1,+r.games||0);
    if(!profile.ranked2)profile.ranked2={w:0,l:0};
    if(r.win)profile.ranked2.w++;else profile.ranked2.l++;
    var t2a=typeof r.tier==='number'?r.tier:SIM.tierOfRate(profile.rate2);
    profile.bestTier=Math.max(+profile.bestTier||0,t2a);   // 背景は 1v1・2v2 どちらのティアでも解放
    saveProfile();
    rateFx={kind:'2v2',before:b2,after:profile.rate2,delta:profile.rate2-b2,tierBefore:t2b,tierAfter:t2a};
    renderHomeBar();return;
  }
  var before=typeof r.before==='number'?r.before:myRate(),tb=typeof r.tierBefore==='number'?r.tierBefore:computeTierIndex();
  profile.rate=Math.max(SIM.RATE_FLOOR,Math.round(r.rate));
  profile.tier=typeof r.tier==='number'?r.tier:SIM.tierOfRate(profile.rate,tb);
  profile.rgames=Math.max(profile.rgames+1,+r.games||0);
  profile.rstreak=Math.max(0,+r.streak||0);profile.rwstreak=Math.max(0,+r.wstreak||0);
  if(r.win)profile.ranked.w++;else profile.ranked.l++;
  profile.bestTier=Math.max(+profile.bestTier||0,profile.tier);
  saveProfile();
  rateFx={before:before,after:profile.rate,delta:profile.rate-before,tierBefore:tb,tierAfter:profile.tier};
  if(profile.tier>tb)reportTier(TIER_LADDER[profile.tier].key);
  renderHomeBar();
}

// ============================================================
// ティア（レートで決まるランク）
// ============================================================
// ティアはレートの数値で決まる（区切りは sim.js の TIER_MIN）。レートが動くのはランクマッチだけ。
// CPU戦の到達度は「ランクマッチを始めるまでのレートの下限」と、称号・背景の解放に使う。
// 下から：LT5<HT5<LT4<HT4<LT3<HT3<LT2<HT2<LT1<HT1
// color は画面の差し色（進み具合のバー・丸いアイコンの背景・Discord）。紋章の素材は TIER_STYLE
var TIER_LADDER=[
  {key:'',   color:'#4B5563'},
  {key:'LT5',color:'#8A919B'},   // 鉄
  {key:'HT5',color:'#C07A45'},   // 銅
  {key:'LT4',color:'#B8C2CE'},   // 銀
  {key:'HT4',color:'#E3E8EE'},   // 銀＋金
  {key:'LT3',color:'#D9A331'},   // 金
  {key:'HT3',color:'#F5C84C'},   // 金＋ルビー
  {key:'LT2',color:'#C81E3A'},   // 深紅＋銀
  {key:'HT2',color:'#E0314B'},   // 深紅＋金
  {key:'LT1',color:'#E8C66A'},   // 黒＋金
  {key:'HT1',color:'#FFF4D6'}    // 白金
];
// CPU戦の到達度（0〜10）。称号・背景の解放と、ランクマッチを始めるまでのレートの下限に使う
function cpuTierIndex(){
  var idx=0,tp=profile&&profile.tierProgress;
  if(!tp)return 0;
  DIFF_ORDER.forEach(function(d,i){var p=tp[d];if(p&&p.beat)idx=1+i*2+(p.straight?1:0);});
  return idx;
}
// レートとティアはログイン中だけ（未ログインはティアを持たない）。レートはサーバーが決め、ランクマッチでだけ動く
function isRanked(){return !!STORE_ACC;}
function myRate(){return isRanked()?(+profile.rate||SIM.RATE_START):0;}
// レートからティアを決め直す（ティアはレートの数値だけで決まる）。背景の解放に使う bestTier もここで上げる
function syncRate(){
  if(typeof profile.rate!=='number'||!isFinite(profile.rate))profile.rate=SIM.RATE_START;
  profile.rate=Math.max(SIM.RATE_FLOOR,Math.round(profile.rate));
  profile.tier=SIM.tierOfRate(profile.rate);
  if(isRanked())profile.bestTier=Math.max(+profile.bestTier||0,profile.tier);
}
function computeTierIndex(){return isRanked()?(+profile.tier||0):0;}
// そのティアのレートの範囲（文字）
function tierRangeText(i){
  var lo=SIM.TIER_MIN[i],hi=SIM.TIER_MIN[i+1];
  if(i<=0)return t('tier.rangeLow',{n:SIM.TIER_MIN[1]});
  return hi?t('tier.range',{lo:lo,hi:hi-1}):t('tier.rangeTop',{n:lo});
}

    if(descEl)descEl.innerHTML='<div class="rate-note">'+esc(t('tier.needLogin'))+'</div>';
    if(barEl){barEl.style.width='0%';}

  if(!isRanked()){renderTierLadder(-1);return;}
  var lo=idx<=0?SIM.RATE_FLOOR:SIM.TIER_MIN[idx],hi=SIM.TIER_MIN[idx+1];

    barEl.style.width=(hi?Math.max(2,Math.min(100,(rate-lo)/(hi-lo)*100)):100)+'%';

  }
  if(nextEl)nextEl.textContent=next?t('tier.nextRate',{tier:next.key,n:Math.max(1,SIM.TIER_MIN[idx+1]-rate)}):t('tier.max');

function refreshMe(){
  if(meRetry){clearTimeout(meRetry);meRetry=null;}

  var tok=AUTH.token;
  fetch(httpBase()+'/api/me',{headers:{Authorization:'Bearer '+tok}})

      if(e!==401)meRetry=setTimeout(refreshMe,30000);   // サーバーが起動中・回線が切れているときは30秒後にもう一度
    });

// ============================================================
// プロフィールをサーバーに保存（ログイン中だけ。別の端末でも同じプロフィールになる）
// ============================================================
// 手元で変えたら dirty にして、少し待ってから送る。サーバーの版(rev)の方が新しく、手元に未送信の変更がなければサーバーの内容を使う。
// 別の端末と同時に変えていたときは、サーバーが戦績を大きい方で混ぜて返す
var SYNC={acc:'',rev:0,dirty:false,seq:0,busy:false,timer:null,state:''};
try{var _sy=JSON.parse(localStorage.getItem('gunduel_sync')||'null');if(_sy&&typeof _sy==='object'){SYNC.acc=String(_sy.acc||'');SYNC.rev=+_sy.rev||0;SYNC.dirty=!!_sy.dirty;}}catch(e){}
function saveSyncMeta(){try{localStorage.setItem('gunduel_sync',JSON.stringify({acc:SYNC.acc,rev:SYNC.rev,dirty:SYNC.dirty}));}catch(e){}}
function profileDoc(){
  ensureProfileShape();
  return{name:profile.name,bio:profile.bio,title:profile.title,look:profile.look,loadout:loadout,bg:profile.bg,bestTier:profile.bestTier,stats:profile.stats,tierProgress:profile.tierProgress,ach:profile.ach,emperor:profile.emperor};
}
function profileChanged(){if(!STORE_ACC)return;SYNC.dirty=true;SYNC.seq++;saveSyncMeta();pushProfileSoon(1500);}
function pushProfileSoon(ms){
  if(SYNC.timer){clearTimeout(SYNC.timer);SYNC.timer=null;}
  if(!AUTH.user||!AUTH.token||!SYNC.dirty)return;
  SYNC.timer=setTimeout(pushProfile,ms||0);
}
function pushProfile(){
  SYNC.timer=null;
  if(!AUTH.user||!AUTH.token||!SYNC.dirty)return;
  if(SYNC.busy){pushProfileSoon(800);return;}
  SYNC.busy=true;
  var seq=SYNC.seq,tok=AUTH.token;
  setSyncState('saving');
  fetch(httpBase()+'/api/profile',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},
    body:JSON.stringify({base:SYNC.rev,profile:profileDoc()})})
    .then(function(r){if(!r.ok)throw r.status;return r.json();})
    .then(function(d){
      SYNC.busy=false;
      if(tok!==AUTH.token)return;
      SYNC.rev=+d.rev||SYNC.rev;
      if(seq===SYNC.seq){SYNC.dirty=false;if(d.merged&&d.profile)adoptProfile(d.profile);}
      saveSyncMeta();
      if(SYNC.dirty)pushProfileSoon(300);else setSyncState('saved');
    })
    .catch(function(e){
      SYNC.busy=false;
      if(tok!==AUTH.token)return;
      setSyncState('error');
      if(e===401){refreshMe();return;}
      pushProfileSoon(e===429?30000:10000);
    });
}
// サーバーの内容で手元を置きかえる（送り返さない）
function adoptProfile(p){
  if(!p||typeof p!=='object')return;
  ['name','bio','title','look','bg','bestTier','stats','tierProgress','ach','emperor'].forEach(function(k){if(p[k]!==undefined)profile[k]=p[k];});
  if(Array.isArray(p.loadout)){loadout=SIM.cleanLoadout(p.loadout,false);writeLoadoutLocal();}   // 武器セットもサーバーのものに
  ensureProfileShape();writeProfileLocal();refreshProfileViews();
  if(currentScreen==='profile-screen')renderProfileUI();
}
// ログインしたとき・ページを開いたとき：サーバーのプロフィールと手元を合わせる
function syncOnLogin(d){
  var acc=d&&d.user&&d.user.fid||'';if(!acc)return;
  var rev=+d.rev||0,fresh=!hasAccStore(acc);
  // まだサーバーにプロフィールがない新しいアカウントには、ゲストで遊んでいた分を引き継ぐ（引き継いだらゲスト用は空にする）
  var carry=(fresh&&!d.profile&&STORE_ACC==='')?{p:JSON.parse(JSON.stringify(profile)),l:loadout.slice()}:null;
  switchStore(acc);
  if(fresh||SYNC.acc!==acc){            // この端末で初めてのアカウント：サーバーにあればそれを使い、なければ手元の分を上げる
    SYNC.acc=acc;SYNC.rev=rev;
    if(d.profile){adoptProfile(d.profile);SYNC.dirty=false;}
    else{
      if(carry){profile=carry.p;loadout=carry.l;ensureProfileShape();writeProfileLocal();writeLoadoutLocal();resetGuestStore();refreshProfileViews();}
      SYNC.dirty=true;
    }
  }else if(!d.profile)SYNC.dirty=true;
  else if(!SYNC.dirty&&rev>SYNC.rev){adoptProfile(d.profile);SYNC.rev=rev;}
  adoptRate(d.user);
  saveSyncMeta();
  if(SYNC.dirty)pushProfileSoon(0);else setSyncState('saved');
}
// レートはサーバーが本物。ログイン中はサーバーの値に合わせる（手元の値は上書きされる）
function adoptRate(u){
  if(!u||typeof u.rate!=='number')return;
  ensureProfileShape();
  if(typeof u.rate2==='number'){profile.rate2=Math.max(SIM.RATE_FLOOR,Math.round(u.rate2));profile.rgames2=Math.max(0,+u.rgames2||0);if(u.ranked2)profile.ranked2={w:Math.max(0,+u.ranked2.w||0),l:Math.max(0,+u.ranked2.l||0)};}
  profile.rate=Math.max(SIM.RATE_FLOOR,Math.round(u.rate));
  profile.tier=typeof u.tier==='number'?u.tier:SIM.tierOfRate(profile.rate);
  profile.rgames=Math.max(0,+u.rgames||0);
  profile.rstreak=Math.max(0,+u.rstreak||0);profile.rwstreak=Math.max(0,+u.rwstreak||0);
  if(u.ranked)profile.ranked={w:Math.max(0,+u.ranked.w||0),l:Math.max(0,+u.ranked.l||0)};
  profile.bestTier=Math.max(+profile.bestTier||0,profile.tier);
  writeProfileLocal();renderHomeBar();
}
function setSyncState(st){SYNC.state=st;renderSyncState();}
function renderSyncState(){

  el.textContent=SYNC.state?t('sync.'+SYNC.state):'';
}

// ============================================================
// オンライン状態（ログイン中は、ページを開いている間サーバーとつないでおく）
// ============================================================
// 対戦用の接続とは別の1本。フレンドのオンライン表示や招待に使う。切れたら少しずつ間をあけてつなぎ直す
var PRES={ws:null,timer:null,wait:2000,status:'online',state:'off'};
function presenceStart(){
  if(PRES.ws||PRES.timer||!AUTH.token||!AUTH.user)return;
  if(AUTH.proto&&AUTH.proto!==SIM.PROTO)return;      // 版の違うサーバーにはつながない
  var url=getServerUrl();if(!url)return;
  var sock;
  try{sock=new NativeWebSocket(url);}catch(e){presenceRetry();return;}
  PRES.ws=sock;setPresState('connecting');
  sock.onopen=function(){sock.send(JSON.stringify({type:'hello',v:SIM.PROTO,token:AUTH.token,s:PRES.status}));};
  sock.onmessage=function(e){var m;try{m=JSON.parse(e.data);}catch(err){return;}if(PRES.ws===sock)handlePresenceMsg(m);};
  sock.onclose=function(){if(PRES.ws!==sock)return;PRES.ws=null;setPresState('off');presenceRetry();};
  sock.onerror=function(){};
}
function presenceRetry(){
  if(PRES.timer||!AUTH.user)return;
  PRES.timer=setTimeout(function(){PRES.timer=null;presenceStart();},PRES.wait);
  PRES.wait=Math.min(PRES.wait*2,60000);
}
function presenceStop(){
  if(PRES.timer){clearTimeout(PRES.timer);PRES.timer=null;}
  var sock=PRES.ws;PRES.ws=null;PRES.wait=2000;
  if(sock){try{sock.close();}catch(e){}}
  setPresState('off');
  if(!AUTH.user)resetFriends();   // ログアウトしたらフレンドの表示と招待を片付ける
}
// いまCPU対戦中か（フレンドの一覧に出る。オンライン対戦中はサーバーが自分で分かる）
function presenceStatus(st){
  if(PRES.status===st)return;
  PRES.status=st;
  if(PRES.ws&&PRES.ws.readyState===1)PRES.ws.send(JSON.stringify({type:'status',s:st}));
}
function handlePresenceMsg(m){
  if(m.type==='hello_ok'){PRES.wait=2000;setPresState('on');if(m.user&&AUTH.user){AUTH.user=m.user;renderLoginUI();}loadFriends();try{PRES.ws.send(JSON.stringify({type:'party_get'}));}catch(e){}}
  else if(m.type==='friend_status')onFriendStatus(m);
  else if(m.type==='friend_event')onFriendEvent(m);
  else if(m.type==='invite')onInvite(m);
  else if(m.type==='invite_cancel')onInviteCancel(String(m.id||''));
  else if(m.type==='invite_sent'||m.type==='invite_fail'||m.type==='invite_accepted'||m.type==='invite_declined')onInviteReply(m);
  else if(/^party/.test(m.type))onPartyMsg(m);
  else if(m.type==='hello_fail'){
    var sock=PRES.ws;PRES.ws=null;if(sock){try{sock.close();}catch(e){}}
    setPresState('off');
    if(m.code==='auth'){AUTH.token='';AUTH.user=null;try{localStorage.removeItem('gunduel_token');}catch(e){}renderLoginUI();}   // ログインの期限切れ
    // reload（ページが古い）は、つなぎ直さない
  }
}

var FR={friends:[],incoming:[],outgoing:[],loading:false,msg:'',msgKind:''};
var frOpen=null;       // プロフィールを開いているフレンドのID
function friendsApi(method,body){

function findFriend(fid,any){

function safeFid(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);}
function agoText(ms){
  var m=Math.max(0,Math.floor((Date.now()-ms)/60000));
  if(m<1)return t('ago.now');if(m<60)return t('ago.min',{n:m});

// 招待できるのは、オンラインかCPU対戦中（CPU戦中なら試合のあとに届く）のフレンド
function canInvite(p){return !!p&&(p.status==='online'||p.status==='cpu')&&PRES.state==='on';}
var ST_ORDER={online:0,cpu:1,match:2,offline:3};
function stRank(p){return p.status in ST_ORDER?ST_ORDER[p.status]:3;}
function frSort(a,b){
  var d=stRank(a)-stRank(b);if(d)return d;

// 丸いアイコン：ティアの色の輪の中に顔
function drawMiniAvatar(cv,p){
  var g=cv.getContext('2d'),W=cv.width,H=cv.height,tier=+p.tier||0,col=(TIER_LADDER[tier]||TIER_LADDER[0]).color,r=W/2-4;
  g.clearRect(0,0,W,H);
  g.save();g.beginPath();g.arc(W/2,H/2,r,0,Math.PI*2);g.clip();
  var bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,hexA(col,.55));bg.addColorStop(1,'#0B0E1A');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  var sc=W/40;
  drawAvatar(g,{x:W/2-sc,y:H*.46+74*sc,s:sc,dir:1,look:SIM.cleanLook(p.look||LOOK_DEFAULT),team:TEAM.me});
  g.restore();
  var TM=METAL[tierStyle(tier).trim],rg=g.createLinearGradient(0,0,W,H);

  g.lineWidth=W*.06;g.strokeStyle=tier>0?rg:col;g.beginPath();g.arc(W/2,H/2,r,0,Math.PI*2);g.stroke();

function loadRanking(){
  if(RANK.busy)return;
  RANK.busy=true;
  var h={};if(AUTH.token)h.Authorization='Bearer '+AUTH.token;
  // 返事が JSON でなければ「サーバーが古い」、そもそも届かなければ「つながらない」
  var kind=RANK.kind==='2v2'?'2v2':'1v1';
  fetch(httpBase()+'/api/ranking'+(kind==='2v2'?'?kind=2v2':''),{headers:h}).then(function(r){return r.text();}).then(function(tx){
    if((RANK.kind==='2v2'?'2v2':'1v1')!==kind)return;   // 待っている間にタブを変えた
    RANK.busy=false;
    var d=null;try{d=JSON.parse(tx);}catch(e){}
    if(d&&Array.isArray(d.top)){RANK.err='';RANK.data=d;RANK.at=Date.now();renderRanking();return;}
    RANK.err='old';renderRanking(true);
  }).catch(function(){RANK.busy=false;RANK.err='net';renderRanking(true);});
}
function rankRowHtml(p,me){
  var cls='rk-row'+(p.rank<=3?' rk-'+p.rank:'')+(me?' rk-me':'');
  var games=(+p.w||0)+(+p.l||0),wr=games?Math.round(p.w/games*100):0;
  var tier=+p.tier||0,col=(TIER_LADDER[tier]||TIER_LADDER[0]).color;
  return '<div class="'+cls+'"><span class="rk-no">'+p.rank+'</span>'+
    '<span class="rk-who">'+(p.rank<=3?'<canvas class="rk-mk" data-mk="'+tier+'" width="68" height="68"></canvas>':'')+
    '<span class="rk-col"><b>'+esc(p.name)+devBadge(p.dev)+'</b><small'+(titleCls(p.title)?' class="'+titleCls(p.title)+'"':'')+'>'+esc(titleText(p.title))+'</small></span></span>'+
    '<span class="rk-tier" style="color:'+col+'">'+esc(tierName(tier))+'</span>'+
    '<span class="rk-rate">'+(+p.rate||0)+'</span>'+
    '<span class="rk-wr">'+(games?wr+'%':'-')+'</span></div>';
}
function renderRanking(failed){
  var list=document.getElementById('rank-list'),meEl=document.getElementById('rank-me'),note=document.getElementById('rank-note');
  if(!list)return;
  var d=RANK.data;
  if(!d){
    var msg=!failed?t('rank.loading'):RANK.err==='net'?t('rank.errNet',{url:httpBase()}):RANK.err==='old'?t('rank.errOld'):t('rank.failed');
    list.innerHTML='<div class="rk-empty">'+esc(msg)+'</div>';meEl.innerHTML='';note.textContent='';return;
  }
  // 自分が一覧の中にいるときは、その行を強調するだけで、下にもう1行は出さない（同じ人が2回並ばないように）
  var meRank=d.me?d.me.rank:0,inList=meRank>0&&d.top.some(function(p){return p.rank===meRank;});
  list.innerHTML=d.top.length?d.top.map(function(p){return rankRowHtml(p,inList&&p.rank===meRank);}).join(''):'<div class="rk-empty">'+esc(t('rank.empty'))+'</div>';
  list.querySelectorAll('canvas[data-mk]').forEach(function(cv){var g=cv.getContext('2d');drawTierIcon(g,+cv.getAttribute('data-mk'),34,34,66,66,0);});
  meEl.innerHTML=inList?'':d.me?rankRowHtml(d.me,true):(AUTH.user?'<div class="rk-empty">'+esc(t('rank.meNone'))+'</div>':'<div class="rk-empty">'+esc(t('rank.needLogin'))+'</div>');
  note.textContent=t('rank.note',{n:d.total,min:Math.max(1,Math.round((d.ttl||300000)/60000))});
}

// 招待する側：部屋を作ってから、その部屋番号をサーバー経由でフレンドに届ける
var INVITING=null;     // {fid, name}
function inviteFriend(fid){
  var p=findFriend(safeFid(fid));if(!p)return;
  if(!PRES.ws||PRES.ws.readyState!==1){note(t('fr.notConnected'));return;}
  closeFriend();
  showRoomScreen({fmt:'1v1',mode:'friend'});   // ここで INVITING が空になるので、そのあとで入れる
  INVITING={fid:p.fid,name:p.name};
  createRoom();
  setRoomStatus('inv.creating',true,{name:p.name});
}
function sendInviteNow(roomId){
  if(!INVITING)return;
  if(PRES.ws&&PRES.ws.readyState===1){
    PRES.ws.send(JSON.stringify({type:'invite',fid:INVITING.fid,roomId:roomId}));
    setRoomStatus('inv.sending',true,{name:INVITING.name});
  }else setRoomStatus('fr.notConnected',false);
}
function onInviteReply(m){
  if(!INVITING||currentScreen!=='room-screen'||(m.fid&&m.fid!==INVITING.fid))return;
  var v={name:INVITING.name};
  if(m.type==='invite_sent')setRoomStatus(m.status==='cpu'?'inv.sentCpu':'inv.sent',true,v);
  else if(m.type==='invite_fail')setRoomStatus('inv.fail.'+(m.code||'no_room'),false,v);
  else if(m.type==='invite_accepted')setRoomStatus('inv.accepted',true,v);
  else if(m.type==='invite_declined')setRoomStatus(m.timeout?'inv.noAnswer':'inv.declined',false,v);
}
// 招待された側：上から通知が出て、10秒で自動的に閉じる。CPU戦・オンライン対戦の途中は、終わってから出す
var INV={queue:[],cur:null,timer:null};
function onInvite(m){
  if(!m||!m.from||!/^\d{6}$/.test(String(m.roomId)))return;
  m.id=String(m.id||'');
  INV.queue=INV.queue.filter(function(x){return x.from.fid!==m.from.fid;});   // 同じ人の前の招待は新しい方に置きかえる
  if(INV.cur&&INV.cur.from.fid===m.from.fid){INV.cur=null;hideInviteToast();}
  INV.queue.push(m);
  showNextInvite();
}
function onInviteCancel(id){
  INV.queue=INV.queue.filter(function(x){return x.id!==id;});
  if(INV.cur&&INV.cur.id===id){
    var name=INV.cur.from.name;INV.cur=null;hideInviteToast();
    note(t('inv.canceled',{name:name}));setTimeout(showNextInvite,500);
  }
}
function busyForInvite(){return currentScreen==='game-screen'&&!matchOver&&gameMode!=='range';}   // 射撃場では招待をそのまま出す
function showNextInvite(){
  if(typeof INV==='undefined'||INV.cur||!INV.queue.length||busyForInvite())return;
  INV.cur=INV.queue.shift();
  var el=document.getElementById('inv-toast');if(!el)return;
  document.getElementById('inv-name').textContent=INV.cur.from.name||'';
  var pk=INV.cur.kind==='party';   // パーティーの誘いか、対戦の招待か
  document.getElementById('inv-kick').textContent=t(pk?'pt.inviteTitle':'inv.title');
  document.getElementById('inv-msg').textContent=t(pk?'pt.inviteMsg':'inv.msg');
  document.getElementById('inv-ok').textContent=t(pk?'pt.accept':'inv.join');
  drawMiniAvatar(document.getElementById('inv-av'),INV.cur.from);
  el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
  playTone(880,.12,'triangle',.14);playTone(1320,.2,'triangle',.12,.11);
  clearTimeout(INV.timer);INV.timer=setTimeout(function(){answerInvite(false,true);},10000);
}
function hideInviteToast(){clearTimeout(INV.timer);INV.timer=null;var el=document.getElementById('inv-toast');if(el)el.classList.remove('show');}
function answerInvite(ok,timeout){
  var iv=INV.cur;if(!iv)return;
  INV.cur=null;hideInviteToast();
  if(iv.kind==='party'){   // パーティーの誘い：返事を送るだけ（組めたら 'party' が届く）
    if(PRES.ws&&PRES.ws.readyState===1)PRES.ws.send(JSON.stringify({type:'party_reply',id:iv.id,ok:!!ok,timeout:!!timeout}));
    if(ok&&currentScreen!=='game-screen')showRoomScreen({fmt:'2v2',mode:null});
    setTimeout(showNextInvite,450);return;
  }
  if(PRES.ws&&PRES.ws.readyState===1)PRES.ws.send(JSON.stringify({type:'invite_reply',id:iv.id,ok:!!ok,timeout:!!timeout}));
  if(!ok){setTimeout(showNextInvite,450);return;}
  INV.queue=[];                          // ほかの招待は断ったことにしない（そのまま消えるだけ）
  if(currentScreen==='game-screen')backToMenu();
  closeFriend();showRoomScreen({fmt:'1v1',mode:'friend'});
  document.getElementById('join-input').value=iv.roomId;
  joinRoom(iv.roomId);
}

  }
  else if(m.type==='party_invite'){if(m.from){m.kind='party';m.id=String(m.id||'');INV.queue=INV.queue.filter(function(x){return!(x.kind==='party'&&x.from.fid===m.from.fid);});INV.queue.push(m);showNextInvite();}}
  else if(m.type==='party_sent'){var pf=findFriend(m.fid);note(t('pt.sent',{name:pf?pf.name:''}));}
  else if(m.type==='party_declined')note(t(m.timeout?'pt.noAnswer':'pt.declined',{name:m.name||''}));

var WAIT=null,matchLoadout=null,pickSel=0,waitTick=null;
function onWaitMsg(msg){
  var now=performance.now();
  if(msg.team){
    var rd=msg.ready||{};

      meReady:!!rd[mySlot],oppReady:false,mine:SIM.cleanLoadout(msg.mine,false),opp:null,loads:msg.loads||{}};
    matchLoadout=WAIT.mine.slice();
    SIM.TEAM_SLOTS.forEach(function(s){if(s!==mySlot&&TM.players[s]&&WAIT.loads[s])TM.players[s].loadout=SIM.cleanLoadout(WAIT.loads[s],true);});
    renderMatchPanel();
    if(!waitTick)waitTick=setInterval(tickMatchPanel,250);
    return;
  }
  WAIT={kind:msg.kind==='pick'?'pick':'prep',until:now+(+msg.ms||0),vsUntil:now+(+msg.vsMs||0),
    meReady:!!(msg.ready&&msg.ready.me),oppReady:!!(msg.ready&&msg.ready.opp),
    mine:SIM.cleanLoadout(msg.mine,false),opp:msg.opp?SIM.cleanLoadout(msg.opp,true):null};

// ============================================================
// 演出（弾の光・爆発・破片など。対戦の結果には関係しない）
// ホームの背景デモも同じ描画を使うので、演出の入れ物をまとめて差し替えられるようにしておく
// ============================================================
function newFx(){return{melee:[],heal:[],boom:[],beam:[],muzzle:[],spark:[],shards:[]};}
var FX=newFx(),GRADS={};
function clearFx(){FX=newFx();}
function addSparks(x,y,col,n){
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=1+Math.random()*3.2;FX.spark.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:10+Math.random()*12,col:col});}
}
// 倒されたキャラを粉々に砕く：体を小さな三角形に切り分けて、撃たれた向きへ飛び散らせる。色はそのキャラの見た目から取る
function shatter(x,y,dir,ducking,style){
  var c=lookColors(style&&style.look,style&&style.team),h=ducking?28:CHAR_H,top=ducking?y+(CHAR_H-28):y,cell=4;
  for(var r=0;r<h;r+=cell){
    for(var q=0;q<CHAR_W;q+=cell){
      var fr=r/h,col=fr<.12?c.hair:fr<.34?(q>4&&q<16?c.skin:c.hair):fr<.68?c.jacket:c.pants;
      if(fr<.34&&(q<2||q>17))continue;
      for(var k=0;k<2;k++){
        var sp=2+Math.random()*4.5,cx=x+q+cell/2,cy=top+r+cell/2;
        FX.shards.push({x:cx,y:cy,vx:(dir||(Math.random()<.5?-1:1))*sp*(.4+Math.random())+(q-CHAR_W/2)*.08+(Math.random()-.5)*1.5,
          vy:-(1.5+Math.random()*5)+(fr-.5)*2,rot:Math.random()*6.28,vr:(Math.random()-.5)*.6,
          s:2.2+Math.random()*3.4,life:80+Math.random()*50,col:col,tri:k});
      }
    }
  }
  for(var n=0;n<14;n++){var a=Math.random()*Math.PI*2,v=2+Math.random()*5;FX.spark.push({x:x+CHAR_W/2,y:top+h/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,life:16+Math.random()*14,col:'#FFFFFF'});}
  SFX.shatter();
}
function updateFx(){
  var live=function(m){return m.life-->0;};
  FX.melee=FX.melee.filter(live);FX.heal=FX.heal.filter(live);FX.boom=FX.boom.filter(live);FX.beam=FX.beam.filter(live);FX.muzzle=FX.muzzle.filter(live);
  FX.spark=FX.spark.filter(function(s){s.x+=s.vx;s.y+=s.vy;s.vy+=.18;s.vx*=.96;return s.life-->0;});
  FX.shards=FX.shards.filter(function(s){
    var py=s.y;s.vy+=.32;s.x+=s.vx;s.y+=s.vy;s.rot+=s.vr;
    if(s.vy>0){
      for(var i=0;i<platforms.length;i++){var p=platforms[i];
        if(s.x>=p.x&&s.x<=p.x+p.w&&py<=p.y&&s.y>=p.y){s.y=p.y-.5;s.vy*=-.32;s.vx*=.62;s.vr*=.6;break;}}
    }
    return s.life-->0&&s.y<VH+40;
  });
}
// sim.js が返した出来事を、音と演出にする。me = 自分の側（'a' など）、styleOf(side) = そのキャラの見た目
function handleEvents(ev,me,styleOf){
  var trk=achTracks(me);
  for(var i=0;i<ev.length;i++){
    var e=ev[i],mine=e.who===me;
    if(trk)achEvent(e,me);
    switch(e.t){
      case'pull':if(mine)matchShots++;break;
      case'fire':
        sfxFire(e.wid);
        FX.muzzle.push({x:e.x,y:e.y,dir:e.dir,life:5,col:WEAPONS[e.wid].color,big:e.wid===5||e.wid===11||e.wid===3});
        if(e.beam)FX.beam.push({x1:e.x,x2:e.x2,y:e.y,life:16,col:WEAPONS[e.wid].color});
        break;
      case'melee':
        if(e.wid===12)SFX.jab();else if(e.wid===13)SFX.thrust();else if(e.wid===14)SFX.heavySwing();else SFX.meleeSwing();
        FX.melee.push({x:e.x,y:e.y,dir:e.dir,wid:e.wid||1,reach:e.reach||46,life:e.wid===12?7:e.wid===14?14:10,color:mine?'#C4B5FD':'#FCA5A5'});
        if(e.wid===14&&e.hit)FX.boom.push({x:e.x+e.dir*26,y:e.y,r:26,life:16});   // ハンマーが当たった衝撃
        break;
      case'windup':SFX.windup();break;
      case'charge':SFX.charge();break;
      case'hit':
        SFX.hit();addSparks(e.x,e.y,e.who===me?'#FF8A96':'#FFD27A',7);
        if(e.by===me&&e.sid&&!hitSids[e.sid]){hitSids[e.sid]=1;matchHits++;}
        break;
      case'vhit':addSparks(e.x,e.y,'#FFD27A',4);break;
      case'dead':shatter(e.x,e.y,e.dir,e.duck,styleOf?styleOf(e.who):null);break;
      case'heal':SFX.heal();FX.heal.push({x:e.x,y:e.y,life:30});break;
      case'jump':if(mine)SFX.jump();break;
      case'boom':SFX.explode();FX.boom.push({x:e.x,y:e.y,r:e.r||60,life:26});addSparks(e.x,e.y,'#FFB36B',12);break;
      case'spark':addSparks(e.x,e.y,'#FFE9A8',4);break;
      case'reload':if(mine&&e.mag>1)SFX.reload();break;
      case'dry':if(mine){dryFlash=24;SFX.dry();}break;   // 弾切れで撃とうとした
    }
  }
}

// 描画に使う共通の変数（キャンバス・カメラ・足場・演出・景色）を、デモのものに一時的に差し替える
function withView(v,fn){
  var s={ctx:ctx,camX:camX,platforms:platforms,solids:solids,frame:frame,FX:FX,GRADS:GRADS,silent:sfxSilent,theme:stageTheme};
  ctx=v.g;camX=v.cam;platforms=v.w.plats;solids=v.w.solids;frame=v.frame;FX=v.fx;GRADS=v.grads;sfxSilent=true;stageTheme=v.theme;
  try{fn();}
  finally{v.cam=camX;v.frame=frame;v.fx=FX;v.grads=GRADS;ctx=s.ctx;camX=s.camX;platforms=s.platforms;solids=s.solids;frame=s.frame;FX=s.FX;GRADS=s.GRADS;sfxSilent=s.silent;stageTheme=s.theme;}
}
function demoFrame(D,ts){
  if(document.hidden||!D.w){D.last=0;return;}
  if(!D.last)D.last=ts;
  D.acc+=Math.min(100,ts-D.last);D.last=ts;
  var style=function(side){return side==='a'?{look:D.la,team:TEAM.me}:{look:D.lb,team:TEAM.foe};};
  withView(D,function(){
    while(D.acc>=FRAME_MS){
      D.acc-=FRAME_MS;frame++;
      var W=D.w;
      if(!D.end){
        SIM.setInput(W.chars.a,SIM.think(D.ba,W,'a'));SIM.setInput(W.chars.b,SIM.think(D.bb,W,'b'));
        var ev=[];SIM.step(W,ev);handleEvents(ev,'-',style);
        if(W.chars.a.dead||W.chars.b.dead)D.end=150;
      }else if(--D.end<=0){
        demoNewRound(D);platforms=D.w.plats;solids=D.w.solids;FX=D.fx;camX=D.cam;stageTheme=D.theme;
      }
      updateFx();
      var A=D.w.chars.a,B=D.w.chars.b,mid=(A.x+B.x)/2;
      camX+=(mid-VW/2-camX)*.05;camX=Math.max(0,Math.min(WORLD_W-VW,camX));
    }
    var cv=D.cv,cw,chh,sc;
    if(D.mode==='cover'){   // 背景：解像度を落として軽く（少しぼやけるのも背景としてちょうどいい）
      cw=Math.max(320,Math.round(innerWidth*.55));chh=Math.max(180,Math.round(innerHeight*.55));
    }else{                  // プレビュー：枠の大きさ×画面の精細さでくっきり
      var r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
      cw=Math.max(180,Math.round(r.width*dpr));chh=Math.round(cw/2);
    }
    if(cv.width!==cw||cv.height!==chh){cv.width=cw;cv.height=chh;GRADS={};}
    sc=D.mode==='cover'?Math.max(cw/VW,chh/VH):cw/VW;
    ctx.setTransform(sc,0,0,sc,(cw-VW*sc)/2,(chh-VH*sc)/2);
    ctx.clearRect(0,0,VW,VH);
    drawBackground();
    drawChar(D.w.chars.a,false,{look:D.la,team:TEAM.me,hud:false});
    drawChar(D.w.chars.b,false,{look:D.lb,team:TEAM.foe,hud:false});
    drawEffects(D.w.shots);
    drawWeather(stageTheme);
    ctx.fillStyle=GRADS.vignette;ctx.fillRect(0,0,VW,VH);
  });
}

// サーバーの位置から、今この瞬間の位置を先読みして寄せる（相手・味方どれも同じ）
function followServer(c,sc,age){
  var px=sc.x+(sc.vx||0)*age,py=sc.y;
  if(!sc.onGround)py=Math.min(GND-CHAR_H,sc.y+(sc.vy||0)*age+.5*GRAVITY*age*age);
  px=Math.max(0,Math.min(WORLD_W-CHAR_W,px));
  var ox=c.x,oy=c.y;
  copyServerChar(c,sc);
  if(Math.abs(px-ox)>120||Math.abs(py-oy)>120){c.x=px;c.y=py;}
  else{c.x=ox+(px-ox)*.6;c.y=oy+(py-oy)*.6;}
}

// サーバーの状態でHP/死亡を上書き（チート防止の核心）
function syncMeFromServer(sc){
  if(!olMe||!sc)return;
  if(Math.abs(olMe.hp-sc.hp)>0.01){
    if(sc.hp<olMe.hp)SFX.hit();
    olMe.hp=sc.hp;olMe.hpFrac=sc.hp;olMe.hit=Math.max(olMe.hit,sc.hit||0);
  }
  if(sc.dead&&!olMe.dead)olMe.dead=true;
  // 位置は大きくズレたときだけ補正（それ以外は先読みを優先）
  var dx=Math.abs(olMe.x-sc.x),dy=Math.abs(olMe.y-sc.y);
  if(dx>80||dy>80){olMe.x+=(sc.x-olMe.x)*.3;olMe.y+=(sc.y-olMe.y)*.3;}
  // 弾数とリロードは、しばらく撃っていないときだけサーバーに合わせる（撃っている最中は先読みを優先）
  if(!keys.attack&&olW&&olW.frame-olLastShot>30&&olMe.burst<=0&&olMe.chg<=0&&sc.am){
    olMe.ammo=sc.am.slice();olMe.rl=sc.rl||0;olMe.rlMax=sc.rlMax||1;
  }
  if(sc.heal&&!olMe.healUsed){olMe.healUsed=true;updateHealBtn();}
}

  // （届くまでの時間ぶん遅れて見えるのを打ち消す。先読みは最大6フレーム≒0.1秒まで）

  // 大きくずれたとき（ラウンド開始など）は即座に合わせ、普段は1〜2フレームで追いつかせる
  if(Math.abs(px-ox)>120||Math.abs(py-oy)>120){olOpp.x=px;olOpp.y=py;}

// サーバーが送ってきた出来事のうち、相手の分を音と演出にする（自分の分は先読みで出している）
// サーバーが「当たった」と言った自分の弾を、先読みの世界から1つ消す。
// 先読みでは弾を通り抜けさせているので、当たった場所の少し先にある同じ高さの弾を探す
function dropConfirmedShot(e){
  if(!olW||!olW.shots.length)return;
  var best=-1,bestD=1e9;
  for(var i=0;i<olW.shots.length;i++){
    var b=olW.shots[i];
    if(b.own!==mySlot||b.k==='g'||Math.abs(b.y-e.y)>26)continue;
    var ahead=(b.x-e.x)*(b.vx>=0?1:-1);                   // 当たった場所からどれだけ先へ進んでいるか
    if(ahead<-40||ahead>320)continue;
    var d=Math.abs(ahead)+Math.abs(b.y-e.y);
    if(d<bestD){bestD=d;best=i;}
  }
  if(best>=0)olW.shots.splice(best,1);
}
function handleServerFx(fx){
  if(!fx||!fx.length)return;
  var list=[];
  fx.forEach(function(e){
    if(e.t==='dead'){list.push(e);return;}                 // 倒れたかどうかはサーバーが決める
    if(e.t==='hit'){                                        // 火花だけ出す（音はHPの変化で鳴らしている）
      addSparks(e.x,e.y,e.who===mySlot?'#FF8A96':'#FFD27A',7);
      if(e.by===mySlot){
        if(e.sid&&!hitSids[e.sid]){hitSids[e.sid]=1;matchHits++;}
        dropConfirmedShot(e);                               // 当たった弾を消す（先読みでは通り抜けさせている）
      }
      return;
    }
    if(e.who===mySlot||(e.t==='spark'&&e.own===mySlot))return;   // 自分の発射などは先読みで出している
    list.push(e);
  });
  handleEvents(list,mySlot,onlineStyle);
}

    });

    },300);

  }

    if(msg.opp)oppInfo={dev:!!msg.opp.dev,name:String(msg.opp.name||'').slice(0,12),discord:msg.opp.verified?String(msg.opp.discord||'').slice(0,32):'',tier:String(msg.opp.tier||'').slice(0,5),loadout:SIM.cleanLoadout(msg.opp.loadout,true),look:SIM.cleanLook(msg.opp.look),
      title:String(msg.opp.title||'rookie'),bio:String(msg.opp.bio||'').slice(0,40),bg:msg.opp.bg===EMP_BG?EMP_BG:msg.opp.bg>=0&&msg.opp.bg<=10?Math.floor(msg.opp.bg):null,
      rec:msg.opp.rec&&msg.opp.rec.w>=0&&msg.opp.rec.l>=0?{w:Math.floor(msg.opp.rec.w),l:Math.floor(msg.opp.rec.l),kind:msg.opp.rec.kind==='online'?'online':'cpu'}:null};
    startPingLoop();achMatchStart();
    later(function(){

    },300);
  }
  else if(mt==='round_start'){
    if(msg.state&&msg.state.wins&&(msg.state.wins.a||msg.state.wins.b))achRoundStart();else achMatchStart();   // 0-0 なら新しい試合（再戦も）
    lobbyPhase=false;olRoundOver=false;matchOver=false;rematchMine=false;rematchOpp=false;killCam=null;endWaitUI();

function doJump(){

  if(lobbyPhase&&gameMode==='ai'){endLobby();return;}
  if(lobbyPhase)return;

}

  if(lobbyPhase)return;

  if(gameMode==='online')sendInputEv({shoot:true});
}

function doReload(){
  if(lobbyPhase)return;
  pend.reload=true;
  if(gameMode==='online')sendInputEv({reload:true});
}
function doDuck(on){keys.duck=on;if(gameMode==='online')sendInput();}
function doHeal(){

// キーボードとマウスで共通の入力処理
function handleBindDown(k,repeat){
  if(!k)return;
  var changed=false;
  if(k===keybinds.left&&!keys.left){keys.left=true;changed=true;}
  if(k===keybinds.right&&!keys.right){keys.right=true;changed=true;}
  if(k===keybinds.duck&&!keys.duck){keys.duck=true;changed=true;}
  if(changed&&gameMode==='online')sendInput();   // 次の定期送信を待たずに、押した瞬間に伝える
  if(repeat)return;                              // 押しっぱなしの連続入力は、移動以外では使わない（撃ち続けは押しっぱなしで判定）
  if(k===keybinds.jump)doJump();
  if(k===keybinds.attack)doAttack();
  if(k===keybinds.reload)doReload();
  if(k===keybinds.w1)setWeapon(1);
  if(k===keybinds.w2)setWeapon(2);
  if(k===keybinds.w3)setWeapon(3);
  if(k===keybinds.heal)doHeal();
}
function handleBindUp(k){
  if(!k)return;
  if(k===keybinds.left)keys.left=false;
  if(k===keybinds.right)keys.right=false;
  if(k===keybinds.duck)keys.duck=false;
  if(k===keybinds.attack)keys.attack=false;
  if(gameMode==='online')sendInput();
}
function onGameScreen(){return document.getElementById('game-screen').style.display!=='none';}
document.addEventListener('keydown',function(e){
  if(listeningFor)return;
  var k=e.key.toLowerCase();
  if(e.key==='Escape'&&onGameScreen()){backToMenu();e.preventDefault();return;}   // 対戦中でもESCでメニューへ
  if(matchOver&&k==='r'&&onGameScreen()){doRematch();e.preventDefault();return;}
  if((bossIntro||unlockFx||slayFx)&&(e.key==='Enter'||k===' ')&&onGameScreen()){skipOverlayFx();e.preventDefault();return;}
  if(lobbyPhase&&gameMode==='ai'&&(e.key==='Enter'||k===' ')&&onGameScreen()){endLobby();e.preventDefault();return;}
  if(WAIT&&gameMode==='online'&&e.key==='Enter'&&onGameScreen()){matchReady();e.preventDefault();return;}
  if(currentScreen==='stage-screen'){   // ステージ選択：左右キーで切り替え、Enterで決定
    if(e.key==='ArrowLeft'){stageStep(-1);e.preventDefault();}
    else if(e.key==='ArrowRight'){stageStep(1);e.preventDefault();}
    else if(e.key==='Enter'&&!e.repeat){confirmStage();e.preventDefault();}
    return;
  }
  if(!onGameScreen())return;
  if(gameMode==='range'&&(k==='q'||k==='e')&&!e.repeat&&!keyIsBound(k)){rangeCycle(k==='e'?1:-1);e.preventDefault();return;}
  if(k===keybinds.attack||k===keybinds.jump)e.preventDefault();
  handleBindDown(k,e.repeat);
});
document.addEventListener('keyup',function(e){if(listeningFor)return;handleBindUp(e.key.toLowerCase());});
window.addEventListener('blur',function(){keys={};if(gameMode==='online')sendInput();});

    if(!RANGE)return;

  }
  if(gameMode==='ai'){if(!lp||!lai)return;px=lp.x;ox=lai.x;}
  else if(TEAM2){   // 2v2：自分（倒れたら味方）を中心に、いちばん近い敵の方へ少し寄せる
    if(!olMe)return;var fo=olMe.dead&&allyChar()&&!allyChar().dead?allyChar():olMe,en=nearestFoe(fo);
    px=fo.x;ox=en?en.x:fo.x;

  }
  else{if(!olMe||!olOpp)return;px=olMe.x;ox=olOpp.x;}

}

    avLimb(g,[d*3,hipY,d*10,-20,d*7,-12],7,T.pants);avBoot(g,d*7,-5,d,T.boots);

    var bf=-d*4-sw*d,ff=d*4+sw*d;
    avLimb(g,[-d*3,hipY,(bf-d*3)/2+d*1.5,-19,bf,-6],7,T.pants);avBoot(g,bf,0,d,T.boots);
    avLimb(g,[d*3,hipY,(ff+d*3)/2+d*1.5,-19,ff,-6],7,T.pants);avBoot(g,ff,0,d,T.boots);
  }
  // 胴（ジャケット）
  var tw=12.5,bw=10.5;
  g.beginPath();
  g.moveTo(-tw,topY+4);g.quadraticCurveTo(-tw,topY,-tw+4,topY);g.lineTo(tw-4,topY);g.quadraticCurveTo(tw,topY,tw,topY+4);
  g.lineTo(bw,hipY);g.lineTo(-bw,hipY);g.closePath();
  g.fillStyle=T.jacket;g.fill();
  g.save();g.clip();
  g.fillStyle=T.shade;g.fillRect(d>0?-tw-1:2,topY-1,tw-1,hipY-topY+2);
  g.fillStyle=hexA(T.light,.45);g.fillRect(d>0?tw-4:-tw,topY,4,hipY-topY);
  g.restore();
  g.lineWidth=1.6;g.strokeStyle=OUTLINE;g.stroke();
  g.fillStyle='#1C1917';g.fillRect(-bw-.5,hipY-3.5,bw*2+1,4.5);
  g.fillStyle='#E0B84A';g.fillRect(d*3-2.5,hipY-3.5,5,4.5);
  g.strokeStyle=hexA(T.trim,.5);g.lineWidth=1.1;g.beginPath();g.moveTo(d*1.5,topY+7);g.lineTo(d*1.5,hipY-4);g.stroke();
  g.fillStyle=T.trim;g.beginPath();g.moveTo(-6,topY);g.lineTo(d*1,topY+7);g.lineTo(6,topY);g.closePath();g.fill();

  g.fillStyle=shadeHex(skin,-.18);g.fillRect(-3+d,topY-4,6,5);

  drawFace(g,L,headCX,headCY,headR,d,eyeC,hairC,skin,!!o.blink);
  drawHair(g,L.hair,hairC,headCX,headCY,headR,d);

  if(W)drawGun(g,o.wid,handX,handY,d,1.45,o.glow||0);

  else avLimb(g,[d*3,shY,handX-d*2,handY+1],6.5,T.jacket);

}
// 鬼帝の角：額から上へそり返る2本（根元は金、先は黒）
function drawBossHorns(g,hx,hy,r,d){
  [-1,1].forEach(function(sd){
    var bx=hx+sd*r*.4+d*r*.12,by=hy-r*.7,tx=hx+sd*r*1.02+d*r*.1,ty=hy-r*1.95;

    g.beginPath();
    g.moveTo(bx-sd*r*.18,by+r*.06);
    g.quadraticCurveTo(bx+sd*r*.02,by-r*.8,tx,ty);
    g.quadraticCurveTo(bx+sd*r*.45,by-r*.55,bx+sd*r*.2,by+r*.03);
    g.closePath();g.fillStyle=gr;g.fill();g.lineWidth=r*.09;g.lineJoin='round';g.strokeStyle=OUTLINE;g.stroke();
  });
}
// 鬼帝の気：足元から立ちのぼる、暗い赤と金のゆらめき（キャラクターの座標：足元が0、頭の上が約-90）
function drawBossAura(g,topY,tm){
  g.save();
  for(var i=0;i<7;i++){
    var ph=(tm*.9+i*.37)%1,x=(i-3)*5.2+Math.sin(tm*3+i*1.9)*3,w0=7.5-Math.abs(i-3)*.9,y0=2,y1=topY-22-ph*30-(3-Math.abs(i-3))*6;
    var gr=g.createLinearGradient(0,y0,0,y1);
    gr.addColorStop(0,'rgba(120,16,10,0)');gr.addColorStop(.25,'rgba(150,24,14,'+(.36*(1-ph)).toFixed(3)+')');
    gr.addColorStop(.7,'rgba(232,180,80,'+(.24*(1-ph)).toFixed(3)+')');gr.addColorStop(1,'rgba(232,198,106,0)');
    g.fillStyle=gr;g.beginPath();g.moveTo(x-w0,y0);
    g.quadraticCurveTo(x-w0*1.4+Math.sin(tm*4+i)*4,(y0+y1)/2,x+Math.sin(tm*5+i*2)*5,y1);
    g.quadraticCurveTo(x+w0*1.4+Math.cos(tm*4+i)*4,(y0+y1)/2,x+w0,y0);
    g.closePath();g.fill();
  }
  // 金の火の粉
  for(var k=0;k<6;k++){
    var p2=(tm*.7+prand(k*3.3))%1,ex=(prand(k*7.1)-.5)*34+Math.sin(tm*2+k)*4,ey=-p2*110;
    g.fillStyle='rgba(255,210,120,'+(Math.sin(p2*Math.PI)*.8).toFixed(3)+')';g.beginPath();g.arc(ex,ey,1.3,0,Math.PI*2);g.fill();
  }
  g.restore();
}
// ---- 顔 ----
// 位置は「頭の半径＝1、右を向いているとき」の値。大きさも線の太さも半径に合わせるので、拡大してもくずれない
var FACE={eyeY:.1,eyeF:.5,eyeB:-.04,es:.13,browY:-.21,noseX:.4,noseY:.38,mouthX:.3,mouthY:.63};
// 顔の部分（まゆげ〜口）。髪はここには描かない（目やまゆげに髪がかからない）
var FACE_ZONE={x0:-.3,x1:.86,y0:-.34,y1:.84,rad:.3};
function mixHex(a,b,t){
  var x=parseInt(String(a).slice(1),16),y=parseInt(String(b).slice(1),16);
  function c(s){return Math.round((x>>s&255)*(1-t)+(y>>s&255)*t);}
  return'#'+((1<<24)+(c(16)<<16)+(c(8)<<8)+c(0)).toString(16).slice(1);
}
function lumHex(h){var n=parseInt(String(h).slice(1),16);return(.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255;}
// 鼻の色：明るい肌には赤みのある茶色、暗い肌には明るい色（どの肌の色でもはっきり見える）
function noseInk(skin){return lumHex(skin)<.4?mixHex(skin,'#F7D2B0',.6):mixHex(skin,'#7A3326',.62);}
// 角の丸い四角を、いまのパスに足す（beginPath しない）
function rrSub(g,x,y,w,h,r){g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawEar(g,skin,hx,hy,r,d){
  var ex=hx-d*r*.64,ey=hy+r*.14;
  g.beginPath();g.ellipse(ex,ey,r*.19,r*.26,0,0,Math.PI*2);
  g.fillStyle=shadeHex(skin,-.08);g.fill();g.lineWidth=1.3;g.strokeStyle=OUTLINE;g.stroke();
  g.beginPath();
  if(d>0)g.arc(ex+r*.02,ey,r*.1,Math.PI*.5,Math.PI*1.5);else g.arc(ex-r*.02,ey,r*.1,-Math.PI*.5,Math.PI*.5);
  g.lineWidth=r*.05;g.lineCap='round';g.strokeStyle=shadeHex(skin,-.32);g.stroke();
}
// まゆげ：内側（x1,y1）が太く、外側（x2,y2）に向かって細くなる。arch<0 で上にそる
function browPath(g,x1,y1,x2,y2,t1,t2,arch){
  var mx=(x1+x2)/2,my=(y1+y2)/2+arch*2,tm=(t1+t2)/2,dx=x2-x1;
  g.beginPath();
  g.moveTo(x1,y1-t1);
  g.quadraticCurveTo(mx,my-tm,x2,y2-t2);
  g.quadraticCurveTo(x2+dx*.1,y2,x2,y2+t2*.7);
  g.quadraticCurveTo(mx,my+tm*.8,x1,y1+t1);
  g.quadraticCurveTo(x1-dx*.07,y1,x1,y1-t1);
  g.closePath();
}
function drawFace(g,L,hx,hy,r,d,eyeC,hairC,skin,blink){
  var F=FACE,ey=hy+r*F.eyeY,es=r*F.es,EX=[hx+d*r*F.eyeF,hx+d*r*F.eyeB];
  g.save();g.lineCap='round';g.lineJoin='round';
  // まゆげ（4＝なし）
  if(L.brows!==4){
    var bc=shadeHex(hairC,lumHex(hairC)>.7?-.5:-.35),by=hy+r*F.browY;
    EX.forEach(function(ex,i){
      var k=i?.85:1,hw=es*1.3*k,sg=i?-1:1,ix=ex-d*sg*hw,ox=ex+d*sg*hw;   // ix＝内側（もう片方の目の側）
      var iy=by,oy=by,arch=-r*.025,t1=r*.05,t2=r*.028;
      if(L.brows===1){iy=by+r*.07;oy=by-r*.06;arch=0;t1=r*.058;}          // きりっ
      else if(L.brows===2){iy=by-r*.07;oy=by+r*.04;arch=-r*.01;}          // こまり
      else if(L.brows===3){t1=r*.078;t2=r*.058;arch=-r*.01;}              // 太い
      browPath(g,ix,iy,ox,oy,t1,t2,arch);g.fillStyle=bc;g.fill();
    });
  }
  // 目（奥の目は少し細い：ななめを向いているので）
  EX.forEach(function(ex,i){
    var w=es*(i?.85:1),h=es;
    if(blink&&L.eyes!==4){
      g.beginPath();g.moveTo(ex-w*1.15,ey+h*.25);g.quadraticCurveTo(ex,ey+h*.7,ex+w*1.15,ey+h*.25);
      g.lineWidth=r*.085;g.strokeStyle=OUTLINE;g.stroke();return;
    }
    drawEye(g,L.eyes,ex,ey,w,h,d,eyeC,r);
  });
