<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080C">
<title>GUN DUEL</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0D14'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23FFC53D' stroke-width='6'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='%23FFC53D'/%3E%3Cpath d='M32 5v12M32 47v12M5 32h12M47 32h12' stroke='%23FFC53D' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#07080C;
  --panel:rgba(19,22,32,.78);--panel-solid:#12151F;--panel-hi:#1B2030;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.15);
  --tx:#EDEBE6;--tx-2:#A9ADB8;--tx-3:#6B7080;
  --gold:#FFC53D;--gold-deep:#E8A200;--gold-ink:#1A1204;
  --gold-grad:linear-gradient(135deg,#FFDB7A 0%,#FFC53D 42%,#E8A200 100%);
  --me:#9D74FF;--foe:#FF4D5E;--ok:#34D399;
  --f-ui:'Chakra Petch','Zen Kaku Gothic New',system-ui,sans-serif;
  --f-jp:'Zen Kaku Gothic New','Chakra Petch',system-ui,sans-serif;
  --f-disp:'Dela Gothic One','Zen Kaku Gothic New',sans-serif;
  --f-neon:'Dela Gothic One','Zen Kaku Gothic New',sans-serif;
  --f-mincho:'Shippori Mincho B1','Zen Kaku Gothic New',serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;
  background:var(--bg);
  color:var(--tx);font-family:var(--f-jp);font-weight:500;letter-spacing:.02em;
  font-feature-settings:"palt";-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
/* ページの背景（多層のキャンバス。描くのは initBgFx）*/
#bg-fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
button,input{font:inherit;color:inherit;letter-spacing:inherit;}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
::selection{background:var(--gold);color:var(--gold-ink);}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
kbd{font-family:var(--f-ui);font-weight:700;}
#wrap{position:relative;z-index:1;width:100%;max-width:860px;padding:28px 16px 36px;}

/* ---------- 共通 ---------- */
.screen{animation:scr-in .42s var(--ease) both;}
@keyframes scr-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes item-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.menu{max-width:460px;margin:0 auto;}
.scr-head{text-align:center;margin-bottom:24px;}
.kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);}
.kicker::before,.kicker::after{content:"";width:22px;height:1px;background:currentColor;opacity:.55;}
.scr-title{font-family:var(--f-disp);font-weight:400;font-size:28px;line-height:1.25;letter-spacing:.06em;color:var(--tx);margin-top:8px;}
.scr-sub{font-size:13px;color:var(--tx-3);margin-top:8px;}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:5px 12px;border:1px solid var(--line-2);border-radius:99px;background:rgba(255,255,255,.03);font-size:12px;color:var(--tx-2);}
.pill:empty{display:none;}
.back-btn,.settings-back{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:12px;background:transparent;border:1px solid var(--line);border-radius:12px;color:var(--tx-2);font-size:13px;font-weight:700;letter-spacing:.06em;transition:.18s var(--ease);}
.back-btn:hover,.settings-back:hover{color:var(--tx);border-color:var(--line-2);background:rgba(255,255,255,.03);}
.back-btn svg.i{width:16px;height:16px;}

/* ---------- ミュート ---------- */
#mute-btn .ic-off{display:none;}
#mute-btn.muted{color:var(--foe);}
#mute-btn.muted .ic-on{display:none;}
#mute-btn.muted .ic-off{display:block;}

/* ---------- 利用規約 ---------- */
#tos-screen{max-width:520px;margin:0 auto;}
#tos-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-height:300px;overflow-y:auto;font-size:13px;line-height:1.85;color:var(--tx-2);margin-bottom:14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent;}
#tos-box::-webkit-scrollbar{width:6px;}
#tos-box::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px;}
#tos-box h4{display:flex;align-items:center;gap:10px;color:var(--tx);font-size:13.5px;font-weight:900;margin:18px 0 6px;}
#tos-box h4:first-child{margin-top:0;}
#tos-box h4::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--gold);}
#tos-box h4.danger::before{background:var(--foe);}
#tos-box ul{list-style:none;margin:0 0 4px;padding:0;}
#tos-box li{position:relative;padding-left:16px;margin-bottom:4px;}
#tos-box li::before{content:"";position:absolute;left:2px;top:.9em;width:6px;height:1px;background:var(--tx-3);}
.tos-agree-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);font-size:13.5px;font-weight:700;color:var(--tx);cursor:pointer;transition:.15s;}
.tos-agree-row:hover{border-color:var(--line-2);}
.tos-agree-row:has(input:checked){border-color:rgba(255,197,61,.45);background:rgba(255,197,61,.05);}
.tos-agree-row input{-webkit-appearance:none;appearance:none;flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--tx-3);background:transparent;cursor:pointer;transition:.15s;}
.tos-agree-row input::after{content:"";width:10px;height:5px;border-left:2.5px solid var(--gold-ink);border-bottom:2.5px solid var(--gold-ink);transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .18s var(--ease);}
.tos-agree-row input:checked{background:var(--gold);border-color:var(--gold);}
.tos-agree-row input:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1);}
#tos-agree-btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:rgba(255,255,255,.06);color:var(--tx-3);font-size:15px;font-weight:900;letter-spacing:.08em;cursor:not-allowed;transition:.2s var(--ease);}
#tos-agree-btn.ready{background:var(--gold-grad);color:var(--gold-ink);cursor:pointer;box-shadow:0 12px 32px -12px rgba(255,180,0,.6),inset 0 1px 0 rgba(255,255,255,.45);}
#tos-agree-btn.ready:hover{filter:brightness(1.05);transform:translateY(-1px);}

/* ---------- タイトル ---------- */
.logo{margin:6px 0 26px;}
.logo-mark{width:44px;height:44px;margin:0 auto 12px;color:var(--gold);filter:drop-shadow(0 0 18px rgba(255,197,61,.4));}
.logo-mark svg.i{width:100%;height:100%;stroke-width:1.6;}
#mode-screen h1{display:flex;justify-content:center;gap:.2em;font-family:'Chakra Petch',sans-serif;font-style:italic;font-weight:700;font-size:clamp(48px,12vw,72px);line-height:.92;letter-spacing:-.01em;}
#mode-screen h1 .l1{color:var(--tx);}
#mode-screen h1 .l2{padding-right:.08em;background:linear-gradient(180deg,#FFE7A3 0%,#FFC53D 48%,#D99400 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(255,180,0,.28));}
.logo-tag{display:inline-flex;align-items:center;gap:10px;margin-top:14px;font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.3em;color:var(--tx-3);}
.logo-tag b{color:var(--gold);font-weight:700;}
#mode-screen p{font-size:13px;color:var(--tx-2);margin-top:10px;}
/* ホーム：上のプロフィールのバー */
.home-bar{display:grid;grid-template-columns:52px minmax(0,1fr) auto 20px;align-items:center;gap:14px;width:100%;max-width:560px;margin:0 auto 22px;padding:9px 14px 9px 9px;text-align:left;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--tx);
  transition:transform .18s var(--ease),border-color .18s,box-shadow .18s;animation:item-in .5s var(--ease) both;}
.home-bar:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:0 14px 30px -18px rgba(0,0,0,.9);}
.hb-av{display:block;width:52px;height:52px;}
.hb-who{display:flex;flex-direction:column;gap:4px;min-width:0;}
.hb-name{font-size:17px;font-weight:900;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hb-title{font-size:12px;font-weight:900;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hb-tier{display:flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--tx-2);white-space:nowrap;}
.hb-tier canvas{display:block;width:48px;height:48px;}
.hb-arrow{color:var(--tx-3);transition:transform .18s var(--ease),color .18s;}
.home-bar:hover .hb-arrow{transform:translateX(3px);color:var(--tx);}
/* ホーム：対戦を始める大きなボタンと、準備のボタン */
.play-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.play-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;padding:18px 14px;border-radius:18px;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--panel);border:1px solid var(--line-2);color:var(--tx);
  transition:transform .18s var(--ease),box-shadow .18s,filter .18s,border-color .18s;animation:item-in .5s var(--ease) both;}
.play-btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.3);box-shadow:0 18px 36px -18px rgba(0,0,0,.9);}
.play-btn:active{transform:scale(.99);}
.play-btn b{font-size:21px;font-weight:900;letter-spacing:.06em;}
.play-btn small{font-size:11.5px;font-weight:500;color:var(--tx-3);}
.pb-ic{display:grid;place-items:center;width:52px;height:52px;margin-bottom:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx-2);}
.pb-ic svg.i{width:26px;height:26px;}
.play-btn.primary{background:var(--gold-grad);border-color:transparent;color:var(--gold-ink);box-shadow:0 14px 34px -12px rgba(255,180,0,.6),inset 0 1px 0 rgba(255,255,255,.45);}
.play-btn.primary:hover{filter:brightness(1.05);box-shadow:0 18px 40px -12px rgba(255,180,0,.7),inset 0 1px 0 rgba(255,255,255,.5);}
.play-btn.primary .pb-ic{background:rgba(26,18,4,.1);border-color:rgba(26,18,4,.14);color:var(--gold-ink);}
.play-btn.primary small{color:rgba(26,18,4,.7);}
.play-btn.online{animation-delay:.06s;}
.play-btn.online .pb-ic{color:#B9A2FF;border-color:rgba(157,116,255,.35);background:rgba(157,116,255,.1);}
.sub-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px;}
@media (max-width:560px){.sub-grid{grid-template-columns:1fr 1fr;}}
.sub-btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 10px;border-radius:13px;background:var(--panel);border:1px solid var(--line);color:var(--tx-2);font-size:14px;font-weight:900;letter-spacing:.04em;transition:.18s var(--ease);animation:item-in .5s var(--ease) both;animation-delay:.12s;}
.sub-btn:hover{color:var(--tx);border-color:var(--line-2);transform:translateY(-1px);}
.sub-btn svg.i{width:18px;height:18px;}
/* 射撃場：キャンバスの下に、武器の切りかえと武器ごとの記録 */
#range-panel{display:none;margin-top:12px;padding:12px 14px;border-radius:14px;background:rgba(10,12,20,.78);border:1px solid var(--line);}
#game-screen.range #range-panel{display:block;}
@media (min-width:700px){
  #game-screen.range.playing .canvas-frame{width:min(100%,max(480px,calc((100vh - 340px) * 2)));width:min(100%,max(480px,calc((100dvh - 340px) * 2)));}
}
.rp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.rp-head b{font-family:var(--f-disp);font-weight:400;font-size:15px;letter-spacing:.1em;color:var(--gold);}
.rp-head .rp-note{flex:1;min-width:180px;font-size:11px;color:var(--tx-3);}
.rp-head button{padding:6px 12px;border-radius:99px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);font-size:12px;font-weight:700;color:var(--tx-2);}
.rp-head button:hover{color:var(--tx);border-color:var(--gold);}
.rp-body{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start;}
@media (max-width:760px){.rp-body{grid-template-columns:1fr;}}
.rp-slots{display:flex;gap:6px;margin-bottom:8px;}
.rp-slots button{flex:1;display:flex;align-items:center;gap:7px;min-width:0;padding:6px 8px;border-radius:9px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);font-size:12px;font-weight:700;color:var(--tx-2);}
.rp-slots button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rp-slots button.sel{border-color:var(--gold);color:var(--gold);background:rgba(255,197,61,.08);}
.rp-slots kbd{font-family:var(--f-ui);font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid rgba(255,255,255,.25);color:var(--tx-2);}
.rp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
@media (max-width:760px){.rp-grid{grid-template-columns:repeat(5,1fr);}}
.rp-grid button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px 5px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);font-size:10px;font-weight:700;color:var(--tx-2);}
.rp-grid button:hover{border-color:rgba(255,255,255,.3);color:var(--tx);}
.rp-grid button canvas{width:100%;height:auto;aspect-ratio:96/42;}
.rp-grid button.on{border-color:var(--wc);box-shadow:0 0 12px -4px var(--wc);color:var(--tx);}
.rp-grid button .sl{position:absolute;top:2px;left:4px;font-family:var(--f-ui);font-size:9px;color:var(--gold);}
.rp-hint{margin-top:7px;font-size:10.5px;line-height:1.6;color:var(--tx-3);}
.rp-table{width:100%;border-collapse:collapse;font-size:12px;}
.rp-table th{font-size:10px;font-weight:700;color:var(--tx-3);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
.rp-table th:first-child,.rp-table td:first-child{text-align:left;}
.rp-table td{padding:5px 6px;text-align:right;font-family:var(--f-ui);font-weight:700;color:var(--tx-2);border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;}
.rp-table tr.cur td{color:var(--tx);background:rgba(255,197,61,.07);}
.rp-table .wdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--wc);}
.rp-empty{font-size:11.5px;line-height:1.6;color:var(--tx-3);padding:8px 2px;}
.rp-sub{margin-top:6px;font-size:10px;color:var(--tx-3);}
.sb-ic{position:relative;display:grid;place-items:center;}
.sb-ic .mb-badge{top:-9px;right:-11px;}
#login-bar{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:18px;}
.login-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;padding:10px 12px;border:0;border-radius:10px;background:#5865F2;color:#fff;font-size:13.5px;font-weight:900;letter-spacing:.04em;transition:.15s var(--ease);}
.login-btn:hover{background:#4752C4;transform:translateY(-1px);}
.login-btn svg{width:20px;height:20px;fill:currentColor;flex:none;}
#login-info{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);}
#login-name{font-size:15px;font-weight:900;color:var(--tx);}
#login-name::before{content:"";display:inline-block;width:7px;height:7px;margin-right:8px;border-radius:50%;background:#5865F2;vertical-align:middle;}
#login-record{font-family:var(--f-ui);font-size:11.5px;font-weight:600;color:var(--tx-3);}
#login-info[data-pres="on"] #login-name::before{background:#3BD671;box-shadow:0 0 0 3px rgba(59,214,113,.18);}
#login-info[data-pres="connecting"] #login-name::before{background:#F5B83D;}
#login-info[data-pres="off"] #login-name::before{background:#6B7280;}
#login-pres{font-family:var(--f-ui);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--tx-3);}
#login-info[data-pres="on"] #login-pres{color:#3BD671;}
#logout-btn{padding:5px 11px;border:1px solid var(--line-2);border-radius:8px;background:transparent;color:var(--tx-3);font-size:11.5px;font-weight:700;}
#logout-btn:hover{color:var(--foe);border-color:rgba(255,77,94,.45);}
.login-note{font-size:11px;line-height:1.6;color:var(--tx-3);text-align:center;}
.acc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.acc-name{font-size:16px;font-weight:900;color:var(--tx);}
.acc-tag{font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:.14em;padding:3px 8px;border-radius:5px;background:rgba(88,101,242,.18);color:#A5B0FF;}
.acc-rec{margin-top:8px;font-size:13px;color:var(--tx-2);}
.acc-pres{font-family:var(--f-ui);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--tx-3);}
.acc-pres::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#6B7280;vertical-align:middle;}
.acc-pres[data-pres="on"]{color:#3BD671;}
.acc-pres[data-pres="on"]::before{background:#3BD671;box-shadow:0 0 0 3px rgba(59,214,113,.18);}
.acc-pres[data-pres="connecting"]::before{background:#F5B83D;}
.acc-fid{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:rgba(255,255,255,.03);}
.acc-fid span{font-size:11.5px;font-weight:700;color:var(--tx-3);}
.acc-fid b{font-family:var(--f-ui);font-size:17px;font-weight:700;letter-spacing:.18em;color:var(--gold);}
.acc-copy{margin-left:auto;padding:5px 12px;border:1px solid var(--line-2);border-radius:8px;background:transparent;color:var(--tx-2);font-size:11.5px;font-weight:700;}
.acc-copy:hover{color:var(--gold);border-color:rgba(255,197,61,.55);}
.acc-sync{margin-top:10px;font-size:11.5px;color:var(--tx-3);}
.acc-sync:empty{display:none;}
.acc-sync::before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:#6B7280;vertical-align:middle;}
.acc-sync[data-s="saved"]{color:#7FD9A0;}
.acc-sync[data-s="saved"]::before{background:#3BD671;}
.acc-sync[data-s="saving"]::before{background:#F5B83D;}
.acc-sync[data-s="error"]{color:#FF8A95;}
.acc-sync[data-s="error"]::before{background:#FF4D5E;}
/* ---------- フレンド ---------- */
.mb-badge{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--foe);color:#fff;font-family:var(--f-ui);font-size:11px;font-weight:700;line-height:19px;text-align:center;box-shadow:0 0 0 2px var(--panel-solid);}
.fr-login{text-align:center;}
.fr-login p{margin-bottom:14px;font-size:13.5px;line-height:1.7;color:var(--tx-2);}
.fr-me{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;border:1px solid var(--line-2);border-radius:10px;background:rgba(255,255,255,.03);}
.fr-me span{font-size:11.5px;font-weight:700;color:var(--tx-3);}
.fr-me b{font-family:var(--f-ui);font-size:18px;font-weight:700;letter-spacing:.18em;color:var(--gold);}
.fr-me .acc-copy{margin-left:auto;}
.fr-add{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;}
.fr-input{width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line-2);border-radius:10px;background:rgba(0,0,0,.35);color:var(--tx);font-family:var(--f-ui);font-size:17px;font-weight:700;letter-spacing:.22em;outline:none;transition:.18s;}
.fr-input::placeholder{font-family:var(--f-jp);font-size:12.5px;font-weight:500;letter-spacing:.04em;color:var(--tx-3);}
.fr-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,61,.15);}
.fr-send{padding:0 18px;border:0;border-radius:10px;background:var(--gold-grad);color:var(--gold-ink);font-size:13px;font-weight:900;white-space:nowrap;}
.fr-send:hover{filter:brightness(1.05);}
.fr-msg{margin-top:8px;font-size:12.5px;color:var(--tx-2);}
.fr-msg:empty{display:none;}
.fr-msg.ok{color:#7FD9A0;}
.fr-msg.err{color:#FF8A95;}
.fr-rows{display:flex;flex-direction:column;gap:8px;}
.fr-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);transition:border-color .15s,background .15s;}
.fr-row.fr-click{cursor:pointer;}
.fr-row.fr-click:hover{border-color:var(--line-2);background:rgba(255,255,255,.045);}
.fr-av{display:block;width:48px;height:48px;}
.fr-info{min-width:0;display:flex;flex-direction:column;gap:2px;}
.fr-info b{font-size:14.5px;font-weight:900;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fr-info small{font-size:11.5px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fr-st{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--tx-3);}
.fr-st::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:#6B7280;vertical-align:middle;}
.fr-st[data-st="online"]{color:#3BD671;}
.fr-st[data-st="online"]::before{background:#3BD671;box-shadow:0 0 0 3px rgba(59,214,113,.18);}
.fr-st[data-st="cpu"]{color:#F5B83D;}
.fr-st[data-st="cpu"]::before{background:#F5B83D;}
.fr-st[data-st="match"]{color:#FF6B7A;}
.fr-st[data-st="match"]::before{background:#FF4D5E;}
.fr-btns{display:flex;align-items:center;gap:6px;}
.fr-btn{padding:7px 12px;border:1px solid var(--line-2);border-radius:9px;background:transparent;color:var(--tx-2);font-size:12px;font-weight:700;white-space:nowrap;transition:.15s;}
.fr-btn:hover:not(:disabled){color:var(--tx);border-color:rgba(255,255,255,.3);}
.fr-btn.ok,.fr-btn.inv{border-color:rgba(255,197,61,.5);color:var(--gold);}
.fr-btn.ok:hover,.fr-btn.inv:hover:not(:disabled){background:rgba(255,197,61,.1);color:var(--gold);}
.fr-btn.del:hover{color:var(--foe);border-color:rgba(255,77,94,.45);}
.fr-btn:disabled{opacity:.35;cursor:default;}
.fr-wait{font-size:11.5px;color:var(--tx-3);}
.fr-modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:rgba(4,5,9,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.fr-modal.show{display:grid;animation:frm-fade .2s both;}
.fr-sheet{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:center;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;border:1px solid var(--line-2);border-radius:18px;background:var(--panel-solid);box-shadow:0 30px 70px -20px rgba(0,0,0,.9);animation:frm-in .3s var(--ease) both;}
.fr-card{display:block;width:100%;height:auto;aspect-ratio:380/500;}
.fr-stats{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;margin:14px 0 18px;font-size:13px;}
.fr-stats dt{color:var(--tx-3);font-weight:700;}
.fr-stats dd{color:var(--tx);font-weight:700;overflow-wrap:anywhere;}
.fr-mbtns{display:flex;flex-direction:column;gap:8px;}
.fr-mbtns .back-btn{margin-top:0;}
.fr-mbtns .room-btn:disabled{opacity:.4;filter:grayscale(.6);transform:none;cursor:default;}
@keyframes frm-fade{from{opacity:0}to{opacity:1}}
@keyframes frm-in{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@media (max-width:560px){.fr-sheet{grid-template-columns:1fr;gap:10px;}.fr-card{width:min(230px,66vw);margin:0 auto;}}
/* 招待の通知（上から出てきて10秒で消える） */
.inv-toast{position:fixed;top:14px;left:50%;z-index:70;display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;width:min(470px,calc(100vw - 24px));padding:12px 14px 15px;border:1px solid rgba(255,197,61,.5);border-radius:16px;background:linear-gradient(180deg,rgba(44,34,10,.97),rgba(16,18,28,.98));box-shadow:0 20px 46px -12px rgba(0,0,0,.85);overflow:hidden;transform:translate(-50%,-160%);opacity:0;visibility:hidden;transition:transform .42s var(--ease),opacity .3s,visibility 0s linear .42s;}
.inv-toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .45s var(--ease),opacity .2s;}
.inv-toast .fr-av{width:52px;height:52px;}
.inv-tx{min-width:0;display:flex;flex-direction:column;gap:2px;}
.inv-kick{font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--gold);}
.inv-tx b{font-size:16px;font-weight:900;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inv-tx small{font-size:12px;color:var(--tx-2);}
.inv-btns{display:flex;flex-direction:column;gap:6px;}
.inv-ok{padding:8px 16px;border:0;border-radius:9px;background:var(--gold-grad);color:var(--gold-ink);font-size:13px;font-weight:900;white-space:nowrap;}
.inv-ok:hover{filter:brightness(1.06);}
.inv-no{padding:6px 16px;border:1px solid var(--line-2);border-radius:9px;background:transparent;color:var(--tx-2);font-size:12px;font-weight:700;white-space:nowrap;}
.inv-no:hover{color:var(--tx);}
.inv-bar{position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--gold);transform-origin:left;}
.inv-toast.show .inv-bar{animation:inv-count 10s linear forwards;}
@keyframes inv-count{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.note-toast{position:fixed;left:50%;bottom:22px;z-index:70;max-width:calc(100vw - 32px);padding:11px 18px;border:1px solid var(--line-2);border-radius:12px;background:rgba(14,16,24,.96);color:var(--tx);font-size:13px;font-weight:700;box-shadow:0 14px 34px -12px rgba(0,0,0,.8);transform:translate(-50%,160%);opacity:0;transition:transform .35s var(--ease),opacity .25s;pointer-events:none;}
.note-toast.show{transform:translate(-50%,0);opacity:1;}
@media (max-width:760px){.inv-toast{top:66px;}}   /* 右上の設定ボタンと重ならないように */
#server-url-bar{display:flex;align-items:center;gap:12px;padding:9px 12px 9px 14px;border:1px dashed var(--line-2);border-radius:12px;font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--tx-3);}
#server-url-bar input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx-2);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;letter-spacing:0;}

/* ---------- ステージ / CPU ---------- */
.stage-card,.cpu-card{position:relative;display:grid;align-items:center;width:100%;margin:0 0 10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--tx);transition:transform .18s var(--ease),border-color .18s,box-shadow .18s;animation:item-in .5s var(--ease) both;animation-delay:calc(var(--i,0)*55ms);}
.stage-card:hover,.cpu-card:hover{transform:translateY(-1px);border-color:var(--hc,rgba(255,197,61,.55));box-shadow:0 14px 34px -18px var(--hc,rgba(255,197,61,.6));}
.stage-card{grid-template-columns:150px 1fr;gap:16px;padding:10px 16px 10px 10px;}
.sc-prev{display:block;width:150px;height:64px;border-radius:9px;background:linear-gradient(180deg,#0A0D1A,#161C36);border:1px solid var(--line);overflow:hidden;}
.sc-prev svg{display:block;width:100%;height:100%;}
.sc-body{display:flex;flex-direction:column;gap:4px;min-width:0;}
.sc-no{font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--gold);}
.sc-name{font-size:17px;font-weight:900;letter-spacing:.05em;}
.stage-card small,.cpu-card small{display:block;font-size:11.5px;font-weight:500;line-height:1.5;color:var(--tx-3);}
.cpu-card{grid-template-columns:52px 1fr auto;gap:14px;padding:12px 16px 12px 12px;}
.cc-lv{display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:52px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-family:var(--f-ui);font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--tx-3);}
.cc-lv b{font-size:22px;line-height:1;letter-spacing:0;color:var(--lc);}
.cc-body{display:flex;flex-direction:column;gap:3px;min-width:0;}
.cc-name{font-size:16px;font-weight:900;letter-spacing:.05em;}
.cc-side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
.cc-meter{display:flex;gap:3px;}
.cc-meter i{width:6px;height:14px;border-radius:2px;background:rgba(255,255,255,.08);transform:skewX(-14deg);}
.cc-meter i.on{background:var(--lc);box-shadow:0 0 8px -1px var(--lc);}
.cc-rec{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--tx-3);}
.cc-rec b{color:var(--tx-2);}
/* 隠しボス「鬼帝」のカード：黒と金。縁を金の光が回り、火の粉がゆっくり上る */
@property --emp-ang{syntax:'<angle>';inherits:false;initial-value:0deg;}
.cpu-card.emp{--lc:#E8C66A;--hc:rgba(232,198,106,.8);margin-top:18px;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 160% at 8% 50%,rgba(150,60,10,.32),transparent 55%),linear-gradient(135deg,#0d0a05,#1a1206 55%,#0a0703);
  border:1px solid rgba(232,198,106,.5);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 12px 34px -16px rgba(232,170,60,.55);}
.cpu-card.emp::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--emp-ang),transparent 0 62%,rgba(255,236,170,.95) 76%,transparent 90%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:emp-spin 4.5s linear infinite;}
.cpu-card.emp::after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.6;
  background-image:radial-gradient(1.6px 1.6px at 18% 80%,#FFD36B,transparent),radial-gradient(1.2px 1.2px at 58% 90%,#FFE9A8,transparent),radial-gradient(1.6px 1.6px at 84% 66%,#E8C66A,transparent),radial-gradient(1.2px 1.2px at 38% 40%,#FFD36B,transparent);
  background-size:130px 64px;animation:emp-embers 7s linear infinite;}
.cpu-card.emp:hover{border-color:rgba(245,220,138,.9);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 16px 40px -14px rgba(255,190,70,.75);}
.cpu-card.emp.new{box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 0 0 1px rgba(255,90,70,.35),0 14px 40px -12px rgba(255,120,60,.7);}
@keyframes emp-spin{to{--emp-ang:360deg;}}
@keyframes emp-embers{from{background-position:0 0}to{background-position:0 -128px}}
.cc-lv.emp{background:radial-gradient(circle at 50% 62%,rgba(200,40,30,.4),rgba(0,0,0,.65) 72%);border-color:rgba(232,198,106,.6);}
.cc-lv.emp svg{width:36px;height:36px;fill:none;stroke:#E8C66A;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px rgba(255,190,70,.6));}
.cc-lv.emp svg .h{fill:rgba(232,198,106,.28);}
.cc-lv.emp svg .e{stroke:#FF5A45;stroke-width:2.2;}
.cpu-card.emp .cc-name{font-family:var(--f-disp);font-weight:400;font-size:19px;letter-spacing:.14em;
  background:linear-gradient(180deg,#FFF3C4,#E8C66A 45%,#A87A24 58%,#F5DC8A);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;}
.cc-new{display:inline-block;margin-left:10px;padding:2px 7px;border-radius:4px;vertical-align:3px;background:#FF4D5E;font-family:var(--f-ui);font-style:normal;font-size:9px;font-weight:700;letter-spacing:.14em;color:#FFFFFF;-webkit-text-fill-color:#FFFFFF;animation:emp-new 1.1s ease-in-out infinite alternate;}
@keyframes emp-new{from{box-shadow:0 0 0 0 rgba(255,77,94,.6)}to{box-shadow:0 0 12px 2px rgba(255,77,94,.55)}}
.cpu-card.emp small{color:rgba(255,226,170,.72);}
.cpu-card.emp .cc-rec{color:rgba(255,226,170,.6);}
.cpu-card.emp .cc-rec b{color:#F5DC8A;}
.cc-slain{display:block;margin-bottom:4px;font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:.16em;color:#FFD36B;text-shadow:0 0 8px rgba(255,190,70,.6);text-align:right;}
@media (prefers-reduced-motion:reduce){.cpu-card.emp::before,.cpu-card.emp::after,.cc-new{animation:none;}}

/* ---------- オンライン ---------- */
/* 2v2：パーティー・部屋の集まり・ランキングのタブ */
.pt-members{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 2px;font-size:15px;font-weight:900;}
.pt-m{padding:6px 14px;border-radius:99px;background:rgba(94,234,212,.1);border:1px solid rgba(94,234,212,.45);color:#CCFBF1;}
.pt-plus{color:var(--tx-3);}
.pt-list{display:grid;gap:6px;margin-top:10px;}
.pt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:13px;font-weight:700;}
.pt-row button{padding:5px 12px;border-radius:99px;border:1px solid rgba(94,234,212,.5);background:rgba(94,234,212,.08);color:#99F6E4;font-size:12px;font-weight:700;}
.pt-row button:hover{background:rgba(94,234,212,.18);}
#ol-lobby{margin-top:10px;}
.tl-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0 12px;}
.tl-team{display:grid;gap:6px;padding:10px;border-radius:12px;border:1px solid var(--line);}
.tl-team.a{background:rgba(157,116,255,.07);border-color:rgba(157,116,255,.35);}
.tl-team.b{background:rgba(255,77,94,.06);border-color:rgba(255,77,94,.3);}
.tl-team h4{margin:0 0 2px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--tx-3);text-align:center;}
.tl-vs{font-family:var(--f-ui);font-weight:700;font-style:italic;color:var(--gold);}
.tl-slot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:9px;background:rgba(255,255,255,.04);font-size:13px;}
.tl-slot.me{outline:2px solid var(--gold);}
.tl-slot small{font-size:10px;color:var(--gold);}
.tl-slot.empty{border:1px dashed var(--line-2);color:var(--tx-3);}
.tl-slot.empty:hover{border-color:var(--gold);color:var(--tx);}
.tl-slot.empty small{color:var(--tx-3);}
.rk-tabs{display:flex;justify-content:center;gap:6px;margin:-8px 0 12px;}
.rk-tabs button{padding:6px 18px;border-radius:99px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);font-family:var(--f-ui);font-size:13px;font-weight:700;color:var(--tx-2);}
.rk-tabs button.sel{border-color:var(--gold);color:var(--gold);background:rgba(255,197,61,.1);}
.rate-2v2{margin-top:6px;font-size:12px;font-weight:700;color:#99F6E4;}
#match-panel.team.prep .mp-cols{grid-template-columns:repeat(3,1fr);}
#match-panel.team.pick .mp-cols{grid-template-columns:repeat(4,1fr);}
#match-panel.team .mp-head b{font-size:12px;}
@media (max-width:760px){#match-panel.team.prep .mp-cols,#match-panel.team.pick .mp-cols{grid-template-columns:1fr 1fr;}}
#match-panel.team .mp-w{padding:4px 5px;gap:5px;}
#match-panel.team .mp-w canvas{width:38px;height:17px;flex:0 0 38px;}
#match-panel.team .mp-w b{font-size:11px;}
#match-panel.team .mp-w small{font-size:8.5px;line-height:1.3;}
#match-panel.team .mp-row{grid-template-columns:1fr;gap:4px;}
#match-panel .mp-col.mini h4{font-size:10.5px;}
#match-panel .mp-col.ally h4{color:#5EEAD4;}
/* オンライン対戦：①形式 → ②モード → ③対戦。選んでいるカードは金の枠と「選択中」。戻るボタンは上に固定 */
.ol-bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;margin:-4px 0 10px;padding:10px 0;background:linear-gradient(180deg,var(--bg) 72%,rgba(0,0,0,0));}
.ol-back{display:inline-flex;align-items:center;gap:6px;flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line-2);background:rgba(10,12,20,.85);color:var(--tx-2);font-size:13px;font-weight:700;letter-spacing:.04em;transition:.15s;}
.ol-back:hover{color:var(--tx);border-color:var(--gold);}
.ol-back svg.i{width:16px;height:16px;}
.ol-steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0;padding:0;list-style:none;font-size:11.5px;color:var(--tx-3);}
.ol-steps li{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid transparent;white-space:nowrap;}
.ol-steps li i{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.08);font-family:var(--f-ui);font-size:10px;font-style:normal;font-weight:700;}
.ol-steps li b{color:var(--tx-2);}
.ol-steps li.done i{background:var(--gold);color:var(--gold-ink);}
.ol-steps li.cur{border-color:rgba(255,197,61,.5);color:var(--tx);background:rgba(255,197,61,.08);}
.ol-steps .sep{opacity:.35;}
.ol-sec{margin-bottom:18px;animation:item-in .35s var(--ease) both;}
.ol-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:14px;font-weight:900;letter-spacing:.04em;color:var(--tx);}
.ol-h i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,197,61,.14);color:var(--gold);font-family:var(--f-ui);font-size:12px;font-style:normal;font-weight:700;}
.ol-fmts{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ol-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media (max-width:640px){.ol-fmts,.ol-modes{grid-template-columns:1fr;}}
.ol-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;min-height:100%;padding:16px 16px 14px;text-align:left;border-radius:16px;border:1px solid var(--line);background:var(--panel);color:var(--tx);transition:transform .18s var(--ease),border-color .18s,box-shadow .18s,opacity .18s;}
.ol-card:hover{transform:translateY(-2px);border-color:var(--line-2);}
.ol-card.big{padding:20px 20px 18px;}
.ol-card .ol-ic{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.05);color:var(--gold);}
.ol-card .ol-ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ol-card .ol-name{font-family:var(--f-disp);font-weight:400;font-size:15px;letter-spacing:.02em;white-space:nowrap;}
.ol-card.big .ol-name{font-size:30px;line-height:1;}
.ol-card .ol-sub{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gold);}
.ol-card .ol-desc{font-size:12px;line-height:1.6;color:var(--tx-3);}
.ol-card .ol-me{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:2px;margin-top:auto;padding-top:8px;width:100%;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--tx-2);}
.ol-card .ol-me > span{white-space:nowrap;}
.ol-card .ol-me canvas{width:26px;height:26px;flex:none;}
.ol-card .ol-me small{flex-basis:100%;font-size:11px;font-weight:600;line-height:1.5;color:var(--tx-3);}
.ol-card .ol-why{display:block;margin-top:4px;font-size:11.5px;font-weight:700;color:#FF8A96;}
.ol-card .ol-badge{position:absolute;top:10px;right:10px;display:none;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;background:var(--gold);color:var(--gold-ink);font-size:10px;font-weight:900;letter-spacing:.06em;}
.ol-card.sel{border:2px solid var(--gold);background:linear-gradient(180deg,rgba(255,197,61,.12),rgba(255,197,61,.03)),var(--panel);box-shadow:0 0 0 4px rgba(255,197,61,.12),0 16px 36px -18px rgba(255,180,0,.7);}
.ol-card.sel .ol-badge{display:inline-flex;}
.ol-card.dim{opacity:.5;}
.ol-card.dim:hover{opacity:.85;}
.ol-card.off{cursor:not-allowed;filter:grayscale(.75);opacity:.6;transform:none;}
.ol-card.off .ol-ic{color:var(--tx-3);}
.ol-note{margin:8px 0 0;font-size:12px;line-height:1.6;color:var(--tx-3);text-align:center;}
#ol-friend{display:grid;gap:0;}
#room-status{min-height:20px;margin-top:6px;text-align:center;font-size:13px;color:var(--tx-2);}
.room-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;}
.room-card h3{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:900;letter-spacing:.04em;color:var(--tx);margin-bottom:14px;}
.room-card h3 .tag{font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:.2em;padding:3px 8px;border-radius:5px;background:rgba(255,197,61,.12);color:var(--gold);}
.room-input{width:100%;padding:14px;margin-bottom:10px;border:1px solid var(--line-2);border-radius:12px;background:rgba(0,0,0,.35);color:var(--tx);font-family:var(--f-ui);font-size:26px;font-weight:700;letter-spacing:.5em;text-indent:.5em;text-align:center;outline:none;transition:.18s;}
.room-input::placeholder{font-family:var(--f-jp);font-size:13px;font-weight:500;letter-spacing:.1em;text-indent:0;color:var(--tx-3);}
.room-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,61,.15);}
.room-btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--gold-grad);color:var(--gold-ink);font-size:14px;font-weight:900;letter-spacing:.08em;box-shadow:0 10px 26px -12px rgba(255,180,0,.55),inset 0 1px 0 rgba(255,255,255,.45);transition:.18s var(--ease);}
.room-btn:hover{filter:brightness(1.05);transform:translateY(-1px);}
#room-number-display{display:none;padding:12px 0 4px;font-family:var(--f-ui);font-size:46px;font-weight:700;letter-spacing:.34em;text-indent:.34em;text-align:center;color:var(--gold);text-shadow:0 0 26px rgba(255,197,61,.35);}
#room-status{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--tx-2);text-align:center;}
#room-status:empty{display:none;}
.ping-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);animation:ping 1.6s infinite;}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}80%,100%{box-shadow:0 0 0 8px rgba(52,211,153,0)}}

/* ---------- 設定 / プロフィール ---------- */
.settings-section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
.settings-section h3{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:14px;font-weight:900;letter-spacing:.05em;color:var(--tx);}
.settings-section h3 span{font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:.24em;color:var(--gold);}
.kb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);}
.kb-row:last-of-type{border-bottom:none;}
.kb-label{font-size:13.5px;color:var(--tx-2);}
.kb-key{min-width:86px;padding:6px 14px;text-align:center;font-family:var(--f-ui);font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--tx);background:linear-gradient(180deg,#252A3A,#1A1E2A);border:1px solid rgba(255,255,255,.12);border-bottom:3px solid rgba(0,0,0,.6);border-radius:8px;cursor:pointer;transition:border-color .15s,background .15s;}
.kb-key:hover{border-color:rgba(255,197,61,.55);border-bottom-color:rgba(0,0,0,.6);}
.kb-key.listening{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);animation:blink .8s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
.settings-reset{width:100%;padding:11px;margin-top:2px;border:1px dashed var(--line-2);border-radius:12px;background:transparent;color:var(--tx-3);font-size:12.5px;font-weight:700;transition:.15s;}
.settings-reset:hover{color:var(--foe);border-color:rgba(255,77,94,.5);}
.profile-name-row{display:flex;gap:8px;}
.profile-name-row input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line-2);border-radius:10px;background:rgba(0,0,0,.35);color:var(--tx);font-size:15px;font-weight:700;outline:none;transition:.18s;}
.profile-name-row input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,61,.15);}
.profile-name-row button{padding:0 20px;border:0;border-radius:10px;background:var(--gold-grad);color:var(--gold-ink);font-size:13px;font-weight:900;letter-spacing:.06em;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.stat{padding:14px 8px 12px;text-align:center;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;}
.stat b{display:block;font-family:var(--f-ui);font-size:30px;font-weight:700;line-height:1;color:var(--tx);}
.stat span{display:block;margin-top:7px;font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:.22em;color:var(--tx-3);}
.stat.win b{color:var(--ok);}.stat.lose b{color:var(--foe);}.stat.rate b{color:var(--gold);}
.profile-empty{padding:8px 0;font-size:13px;color:var(--tx-3);text-align:center;}
.profile-row{display:grid;grid-template-columns:62px 1fr 76px 42px;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--tx-2);}
.profile-row:last-child{border-bottom:none;}
.profile-diff{font-weight:900;color:var(--tx);}
.pr-bar{height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;}
.pr-bar i{display:block;height:100%;border-radius:99px;background:var(--lc,var(--gold));}
.pr-wl{font-family:var(--f-ui);font-size:12px;font-weight:600;text-align:right;}
.profile-rate{font-family:var(--f-ui);font-weight:700;color:var(--gold);text-align:right;}
#tier-badge-wrap{text-align:center;margin-bottom:14px;}
#tier-badge{position:relative;isolation:isolate;display:inline-grid;place-items:center;min-width:132px;padding:14px 34px;margin-bottom:10px;font-family:var(--f-ui);font-size:30px;font-weight:700;letter-spacing:.04em;color:#0B0D14;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,16px 100%,0 50%);}
#tier-badge::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%,rgba(0,0,0,.14));}
#tier-badge::before{content:"";position:absolute;top:0;bottom:0;width:56px;left:-70px;z-index:-1;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));animation:badge-shine 3.6s ease-in-out infinite;}
@keyframes badge-shine{0%{left:-70px}55%,100%{left:100%}}
.mm-card .mm-btn{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:8px;padding:12px;}
.mm-card .mm-btn b{font-family:var(--f-disp);font-size:15px;letter-spacing:.02em;}
.mm-card .mm-btn small{font-size:10.5px;font-weight:600;color:var(--tx-3);}
.mm-card .mm-btn.off,.mm-card .mm-btn:disabled{opacity:.55;filter:grayscale(.7);cursor:not-allowed;transform:none;}
.mm-card .mm-btn.alt{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:var(--tx-1);}
.mm-card .mm-cancel{margin-top:10px;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.14);color:var(--tx-2);}
#mm-wait{text-align:center;}
#mm-wait-main{margin-top:6px;font-size:12.5px;font-weight:700;color:var(--tx-2);}
#mm-wait-time{margin-top:2px;font-family:var(--f-disp);font-size:26px;line-height:1.1;color:var(--tx-1);}
#mm-wait-sub{margin-top:4px;font-size:11.5px;color:var(--tx-3);}
.mm-radar{position:relative;height:38px;}
.mm-radar span{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid var(--acc);border-radius:99px;opacity:0;animation:mm-ping 2.4s ease-out infinite;}
.mm-radar span:nth-child(2){animation-delay:.8s}
.mm-radar span:nth-child(3){animation-delay:1.6s}
@keyframes mm-ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(4.2);opacity:0}}
#toast{position:fixed;left:50%;bottom:28px;z-index:9000;transform:translate(-50%,20px);padding:10px 18px;border-radius:12px;background:rgba(20,22,32,.94);border:1px solid rgba(52,211,153,.55);color:#D1FAE5;font-size:13px;font-weight:700;letter-spacing:.03em;box-shadow:0 10px 30px -10px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
#toast.on{opacity:1;transform:translate(-50%,0);}
#tier-score{margin-bottom:12px;font-size:12px;color:var(--tx-2);}
#tier-score .rate-now{font-size:12px;}
#tier-score .rate-now b{margin-left:6px;font-family:var(--f-disp);font-size:22px;color:var(--tx-1);vertical-align:-2px;}
#tier-score .rate-tier{margin-left:10px;font-size:11.5px;color:var(--tx-3);}
#tier-score .rate-note{margin-top:6px;font-size:11px;color:var(--tx-3);}
#hb-rate{display:block;margin-top:1px;font-family:var(--f-disp);font-size:13px;line-height:1;color:var(--tx-2);}
#tier-progress-wrap{height:6px;margin-bottom:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;}
#tier-progress-bar{height:100%;width:0%;border-radius:99px;box-shadow:0 0 12px currentColor;transition:width .6s var(--ease);}
#tier-next{font-size:11.5px;color:var(--tx-3);}
#tier-ladder{display:flex;flex-direction:column;gap:4px;margin-top:14px;}
.tier-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 12px;border:1px solid transparent;border-radius:8px;background:rgba(255,255,255,.02);font-size:11.5px;color:var(--tx-3);}
.tier-row>span:first-child{display:flex;align-items:center;font-family:var(--f-ui);font-weight:700;letter-spacing:.06em;color:var(--tx-2);}
.tier-row.current{background:rgba(255,197,61,.07);border-color:rgba(255,197,61,.45);color:var(--tx);}
.tier-row.current>span:first-child{color:var(--tx);}
.tier-dot{display:inline-block;width:8px;height:8px;margin-right:10px;border-radius:2px;transform:rotate(45deg);}

/* ---------- ランキング ---------- */
#rank-screen{max-width:680px;margin:0 auto;}
.rk-row{display:grid;grid-template-columns:38px 1fr 54px 62px 52px;align-items:center;gap:8px;padding:8px 10px;border:1px solid transparent;border-radius:10px;font-size:12.5px;color:var(--tx-2);}
.rk-row+.rk-row{margin-top:4px;}
.rk-head{padding:4px 10px;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--tx-3);}
#rank-list .rk-row{background:rgba(255,255,255,.025);}
#rank-list .rk-row:nth-child(odd){background:rgba(255,255,255,.045);}
.rk-no{font-family:var(--f-disp);font-size:15px;color:var(--tx-3);text-align:center;}
.rk-who{display:flex;align-items:center;gap:8px;min-width:0;}
.rk-who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--tx-1);}
.rk-who small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px;color:var(--tx-3);}
.rk-who .rk-col{display:flex;flex-direction:column;min-width:0;line-height:1.25;}
.rk-tier{font-family:var(--f-ui);font-weight:800;font-size:11px;letter-spacing:.06em;text-align:center;}
.rk-rate{font-family:var(--f-disp);font-size:15px;color:var(--tx-1);text-align:right;}
.rk-wr{font-size:11.5px;color:var(--tx-3);text-align:right;}
.rk-row canvas{width:26px;height:26px;flex:0 0 26px;}
.rk-1,.rk-2,.rk-3{border-color:rgba(255,255,255,.14);}
.rk-1{background:linear-gradient(90deg,rgba(255,197,61,.22),rgba(255,197,61,.05))!important;border-color:rgba(255,197,61,.55);box-shadow:0 0 18px -8px rgba(255,197,61,.9);}
.rk-2{background:linear-gradient(90deg,rgba(214,222,232,.18),rgba(214,222,232,.04))!important;border-color:rgba(214,222,232,.45);}
.rk-3{background:linear-gradient(90deg,rgba(192,122,69,.2),rgba(192,122,69,.04))!important;border-color:rgba(192,122,69,.5);}
.rk-1 .rk-no,.rk-2 .rk-no,.rk-3 .rk-no{font-size:17px;color:var(--tx-1);}
.rk-1 canvas,.rk-2 canvas,.rk-3 canvas{width:34px;height:34px;flex:0 0 34px;}
.rk-me{border-color:rgba(183,148,255,.6)!important;background:rgba(183,148,255,.14)!important;}
#rank-me .rk-me{margin-top:10px;}
.rk-me .rk-col b::after{content:"YOU";margin-left:6px;padding:1px 5px;border-radius:4px;background:rgba(183,148,255,.3);font-size:9px;letter-spacing:.08em;color:#E3D6FF;vertical-align:1px;}
.rk-empty{padding:22px 10px;text-align:center;font-size:12px;color:var(--tx-3);}
#rank-note{margin-top:8px;}

/* ---------- ステージ選択（1つずつ大きく） ---------- */
#stage-screen{max-width:1060px;margin:0 auto;}
.st-wrap{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:14px;}
.st-arrow{display:grid;place-items:center;width:48px;height:48px;padding:0;border-radius:50%;background:var(--panel);border:1px solid var(--line-2);color:var(--tx-2);transition:transform .18s var(--ease),color .18s,border-color .18s;}
.st-arrow:hover{color:var(--gold);border-color:rgba(255,197,61,.55);transform:scale(1.08);}
.st-arrow svg.i{width:22px;height:22px;}
.st-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:center;padding:16px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--panel);border:1px solid var(--line);border-radius:18px;}
.st-main.in-r{animation:st-in-r .38s var(--ease) both;}
.st-main.in-l{animation:st-in-l .38s var(--ease) both;}
@keyframes st-in-r{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes st-in-l{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.st-preview{position:relative;overflow:hidden;aspect-ratio:2/1;border-radius:12px;border:1px solid var(--line-2);background:#0B0E1A;box-shadow:0 22px 50px -26px rgba(0,0,0,.9);}
.st-preview canvas{display:block;width:100%;height:100%;}
.st-new{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:6px;background:var(--gold-grad);color:var(--gold-ink);font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.16em;box-shadow:0 6px 16px -6px rgba(255,180,0,.7);}
.st-map{display:block;width:100%;height:auto;margin-top:10px;border-radius:8px;border:1px solid var(--line);}
.st-info{min-width:0;}
.st-no{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.26em;color:var(--gold);}
.st-name{margin:8px 0 4px;font-family:var(--f-disp);font-weight:400;font-size:30px;line-height:1.25;letter-spacing:.04em;color:var(--tx);}
.st-theme{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13.5px;font-weight:900;letter-spacing:.06em;color:var(--gold);}
.st-theme::before{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 8px rgba(255,197,61,.7);}
.st-desc{font-size:14px;line-height:1.8;color:var(--tx-2);}
.st-tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 20px;}
.st-tags span{padding:4px 11px;border-radius:99px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);font-size:11.5px;font-weight:700;color:var(--tx-2);}
.st-keys{margin-top:10px;font-size:11px;color:var(--tx-3);text-align:center;}
.st-dots{display:flex;justify-content:center;gap:8px;margin:18px 0 4px;}
.st-dots button{width:9px;height:9px;padding:0;border:0;border-radius:99px;background:rgba(255,255,255,.2);transition:width .25s var(--ease),background .2s;}
.st-dots button.sel{width:28px;background:var(--gold);}
@media (max-width:820px){
  .st-main{grid-template-columns:1fr;gap:14px;padding:12px;}
  .st-wrap{grid-template-columns:34px minmax(0,1fr) 34px;gap:6px;}
  .st-arrow{width:34px;height:34px;}
  .st-name{font-size:24px;}
}

/* ---------- 武器セット ---------- */
.menu.wide{max-width:780px;}
.lo-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px;}
.lo-slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--tx);transition:border-color .18s,box-shadow .18s,transform .18s var(--ease);}
.lo-slot:hover{border-color:var(--line-2);transform:translateY(-1px);}
.lo-slot.sel{border-color:var(--wc);box-shadow:inset 0 0 0 1px var(--wc),0 14px 32px -18px var(--wc);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0)),var(--panel);}
.ls-no{font-family:var(--f-ui);font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--tx-3);}
.lo-slot.sel .ls-no{color:var(--wc);}
.lo-slot canvas,.lo-card canvas{border-radius:8px;background:rgba(0,0,0,.28);}
.lo-slot canvas{width:96px;height:40px;}
.lo-slot b{font-size:14px;font-weight:900;letter-spacing:.03em;}
.lo-hint{margin:0 0 14px;font-size:12px;color:var(--tx-3);text-align:center;}
.lo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:8px;}
.lo-card{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:start;padding:10px 12px 11px 10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--tx);transition:border-color .15s,transform .15s var(--ease),box-shadow .15s;animation:item-in .45s var(--ease) both;animation-delay:calc(var(--i,0)*28ms);}
.lo-card:hover{border-color:var(--wc);transform:translateY(-1px);box-shadow:0 12px 28px -18px var(--wc);}
.lo-card.eq{border-color:rgba(255,255,255,.2);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,0)),var(--panel);}
.lo-card canvas{width:84px;height:36px;margin-top:4px;}
.lc-body{display:flex;flex-direction:column;min-width:0;}
.lc-name{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:900;line-height:1.3;}
.lc-name small{font-family:var(--f-ui);font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--wc);}
.lc-eq{margin-left:auto;display:grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:5px;background:var(--wc);color:#0B0D14;font-family:var(--f-ui);font-size:10px;font-weight:700;}
.lc-desc{margin:3px 0 7px;font-size:10.5px;line-height:1.5;color:var(--tx-3);}
.lc-stats{display:grid;grid-template-columns:auto 1fr auto;gap:3px 7px;align-items:center;font-size:9.5px;font-weight:700;color:var(--tx-3);}
.lc-bar{height:4px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;}
.lc-bar i{display:block;height:100%;border-radius:9px;background:var(--wc);}
.lc-val{font-family:var(--f-ui);font-weight:600;color:var(--tx-2);text-align:right;min-width:40px;}
.pill-btn{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0 6px;padding:5px 12px;border:1px solid rgba(255,197,61,.4);border-radius:99px;background:rgba(255,197,61,.08);color:var(--gold);font-size:12px;font-weight:700;transition:.15s;}
.pill-btn:hover{background:rgba(255,197,61,.16);}
.pill-btn svg.i{width:13px;height:13px;}

/* ---------- ゲーム画面 ---------- */
#game-screen{max-width:860px;margin:0 auto;}
.canvas-frame{padding:1px;border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.04));box-shadow:0 30px 80px -30px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.6);}
#c{display:block;width:100%;height:auto;border-radius:14px;background:#0B0E1A;}
#online-hud{display:none;margin-top:6px;font-size:11px;color:var(--ok);text-align:center;}
/* 試合前の準備・ラウンド間の武器変更（オンライン） */
#match-panel{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;display:none;padding:10px 12px;border-radius:12px;background:rgba(7,9,16,.92);border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 40px -18px rgba(0,0,0,.9);color:var(--tx-1);font-size:12px;}
#match-panel.on{display:block;}
#match-panel.pick{top:10px;overflow:auto;}
@media (max-width:700px){#match-panel.pick{position:fixed;inset:0;z-index:60;border-radius:0;padding:14px;}}
.mp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.mp-head b{font-family:var(--f-disp);font-size:14px;letter-spacing:.02em;}
.mp-time{font-family:var(--f-disp);font-size:22px;line-height:1;color:#FFC53D;}
.mp-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#match-panel.prep .mp-cols{grid-template-columns:1fr;}
.mp-col h4{margin:0 0 5px;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--tx-3);}
.mp-col.opp h4{color:#FF8A96;}
.mp-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.mp-w{display:flex;align-items:center;gap:7px;min-width:0;padding:6px 7px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);text-align:left;color:inherit;font:inherit;}
button.mp-w{cursor:pointer;}
.mp-w.sel{border-color:#FFC53D;background:rgba(255,197,61,.12);box-shadow:0 0 0 1px rgba(255,197,61,.35);}
.mp-w canvas{width:58px;height:25px;flex:0 0 58px;}
.mp-w .mw-t{min-width:0;}
.mp-w b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;}
.mp-w small{display:block;font-size:9.5px;line-height:1.35;color:var(--tx-3);}
.mp-hint{margin:8px 0 4px;font-size:10.5px;color:var(--tx-3);}
.mp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.mp-grid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--tx-2);font-size:9.5px;font-weight:700;cursor:pointer;}
.mp-grid button:hover{border-color:rgba(255,255,255,.3);color:var(--tx-1);}
.mp-grid button.eq{border-color:rgba(255,197,61,.5);color:#FFD968;}
.mp-grid canvas{width:48px;height:21px;}
.mp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;}
.mp-ready{font-size:11.5px;color:var(--tx-2);}
.mp-ready .ok{color:#34D399;font-weight:800;}
.mp-ok{padding:9px 18px;border:0;border-radius:10px;background:linear-gradient(180deg,#FFD968,#F5B400);color:#1a1300;font-size:13px;font-weight:900;letter-spacing:.03em;cursor:pointer;}
.mp-ok:disabled{opacity:.45;cursor:default;}
@media (max-width:700px){.mp-grid{grid-template-columns:repeat(5,1fr);}.mp-row{grid-template-columns:1fr;}}
#btns{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;}
#btns button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;padding:9px 4px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),var(--panel-solid);border:1px solid var(--line);border-bottom:3px solid rgba(0,0,0,.55);border-radius:12px;color:var(--tx-2);font-size:11.5px;font-weight:700;letter-spacing:.04em;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .08s,background .12s,color .12s;}
#btns button:active{transform:translateY(2px);background:var(--panel-hi);color:var(--tx);}
#btns .b-atk{background:linear-gradient(180deg,rgba(255,77,94,.24),rgba(255,77,94,.08)),var(--panel-solid);border-color:rgba(255,77,94,.42);border-bottom-color:rgba(0,0,0,.55);color:#FFD6DA;}
#weapon-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;}
#weapon-bar button{position:relative;display:flex;align-items:center;gap:10px;padding:9px 12px;overflow:hidden;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:var(--tx-2);transition:color .15s,border-color .15s,box-shadow .15s,background .15s;}
#weapon-bar button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--wc);transform:scaleX(0);transition:transform .25s var(--ease);}
#weapon-bar button:hover{color:var(--tx);border-color:var(--line-2);}
#weapon-bar kbd{display:grid;place-items:center;flex:none;min-width:22px;height:22px;padding:0 5px;border:1px solid var(--line-2);border-radius:6px;background:rgba(255,255,255,.06);font-size:11px;color:var(--tx-2);transition:.15s;}
#weapon-bar .wn{display:flex;flex-direction:column;min-width:0;line-height:1.2;font-size:13px;font-weight:900;white-space:nowrap;}
#weapon-bar .wn small{font-family:var(--f-ui);font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--tx-3);}
#weapon-bar button.active{color:var(--tx);border-color:var(--wc);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0)),var(--panel-solid);box-shadow:0 0 24px -10px var(--wc);}
#weapon-bar button.active::after{transform:scaleX(1);}
#weapon-bar button.active kbd{background:var(--wc);border-color:transparent;color:#0B0D14;}
#w-1,#w-2,#w-3{--wc:#FACC15;}
#w-reload{--wc:#FB923C;}
#w-heal{--wc:#34D399;border-color:rgba(52,211,153,.35);}
#w-heal .wn{color:#8EF0C4;}
#w-heal:disabled{cursor:not-allowed;filter:grayscale(1);}
#difficulty-bar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 12px;margin-top:12px;}
.bar-label{font-size:11.5px;font-weight:700;color:var(--tx-3);}
.seg{display:inline-flex;gap:2px;padding:3px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:11px;}
#difficulty-bar button{padding:6px 13px;border:0;border-radius:8px;background:transparent;color:var(--tx-3);font-size:12px;font-weight:700;transition:.15s;}
#difficulty-bar button:hover{color:var(--tx);}
#difficulty-bar button.active{background:var(--tx);color:var(--bg);}
#difficulty-bar.locked button{opacity:.35;cursor:not-allowed;pointer-events:none;}
#difficulty-bar.locked button.active{opacity:.75;}
#difficulty-bar .lock-note{display:none;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--foe);}
#difficulty-bar.locked .lock-note{display:inline-flex;}
.lock-note svg.i{width:13px;height:13px;}
#hint{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:11.5px;color:var(--tx-3);}
#hint kbd{display:inline-block;padding:1px 7px;margin-right:4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:rgba(255,255,255,.04);font-size:10.5px;color:var(--tx-2);}
/* 対戦中は操作パネルを隠して画面を広く使う */
body.in-game #wrap{max-width:1340px;}
#game-screen{max-width:min(1280px,100%);}
.canvas-frame{position:relative;width:100%;margin:0 auto;}
@media (min-height:560px){
  .canvas-frame{width:min(100%,max(480px,calc((100vh - 230px) * 2)));width:min(100%,max(480px,calc((100dvh - 230px) * 2)));}
  #game-screen.playing .canvas-frame{width:min(100%,max(480px,calc((100vh - 120px) * 2)));width:min(100%,max(480px,calc((100dvh - 120px) * 2)));}
  body.touch #game-screen.playing .canvas-frame{width:min(100%,max(480px,calc((100vh - 340px) * 2)));width:min(100%,max(480px,calc((100dvh - 340px) * 2)));}
}
#game-screen.playing #weapon-bar,#game-screen.playing #difficulty-bar,#game-screen.playing #hint,#game-screen.playing #btns,#game-screen.playing #back-to-menu{display:none;}
body.touch #game-screen.playing #btns{display:grid;}
body.touch #game-screen.playing #weapon-bar{display:grid;}
body.touch #game-screen.playing #back-to-menu{display:flex;}
#fs-btn{position:absolute;top:10px;right:10px;z-index:5;display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line-2);border-radius:8px;background:rgba(10,12,20,.55);color:var(--tx-2);opacity:.5;transition:.15s var(--ease);}
#fs-btn:hover{opacity:1;color:var(--tx);}
#fs-btn svg.i{width:16px;height:16px;}
.canvas-frame:fullscreen{width:100vw;height:100vh;max-width:none;display:flex;align-items:center;justify-content:center;padding:0;border-radius:0;background:#07080C;box-shadow:none;}
.canvas-frame:fullscreen canvas{width:min(100vw,calc(100vh * 2));height:auto;border-radius:0;}
@media (max-width:600px){
  #wrap{padding:20px 12px 28px;}
  #weapon-bar{grid-template-columns:repeat(5,1fr);gap:5px;}
  #weapon-bar button{padding:8px 6px;gap:4px;}
  #weapon-bar .wn{font-size:11px;}
  .lo-slot canvas{width:72px;height:30px;}
  .lo-slot b{font-size:12px;}
  #weapon-bar kbd{display:none;}
  .stage-card{grid-template-columns:104px 1fr;gap:12px;}
  .sc-prev{width:104px;height:52px;}
  .scr-title{font-size:24px;}
  #room-number-display{font-size:38px;}
  #hint{display:none;}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}}

/* ---------- 右上のボタン ---------- */
#corner{position:fixed;top:12px;right:12px;z-index:999;display:flex;gap:6px;}
.corner-btn{width:36px;height:36px;display:grid;place-items:center;background:rgba(18,21,31,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;color:var(--tx-3);transition:.2s var(--ease);}
.corner-btn svg.i{width:17px;height:17px;}
.corner-btn:hover{color:var(--tx);border-color:rgba(255,255,255,.28);}
#settings-btn svg.i{transition:transform .5s var(--ease);}
#settings-btn:hover svg.i{transform:rotate(60deg);}
body.in-game #settings-btn{display:none;}

/* ---------- ホームの背景デモ ---------- */
#bg-demo{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;opacity:0;filter:blur(1.5px) saturate(1.15);transition:opacity 1s var(--ease);pointer-events:none;}
#bg-shade{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1s var(--ease);
  background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(7,8,12,.34),rgba(7,8,12,.78) 78%),linear-gradient(180deg,rgba(7,8,12,.45),rgba(7,8,12,.2) 40%,rgba(7,8,12,.7));}
body.demo #bg-demo{opacity:1;}
body.demo #bg-shade{opacity:1;}

/* ---------- ホーム ---------- */
#mode-screen{max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:calc(100vh - 64px);min-height:calc(100dvh - 64px);}
.home-main{margin:auto 0;text-align:center;min-width:0;}   /* バーは上、メニューは残りの高さの真ん中 */
@media (max-width:900px){#mode-screen{padding-top:34px;}}   /* 右上のボタンとバーが重ならないように */
@media (max-width:480px){
  .home-bar{grid-template-columns:46px minmax(0,1fr) auto 16px;gap:10px;}
  .hb-av{width:46px;height:46px;}
  .hb-tier span{display:none;}
  .play-btn{min-height:128px;padding:14px 10px;}
  .play-btn b{font-size:17px;}
  .play-btn small{font-size:10.5px;}
}

/* ---------- 言語の切り替え ---------- */
.lang-seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px;padding:4px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;}
.lang-seg button{padding:10px;border:0;border-radius:9px;background:transparent;color:var(--tx-3);font-size:13px;font-weight:900;transition:.15s;}
.lang-seg button:hover{color:var(--tx);}
.lang-seg button.sel{background:var(--tx);color:var(--bg);}
.tos-lang{margin-bottom:12px;}

/* ---------- 音量 ---------- */
.vol-row{display:grid;grid-template-columns:120px 1fr 48px;align-items:center;gap:14px;padding:8px 0;font-size:13.5px;color:var(--tx-2);}
.vol-row input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;margin:0;border-radius:99px;background:linear-gradient(90deg,var(--gold) var(--p,50%),rgba(255,255,255,.1) var(--p,50%));outline:none;cursor:pointer;}
.vol-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.5);}
.vol-row input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--gold);}
.vol-val{font-family:var(--f-ui);font-size:13px;font-weight:700;text-align:right;color:var(--tx);}

/* ---------- プロフィール ---------- */
.pf-top{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start;margin-bottom:12px;}
.pf-card canvas{display:block;width:100%;height:auto;}
.pf-edit .settings-section:last-child{margin-bottom:0;}
.pf-input{width:100%;padding:11px 14px;border:1px solid var(--line-2);border-radius:10px;background:rgba(0,0,0,.35);color:var(--tx);font-size:15px;font-weight:700;outline:none;transition:.18s;}
.pf-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,197,61,.15);}
.pf-note{margin-top:8px;font-size:11.5px;color:var(--tx-3);}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.title-chip{padding:8px 16px;border-radius:99px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);font-size:13px;font-weight:900;color:var(--tx-2);transition:.15s;}
.title-chip:hover{color:var(--tx);}
.title-chip.sel{border-color:var(--gold);color:var(--gold);background:rgba(255,197,61,.1);box-shadow:0 0 18px -6px rgba(255,197,61,.6);}
/* 二つ名（レアの称号）：中が暗い文字を、細い光の管でふち取る（後ろに帯は敷かない）。光は控えめ、ときどき一瞬ちらつく */
.title-chip.rare,.fr-info .nt,.hb-title.nt{font-family:var(--f-neon);font-weight:400;letter-spacing:.05em;color:rgba(8,10,40,.8);
  -webkit-text-stroke:.9px #CBD2FF;text-shadow:0 0 3px rgba(120,130,255,.95),0 0 7px rgba(99,102,241,.45);
  animation:neon-flick 6.2s linear infinite;}
.title-chip.rare{padding:7px 16px;font-size:16px;border-color:rgba(160,150,255,.45);}
.title-chip.rare:hover{border-color:#B9B2FF;}
.title-chip.rare.sel{background:rgba(255,255,255,.03);border-color:#E4E0FF;box-shadow:0 0 0 1px rgba(210,205,255,.6),0 0 14px -4px rgba(120,110,255,.9);}
@keyframes neon-flick{0%,64%,65.2%,66.4%,100%{opacity:1}64.6%{opacity:.6}65.8%{opacity:.75}}
.hb-title.nt,.fr-info .nt{font-size:14px;-webkit-text-stroke:.7px #CBD2FF;}
/* 贈られた称号（開発者から）：緑のネオン。レアと同じ作りで色だけ変える */
.title-chip.gift,.fr-info .gt,.hb-title.gt,.rk-row small.gt{font-family:var(--f-neon);font-weight:400;letter-spacing:.05em;color:rgba(3,26,19,.8);
  -webkit-text-stroke:.9px #9CFFD8;text-shadow:0 0 3px rgba(45,240,170,.95),0 0 7px rgba(16,185,129,.5);
  animation:neon-flick 6.2s linear infinite;}
.title-chip.gift{padding:7px 16px;font-size:16px;border-color:rgba(94,234,212,.45);}
.title-chip.gift:hover{border-color:#7FFFD4;}
.title-chip.gift.sel{background:rgba(255,255,255,.03);border-color:#B8FFE9;box-shadow:0 0 0 1px rgba(150,255,220,.55),0 0 14px -4px rgba(16,220,160,.9);}
.hb-title.gt,.fr-info .gt{font-size:14px;-webkit-text-stroke:.7px #9CFFD8;}
/* 運営の印（丸に✓）：白銀の丸に濃いチェック。称号の横ではなく、名前の横に付く */
.dev-badge{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;vertical-align:-2px;flex:none;}
.dev-badge svg{width:100%;height:100%;overflow:visible;}
.dev-badge circle{fill:#DCE6F5;stroke:rgba(6,9,16,.7);stroke-width:1.6;}
.dev-badge path{fill:none;stroke:#0B0E14;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;}
.hb-name .dev-badge,.fr-info b .dev-badge,.rk-col b .dev-badge{width:14px;height:14px;margin-left:4px;}
.acc-row .dev-badge{margin-left:4px;}
/* この世界の創造主：明朝の白銀に、プリズム（虹）の光が流れる */
.title-chip.prism{padding:7px 18px;font-size:16px;border-color:rgba(200,220,245,.5);background:linear-gradient(135deg,#090c12,#151c29);}
.title-chip.prism:hover{border-color:#DCE6F5;}
.title-chip.prism.sel{border-color:#FFFFFF;box-shadow:0 0 0 1px rgba(220,235,255,.55),0 0 18px -4px rgba(190,220,255,.9);}
.sv{display:inline-block;font-family:var(--f-mincho);font-weight:800;letter-spacing:.08em;
  background:linear-gradient(100deg,#9FB0C8 0%,#FFFFFF 14%,#FFB3D0 25%,#FFE49A 33%,#A8F2D6 43%,#A8D4FF 53%,#D2B6FF 62%,#FFFFFF 78%,#9FB0C8 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 6px rgba(200,225,255,.45)) drop-shadow(0 1px 0 rgba(0,0,0,.85));animation:prism-sheen 5.2s linear infinite;}
.hb-title.sv,.fr-info .sv{font-size:14px;}
@keyframes prism-sheen{from{background-position:130% 0}to{background-position:-130% 0}}
/* 運営から贈られた称号のお祝い：暗くした画面に、光の輪・火花・称号（緑／白銀）*/
#gift-fx{position:fixed;inset:0;z-index:120;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
  background:radial-gradient(circle at 50% 47%,rgba(6,46,35,.93),rgba(2,5,8,.97) 62%);}
#gift-fx.on{display:flex;animation:gf-fade .45s ease both;}
#gift-fx.out{display:flex;animation:gf-fade .4s ease both reverse;}
@keyframes gf-fade{from{opacity:0}to{opacity:1}}
#gift-fx .gf-rings,#gift-fx .gf-spark{position:absolute;top:47%;left:50%;width:0;height:0;pointer-events:none;}
#gift-fx .gf-rings span{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border:1px solid rgba(94,234,212,.55);border-radius:50%;
  opacity:0;animation:gf-ring 2.9s cubic-bezier(.2,.8,.3,1) infinite;}
#gift-fx .gf-rings span:nth-child(2){animation-delay:.55s;}
#gift-fx .gf-rings span:nth-child(3){animation-delay:1.1s;}
@keyframes gf-ring{0%{transform:scale(.28);opacity:0}18%{opacity:.85}100%{transform:scale(3.6);opacity:0}}
#gift-fx .gf-spark i{position:absolute;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:#9CFFD8;box-shadow:0 0 9px rgba(45,240,170,.95);
  opacity:0;animation:gf-spark 2.1s ease-out infinite;}
@keyframes gf-spark{0%{opacity:0;transform:rotate(var(--a)) translateX(12px) scale(.6)}18%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.2)}}
#gift-fx .gf-from{margin:0;font-size:12px;font-weight:700;letter-spacing:.34em;color:rgba(190,255,235,.8);animation:gf-up .6s .35s ease both;}
#gift-fx .gf-title{margin:10px 0 2px;font-size:clamp(28px,7vw,46px);animation:gf-pop .7s .6s cubic-bezier(.2,1.5,.4,1) both;}
#gift-fx .gf-title .gt{font-family:var(--f-neon);font-weight:400;letter-spacing:.06em;font-size:inherit;color:rgba(3,26,19,.85);
  -webkit-text-stroke:1.6px #9CFFD8;text-shadow:0 0 9px rgba(45,240,170,.95),0 0 26px rgba(16,185,129,.6);animation:neon-flick 6.2s linear infinite;}
#gift-fx .gf-cond{margin:12px 0 0;max-width:min(420px,84vw);text-align:center;font-size:12px;font-weight:700;line-height:1.7;color:var(--tx-2);animation:gf-up .6s 1.15s ease both;}
#gift-fx .gf-tap{position:absolute;bottom:26px;margin:0;font-size:11px;letter-spacing:.2em;color:var(--tx-3);animation:gf-up .6s 1.9s ease both;}
#gift-fx.prism{background:radial-gradient(circle at 50% 47%,rgba(26,34,52,.94),rgba(2,4,8,.97) 62%);}
#gift-fx.prism .gf-rings span{border-color:rgba(214,230,255,.6);}
#gift-fx.prism .gf-spark i{background:#F2F7FF;box-shadow:0 0 10px rgba(210,230,255,.95);}
#gift-fx.prism .gf-from{color:rgba(226,236,255,.85);}
#gift-fx .gf-title .sv{font-size:inherit;letter-spacing:.1em;}
@keyframes gf-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes gf-pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:none}}
/* 鬼帝を討ちし者：黒と金。金の光が文字の上を流れる */
.title-chip.mythic{padding:7px 18px;font-size:16px;border-color:rgba(232,198,106,.6);background:linear-gradient(135deg,#0d0a05,#1d1406);}
.title-chip.mythic:hover{border-color:#F5DC8A;}
.title-chip.mythic.sel{border-color:#F5DC8A;box-shadow:0 0 0 1px rgba(245,220,138,.55),0 0 18px -4px rgba(255,190,70,.9);}
.mt{display:inline-block;font-family:var(--f-neon);font-weight:400;letter-spacing:.06em;
  background:linear-gradient(100deg,#9a7424 0%,#f6e3a1 20%,#c9a13f 38%,#fff6d6 50%,#b8862b 62%,#f6e3a1 80%,#9a7424 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 5px rgba(255,190,60,.45)) drop-shadow(0 1px 0 rgba(0,0,0,.8));animation:gold-sheen 3.8s linear infinite;}
.hb-title.mt,.fr-info .mt{font-size:14px;}
@keyframes gold-sheen{from{background-position:130% 0}to{background-position:-130% 0}}
.bg-opt.emp{border-color:rgba(232,198,106,.55);box-shadow:0 0 14px -4px rgba(255,190,70,.6);}
.bg-opt.emp.sel{border-color:#F5DC8A;box-shadow:0 0 0 1px rgba(245,220,138,.5),0 0 20px -2px rgba(255,190,70,.9);}
.profile-row.emp .profile-diff{color:#E8C66A;font-weight:900;}
.title-count{width:100%;font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--tx-3);}

.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;}
.bg-opt{position:relative;display:block;aspect-ratio:3/4;padding:0;overflow:hidden;border-radius:9px;border:2px solid rgba(255,255,255,.08);background:#0B0D14;transition:transform .15s var(--ease),border-color .15s;}
.bg-opt:hover{transform:translateY(-2px);}
.bg-opt canvas{display:block;width:100%;height:100%;}
.bg-opt.sel{border-color:var(--gold);box-shadow:0 0 16px -4px rgba(255,197,61,.7);}
.bg-opt.locked{cursor:not-allowed;}
.bg-opt.locked canvas{filter:grayscale(1) brightness(.35);}
.bg-opt .lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:rgba(255,255,255,.75);font-family:var(--f-ui);font-size:9px;font-weight:700;letter-spacing:.06em;}
.bg-opt .lk svg.i{width:14px;height:14px;}
.look-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.look-tab{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--tx-3);font-size:12px;font-weight:900;transition:.15s;}
.look-tab:hover{color:var(--tx);border-color:var(--line-2);}
.look-tab.sel{background:var(--tx);border-color:var(--tx);color:var(--bg);}
.look-tab.rand{margin-left:auto;border-style:dashed;}
.look-wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start;}
.look-prev{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;border:1px solid var(--line-2);background:#0B0D16;}
.look-prev canvas{display:block;width:100%;height:100%;}
.look-sub{margin:14px 0 8px;font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--tx-3);}
.look-sub:first-child{margin-top:0;}
.opt-grid{display:flex;flex-wrap:wrap;gap:8px;}
.opt{position:relative;display:grid;place-items:center;width:72px;height:72px;padding:0;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--line);transition:transform .15s var(--ease),border-color .15s;}
.opt:hover{transform:translateY(-2px);border-color:var(--line-2);}
.opt.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 0 18px -6px rgba(255,197,61,.6);}
.opt canvas{width:66px;height:66px;border-radius:11px;}
.opt.swatch{width:44px;height:44px;border-radius:50%;}
