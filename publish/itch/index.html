<!doctype html>
<!--
  itch.io などに載せる入り口のページ。公式サイト（GitHub Pages）のゲームを、そのまま枠の中に表示する。
  ・ゲームを更新すると、こちらも自動で最新になる（アップロードし直さなくてよい）
  ・ゲームの中で「ほかのサイトの中にいる」と分かると、Discordログインは新しいタブで公式サイトを開く
  使い方：このファイルだけを zip にして itch.io にアップロードし、「This file will be played in the browser」にチェック
  公式サイトのアドレスが変わったら、下の GAME_URL（2か所）を書きかえる
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GUN DUEL</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#0A0C15;overflow:hidden}
  #game{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#0A0C15}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    font:800 26px/1 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;letter-spacing:.24em;color:#E8C66A;
    pointer-events:none;transition:opacity .5s}
  #load small{font-size:11px;letter-spacing:.12em;color:rgba(232,228,220,.55);font-weight:600}
  #load.off{opacity:0}
</style>
</head>
<body>
<div id="load">GUN DUEL<small>LOADING…</small></div>
<iframe id="game" title="GUN DUEL" src="https://taitiii126-bot.github.io/gunduel2/"
  allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>
<script>
  // GAME_URL: https://taitiii126-bot.github.io/gunduel2/
  document.getElementById('game').addEventListener('load',function(){document.getElementById('load').className='off';});
</script>
</body>
</html>
