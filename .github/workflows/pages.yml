# 公開用のファイル（読みにくくした物）を作って GitHub Pages に出す。
# みんなが遊ぶ時間（シンガポール時間の16〜24時）に毎時くじを引き、当たったら作り直す（1晩に3回くらい・いつ変わるか分からない）。
# 作り直すたびに名前などが変わるので、チートは遊んでいる最中に動かなくなる
# 使うには：リポジトリの Settings → Pages → Build and deployment の Source を「GitHub Actions」にする。
# 切り替える前は、何もせずに終わる（失敗にはしない）
name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 8-15 * * *'   # UTC 8〜15時＝シンガポール時間16〜23時台
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | jq -r .build_type || true)
          echo "build_type=$t"
          if [ "$t" != "workflow" ]; then echo "Pages の Source が GitHub Actions ではないので、何もしません"; exit 0; fi
          # 時間で動いたときは、くじ（40%）に当たったときだけ作り直す。main への反映と手動のときは必ず作る
          if [ "${{ github.event_name }}" = "schedule" ] && [ $((RANDOM % 100)) -ge 40 ]; then echo "今回は作り直しません（くじ）"; exit 0; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.check.outputs.ok == 'true'
        run: npm i --no-save javascript-obfuscator@5.8.1 && BUILD_SEED="${{ github.run_id }}-${{ github.run_attempt }}" node tools/build.js
      - if: steps.check.outputs.ok == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.check.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
