# 公開用のファイル（読みにくくした物）を作って GitHub Pages に出す。毎日、シンガポール時間の朝4時ごろに作り直す（名前などが日替わりになる）
# 使うには：リポジトリの Settings → Pages → Build and deployment の Source を「GitHub Actions」にする。
# 切り替える前は、何もせずに終わる（失敗にはしない）
name: Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" | jq -r .build_type || true)
          echo "build_type=$t"
          if [ "$t" = "workflow" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Pages の Source が GitHub Actions ではないので、何もしません"; fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.check.outputs.ok == 'true'
        run: npm i --no-save javascript-obfuscator@5.8.1 && node tools/build.js
      - if: steps.check.outputs.ok == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.check.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
